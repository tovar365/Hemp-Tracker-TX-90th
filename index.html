// artifact viewer, which injects auth. Fails gracefully everywhere else.)
// ---------------------------------------------------------------------------
function liveUpdatePanelHtml(id, label) {
  var stored = null;
  try { stored = JSON.parse(localStorage.getItem(id) || "null"); } catch (e) {}
  var sub = stored ? "Last checked: " + new Date(stored.checkedAt).toLocaleString() : "Not checked yet";
  var resultHtml = stored ? '<div class="live-result" id="' + id + '-result">' + esc(stored.text) + "</div>" : '<div id="' + id + '-result"></div>';
  return (
    '<div class="live-panel">' +
      '<div class="live-panel-top">' +
        '<div><div class="live-title">' + label + '</div><div class="live-sub" id="' + id + '-sub">' + sub + "</div></div>" +
        '<button class="live-btn" id="' + id + '-btn" onclick="checkForUpdates(\'' + id + "')\">CHECK FOR UPDATES</button>" +
      "</div>" +
      resultHtml +
      '<div class="live-error" id="' + id + '-error" style="display:none;"></div>' +
    "</div>"
  );
}

var LIVE_QUERIES = {
  "thbc-tracker:last-update": "Search for the latest news on THBC v. DSHS (Texas hemp litigation, Case No. 15-26-00099-CV, 15th Court of Appeals) and the Texas Senate HHS Committee's interim charge on THC products. Has the 15th Court of Appeals ruled on THBC's motion to reinstate the temporary injunction (filed ~June 22, 2026)? Any new hearings, filings, or committee recommendations since July 22, 2026? Respond in 4-6 terse sentences, dense with dates and case posture, no fluff. If nothing has changed, say so plainly.",
  "hemp-law-tracker:last-update": "Search for the latest news, since July 22, 2026, on four fronts: (1) the federal hemp ban under P.L. 119-37 / H.R. 8646 — any new legislative vehicle for the Barr/Fry/Comer proposals now that House Rules Committee blocked the amendments, and the Nov 12, 2026 deadline; (2) the DEA cannabis rescheduling ALJ hearing in Arlington, VA, especially any DOT/MRO rulemaking under 49 CFR Part 40; (3) SAM Inc. et al. v. DOJ (D.C. Cir., No. 26-1106); (4) the SAFE Banking Act's Senate path. Respond in 6-10 terse, dense sentences grouped by front, with dates. If a front has no change, say so plainly rather than padding.",
};

function checkForUpdates(id) {
  var btn = document.getElementById(id + "-btn");
  var errEl = document.getElementById(id + "-error");
  var resultEl = document.getElementById(id + "-result");
  var subEl = document.getElementById(id + "-sub");
  btn.disabled = true;
  btn.textContent = "CHECKING…";
  errEl.style.display = "none";

  fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 1200,
      messages: [{ role: "user", content: LIVE_QUERIES[id] }],
      tools: [{ type: "web_search_20250305", name: "web_search" }],
    }),
  }).then(function (resp) {
    if (!resp.ok) throw new Error("no-auth");
    return resp.json();
  }).then(function (data) {
    var text = (data.content || []).map(function (b) { return b.type === "text" ? b.text : ""; }).filter(Boolean).join("\n") || "No summary returned.";
    var checkedAt = new Date().toISOString();
    resultEl.className = "live-result";
    resultEl.textContent = text;
    subEl.textContent = "Last checked: " + new Date(checkedAt).toLocaleString();
    try { localStorage.setItem(id, JSON.stringify({ text: text, checkedAt: checkedAt })); } catch (e) {}
  }).catch(function () {
    errEl.style.display = "block";
    errEl.textContent = "Live check unavailable in this environment — this button only works when viewed inside Claude.ai's artifact viewer, which supplies API access. The docket data below is unaffected; ask Claude directly for a fresh check.";
  }).finally(function () {
    btn.disabled = false;
    btn.textContent = "CHECK FOR UPDATES";
  });
}

// ---------------------------------------------------------------------------
// Tab renderers
// ---------------------------------------------------------------------------
var texasFilter = "ALL";
var federalFilter = "ALL";

function renderTexasTab() {
  var statuses = ["ALL", "PENDING", "ACTIVE", "STAYED", "RESOLVED", "FILED"];
  var filtered = byDate(texasFilter === "ALL" ? docketEvents : docketEvents.filter(function (e) { return e.status === texasFilter; }));

  var filterBtns = statuses.map(function (s) {
    return '<button class="filter-btn' + (texasFilter === s ? " active" : "") + '" onclick="setTexasFilter(\'' + s + "')\">" + s + "</button>";
  }).join("");

  var eventsHtml = filtered.map(eventCardHtml).join("");

  var html =
    '<div class="header">' +
      '<div class="eyebrow">TEXAS HEMP LITIGATION — CASE DOCKET</div>' +
      '<div class="h1">THBC v. DSHS</div>' +
      '<div class="subline">No. 15-26-00099-CV · 15th Court of Appeals · from Cause No. D-1-GN-26-002511 (455th District Court, Travis County, Hon. Daniella DeSeta Lyttle)</div>' +
      '<div class="note">⚠ TOCC (Texas Original Compassionate Cultivation) is a state-side AMICUS here — but see TRACK F: it is also a PLAINTIFF in its own suit against hemp companies, seeking to block them from doing business in Texas. Same 200-product testing program in both. Do not describe it only as an intervenor.</div>' +
    "</div>" +
    liveUpdatePanelHtml("thbc-tracker:last-update", "Live docket check") +
    '<div class="filter-row">' + filterBtns + "</div>" +
    '<div class="timeline">' + eventsHtml + "</div>" +
    '<div class="senate-section">' +
      '<div class="eyebrow">RELATED — SENATE HHS INTERIM CHARGE</div>' +
      '<div class="senate-card">' +
        '<div class="event-top">' +
          '<div><div class="event-date">' + fmtDate(senateHearing.date) + '</div>' +
          '<div class="event-title" style="font-size:17px;">' + esc(senateHearing.title) + "</div></div>" +
          stampHtml("RESOLVED") +
        "</div>" +
        '<div class="event-detail"><strong style="color:var(--gold);">Charge:</strong> ' + esc(senateHearing.charge) + "</div>" +
        '<div class="correction-box"><strong style="color:var(--red);">CORRECTION: </strong>' + esc(senateHearing.correction) + "</div>" +
        '<div class="event-detail">' + esc(senateHearing.detail) + "</div>" +
        sourcesHtml(senateHearing.sources) +
      "</div>" +
    "</div>";

  document.getElementById("content").innerHTML = html;
}

function setTexasFilter(s) {
  texasFilter = s;
  renderTexasTab();
}

function renderFederalTab() {
  var trackFilterBtns = '<button class="filter-btn' + (federalFilter === "ALL" ? " active" : "") + '" onclick="setFederalFilter(\'ALL\')">ALL TRACKS</button>' +
    tracks.map(function (t) {
      return '<button class="filter-btn' + (federalFilter === t.id ? " active" : "") + '" onclick="setFederalFilter(\'' + t.id + "')\">" + t.id.toUpperCase().replace("-", " ") + "</button>";
    }).join("");

  var visibleTracks = federalFilter === "ALL" ? tracks : tracks.filter(function (t) { return t.id === federalFilter; });

  var tracksHtml = visibleTracks.map(function (t) {
    var eventsHtml = byDate(t.events).map(eventCardHtml).join("");
    return (
      '<div class="track-section">' +
        '<div class="track-head">' +
          '<div class="track-dot" style="background:var(' + t.colorVar + ');"></div>' +
          '<div class="track-label">' + esc(t.label) + "</div>" +
        "</div>" +
        '<div class="track-deadline">' + esc(t.deadline) + "</div>" +
        '<div class="timeline">' + eventsHtml + "</div>" +
      "</div>"
    );
  }).join("");

  var html =
    '<div class="header">' +
      '<div class="eyebrow">FEDERAL &amp; MULTI-TRACK HEMP LAW DOCKET</div>' +
      '<div class="h1">Hemp Law Tracker</div>' +
      '<div class="subline">Federal ban · DEA rescheduling · SAM v. DOJ · SAFE Banking — four fronts, one board</div>' +
    "</div>" +
    liveUpdatePanelHtml("hemp-law-tracker:last-update", "Live cross-track check") +
    '<div class="filter-row">' + trackFilterBtns + "</div>" +
    tracksHtml;

  document.getElementById("content").innerHTML = html;
}

function setFederalFilter(id) {
  federalFilter = id;
  renderFederalTab();
}

function renderSourceBankTab() {
  var cards = sourceBank.map(function (s) {
    var quoteHtml = s.quote ? '<div class="sb-quote">' + esc(s.quote) + "</div>" : "";
    var linkHtml = s.url ? '<div class="sources"><a class="source-link" href="' + esc(s.url) + '" target="_blank" rel="noreferrer">primary link \u2197</a></div>' : '<div class="sources"><span style="font-family:var(--monoFont);font-size:11px;color:var(--red);">no link on file \u2014 retrieve directly</span></div>';
    return (
      '<div class="sb-card">' +
        '<div class="sb-top">' +
          '<div style="flex:1;min-width:200px;">' +
            '<div class="sb-cat">' + esc(s.cat) + "</div>" +
            '<div class="sb-cite">' + esc(s.cite) + "</div>" +
            (s.via && s.via !== "\u2014" ? '<div class="sb-via">' + esc(s.via) + "</div>" : "") +
          "</div>" +
          '<div class="sb-badge sb-' + s.v + '">' + s.v + "</div>" +
        "</div>" +
        quoteHtml +
        '<div class="sb-note">' + esc(s.note) + "</div>" +
        linkHtml +
      "</div>"
    );
  }).join("");

  document.getElementById("content").innerHTML =
    '<div class="header">' +
      '<div class="eyebrow">VERIFIED CITATION REFERENCE</div>' +
      '<div class="h1">Source Bank</div>' +
      '<div class="subline">Primary statutory, case, and regulatory citations \u00b7 verification status marked on every entry</div>' +
    "</div>" +
    '<div class="sb-intro"><strong style="color:var(--green);">PRIMARY</strong> = actual primary text read. ' +
    '<strong style="color:var(--amber);">SECONDARY</strong> = citation from a reliable secondary source, not independently verified. ' +
    '<strong style="color:var(--red);">UNREAD</strong> = referenced in coverage but the primary document has NOT been read \u2014 do not quote these as if read. ' +
    'The distinction exists because this tracker has already carried three sourcing errors that a primary-text check caught: a wrong bill section number, a wrong court number, and a singular/plural error in quoted statutory text.</div>' +
    cards;
}

function renderExplainersTab() {
  var body = explainers.map(function (x) {
    var secs = x.sections.map(function (s) {
      var flag = "";
      if (s.flag) {
        var cls = s.flag.t === "air" ? "ex-flag-air ex-air" : "ex-flag-warn ex-warn";
        flag = '<div class="ex-flag ' + cls + '"><span class="ex-flag-lbl">' + s.flag.l + "</span>" + s.flag.b + "</div>";
      }
      return '<div class="ex-sec"><div class="ex-h">' + s.h + '</div><div class="ex-b"><p>' + s.b + "</p>" + flag + "</div></div>";
    }).join("");
    return (
      '<div class="header" style="border:none;padding-bottom:8px;margin-bottom:14px;">' +
        '<div class="h1" style="font-size:26px;">' + x.title + "</div>" +
        '<div class="subline" style="font-family:var(--bodyFont);font-size:13px;line-height:1.55;margin-top:8px;">' + x.sub + "</div>" +
      "</div>" +
      '<div class="ex-hero"><div class="ex-hero-line">' + x.hero + "</div></div>" +
      secs
    );
  }).join("");

  document.getElementById("content").innerHTML =
    '<div class="header">' +
      '<div class="eyebrow">STANDING REFERENCE \u2014 CONCEPTUAL, NOT DOCKET</div>' +
      '<div class="h1">Explainers</div>' +
      '<div class="subline">Background pieces that stay true across news cycles \u00b7 written for on-air use</div>' +
    "</div>" + body;
}

function switchTab(tab) {
  document.getElementById("tab-texas").className = "tab-btn" + (tab === "texas" ? " active" : "");
  document.getElementById("tab-federal").className = "tab-btn" + (tab === "federal" ? " active" : "");
  document.getElementById("tab-sources").className = "tab-btn" + (tab === "sources" ? " active" : "");
  document.getElementById("tab-explainers").className = "tab-btn" + (tab === "explainers" ? " active" : "");
  if (tab === "texas") renderTexasTab();
  else if (tab === "federal") renderFederalTab();
  else if (tab === "sources") renderSourceBankTab();
  else renderExplainersTab();
}

// Initial render
renderTexasTab();
</script>
</body>
</html>
