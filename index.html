  {"date": "2026-03-20", "title": "Two practical details operators should know \u2014 and who the commenters were", "detail": "MEASUREMENT OF UNCERTAINTY IS A REAL COMPLIANCE CUSHION, and it is written into \u00a7 300.101(1) and \u00a7 300.101(25) with a worked example: if a sample reports 0.35% total delta-9 with a measurement of uncertainty of plus or minus 0.06%, the range is 0.29% to 0.41%, and because 0.3% falls inside that range THE SAMPLE PASSES. 'Acceptable hemp THC level' is defined as a result that, reported with the lab's measurement of uncertainty, 'produces a distribution or range that includes a result of 0.3% or less.' That is meaningfully more forgiving than a hard 0.3% cap and is under-discussed. SECOND: \u00a7 300.301(a)(3) and (b)(2) require labs to report delta-9 THC, total delta-9 THC, AND total THC \u2014 the rule the Hemp Industry expressly does NOT challenge, confirming the brief's account. WHO COMMENTED: the 1,421 commenters included THBC, HIFA, The Happy Cactus, A to Z Ivestments and Wholesale, Serenity Organics, and the Banks Law Firm \u2014 all of whom are now plaintiffs or plaintiffs' counsel in the litigation. They objected during notice and comment, were told no, and sued. That sequence is useful for rebutting any suggestion the industry sat on its rights.", "status": "FILED", "sources": [{"label": "Texas Register \u2014 Adopted Rules (PRIMARY)", "url": "https://www.sos.state.tx.us/texreg/archive/March202026/Adopted%20Rules/25.HEALTH%20SERVICES.html"}]},
  {"date": "2024-08-09", "title": "\u2705 THE 2024 DOCUMENT \u2014 located and fully cited at last", "detail": "CITATION RESOLVED. In August 2024, HHSC and DSHS conducted a formal FOUR-YEAR REVIEW of Chapter 300 pursuant to TEX. GOV'T CODE \u00a7 2001.039. Commenters urged them to revise the 0.3% delta-9 threshold. DSHS rejected those requests, explaining that '[t]he definition of hemp is in statute\u2026 [and] change to statute requires legislative action and, hence, is outside the scope' of the agency's rulemaking authority. It then readopted Chapter 300 WITHOUT SUBSTANTIVE CHANGE. PUBLISHED IN: Texas Register, AUGUST 9, 2024, in the RULE REVIEW section \u2014 not Adopted Rules or Proposed Rules, which is why earlier searches missed it. Four-year reviews under \u00a7 2001.039 publish separately. WHERE TO GET IT: sos.texas.gov/texreg/archive, August 9 2024 issue, Title 25 / DSHS / Chapter 300. \u26a0 KEEP THIS DISTINCT FROM THE 2026 DEFERRALS. The 2024 statement is an AUTHORITY disclaimer \u2014 we cannot do this, it requires the Legislature. The 2026 adoption document contains a different kind of statement, repeated deferrals of the form 'DSHS will consider the requested change in a future rulemaking,' which is about TIMING, not authority. Both are useful; conflating them will get you caught. I have still not read the 2024 Register page itself \u2014 this is quoted through the THBC petition, which is a primary filing but not the underlying document.", "status": "FILED", "sources": [{"label": "THBC Original Petition \u00b6 70 (PRIMARY, publicly posted)", "url": "https://texashempbusinesscouncil.com/wp-content/uploads/2026/04/2026.04.07-THBC-Original-Petition-and-Application-for-TRO-Injunction-FILED.pdf"}], "isToday": true},
  {"date": "2026-04-07", "title": "\u2b50\u2b50 THE ORIGINAL PETITION IS PUBLIC \u2014 and it is the best single document in this case", "detail": "THBC posted its own 60-page verified petition. This is a PRIMARY filing, freely available, and it supersedes a great deal of secondhand material in this tracker. TEN PLAINTIFFS, not nine: THBC; HIFA; Alchemy TX Consulting; A To Z Ivestments and Wholesale dba BURNERS \u2013 Vape, Smoke and Herbs (Dickinson, with locations in League City and Bacliff); CPRT and Company dba Serenity Organics (Missouri City); Texas Green Craft aka TexaKana Organics (Houston); Elevate One TX dba Elevate Wellness Dispensary (Terrell); Clutch City Gas dba Texas High Council (Santa Fe); Salganik Services dba Treehouse Dispensary (Waco, Temple, Fort Worth); and WYATT PURP LLC (Lewisville) \u2014 the last of which this tracker had omitted entirely. \u26a0 NOTE THE BURNERS CONNECTION: A To Z / Burners has a Bacliff location, and Thomas Monti \u2014 lead plaintiff in the FEDERAL Monti v. Garcia case \u2014 manages Burners in Bacliff. The state and federal cases share a business. ORIGINAL DEFENDANTS WERE DIFFERENT PEOPLE: JENNIFER SHUFORD as DSHS Commissioner and STEPHANIE MUTH as HHSC Executive Commissioner, plus Paxton. Imelda Garcia now appears as INTERIM Commissioner in the later filings, so DSHS leadership changed during the litigation \u2014 worth a line on air and worth confirming when and why. THE PETITION ALSO LISTS 28 EXHIBITS by name, including the SB 3 veto proclamation, both special session proclamations, GA-56, the 2024 rule review, the DSHS-TABC MOU, and Comptroller fee data.", "status": "FILED", "sources": [{"label": "THBC Original Petition (PRIMARY)", "url": "https://texashempbusinesscouncil.com/wp-content/uploads/2026/04/2026.04.07-THBC-Original-Petition-and-Application-for-TRO-Injunction-FILED.pdf"}], "isToday": true},
  {"date": "2026-04-07", "title": "\u2b50 THE FEE ARGUMENT'S KILL SHOT \u2014 $49,999, $1.3 million, and $1.5 million a month", "detail": "THREE FIGURES FROM THE PETITION THAT MAKE THE OCCUPATION-TAX CLAIM CONCRETE, and none of them were in this tracker. (1) THE TABC MOU: in December 2025 DSHS entered a memorandum of understanding with the Texas Alcoholic Beverage Commission to coordinate inspections, investigations, compliance checks and age-verification enforcement for consumable hemp. TABC's total reimbursable costs under that agreement are CAPPED AT $49,999. The State's own interagency agreement prices core enforcement in tens of thousands of dollars. (2) THE APPROPRIATION: in the General Appropriations Act (S.B. 1, 89th Leg.), the Legislature appropriated approximately $1.3 MILLION ANNUALLY from consumable hemp licensing revenue for this program, with authority for only a limited additional amount. That is the Legislature's own judgment about what running the program costs. (3) THE COLLECTIONS: per Texas Comptroller data, the program was already generating over $1.5 MILLION IN FEBRUARY 2026 ALONE under the OLD fee amounts. PUT TOGETHER: the program was already collecting more in a single month than the Legislature appropriated for the year \u2014 before the fee increase. Then DSHS raised manufacturer fees fortyfold and retail fees thirty-three-fold. That is the cleanest possible demonstration that the fees are not calibrated to cost. Also newly precise: DELINQUENCY FEES went from $100 to $1,000 for both manufacturers and retailers \u2014 this tracker previously said only 'increased tenfold.'", "status": "FILED", "sources": [{"label": "THBC Original Petition \u00b6\u00b6 82-83, 143 (PRIMARY)", "url": "https://texashempbusinesscouncil.com/wp-content/uploads/2026/04/2026.04.07-THBC-Original-Petition-and-Application-for-TRO-Injunction-FILED.pdf"}], "isToday": true},
  {"date": "2026-04-07", "title": "The EIGHT challenged rules, by exact citation \u2014 confirming the correction", "detail": "THIS TRACKER SAID 'FOUR RULES' FOR MONTHS, then corrected to eight on Aug 14 based on the appellees' brief. The petition's prayer confirms it and names them: 25 T.A.C. \u00a7\u00a7 300.101(1) (acceptable hemp THC level), 300.101(45) (total delta-9 THC), 300.301-.303 (testing), 300.206(c) and 300.404 (transport into Texas for further processing), 300.202(c) (manufacturer fees), 300.502(g) (retail fees), and 300.601(b) (daily-accrual penalties). THE TRANSPORT PROVISIONS DESERVE MORE ATTENTION THAN THEY HAVE GOTTEN. \u00a7\u00a7 300.206(c) and 300.404 bar bringing hemp material into Texas for further processing if it exceeds the acceptable hemp THC level. Combined with in-process testing under \u00a7\u00a7 300.301-.303, the petition argues manufacturers cannot reliably source plant material even when it passed agricultural-stage testing as the statute requires \u2014 forcing them to cease in-state manufacturing or relocate. That is a distinct injury from the retail ban and it targets a different set of businesses. THE STATUTORY ARGUMENT UNDERNEATH IT is strong: \u00a7 443.152(b) says pre-harvest testing under the Agriculture Code is PROOF of delta-9 compliance for Chapter 443 purposes. The rules negate a compliance pathway the Legislature expressly created.", "status": "FILED", "sources": [{"label": "THBC Original Petition \u00b6\u00b6 108-113, 137 (PRIMARY)", "url": "https://texashempbusinesscouncil.com/wp-content/uploads/2026/04/2026.04.07-THBC-Original-Petition-and-Application-for-TRO-Injunction-FILED.pdf"}]},
  {"date": "2025-06-22", "title": "\u2b50 THE SB 3 RECORD \u2014 Abbott's veto reasoning and the testimony ratios", "detail": "PRIMARY-SOURCED NOW, from the petition's account of the legislative record. ABBOTT'S VETO REASONING, June 22, 2025: he wrote that SB 3's 'implementation would be delayed for years as the case winds through the legal system' and would likely be 'permanently invalidated by the courts.' He vetoed it and called a special session 'to craft a law that does as much as possible to corral the problems while also being structured so that it can go into effect this year.' HIS SPECIAL SESSION CALLS BOTH SAID THE SAME THING: the July 9, 2025 proclamation asked for 'Legislation to comprehensively regulate hemp-derived products \u2026 WITHOUT BANNING a lawful agricultural commodity'; the Aug 15, 2025 second-session call asked for comprehensive regulation 'all WITHOUT BANNING lawful hemp-derived products.' Both sessions produced nothing. THE TESTIMONY NUMBERS, which are striking: in the House, the Committee on State Affairs received well over 1,000 written public comments (a 322-page compilation on Texas Legislature Online), the hearing drew approximately 120 TESTIFYING WITNESSES of whom roughly 90 PERCENT APPEARED IN OPPOSITION \u2014 a nine-to-one ratio \u2014 with more than 500 total participants. In the Senate, more than 100 witnesses and nearly 200 total participants, with approximately 80 PERCENT in opposition. THE FRAMING THE PETITION BUILDS FROM THIS: the Legislature passed a bill, the Governor vetoed it, two special sessions were called, neither produced a statute, and the Governor then issued an order operating strictly within existing law. 'The result of the entire process was unambiguous: no new statute.' Agencies do not sit above that result.", "status": "RESOLVED", "sources": [{"label": "THBC Original Petition \u00b6\u00b6 54-64 (PRIMARY)", "url": "https://texashempbusinesscouncil.com/wp-content/uploads/2026/04/2026.04.07-THBC-Original-Petition-and-Application-for-TRO-Injunction-FILED.pdf"}]},
  {"date": "2026-09-06", "title": "\u2b50\u2b50 SAME TERM, TWO AGENCIES \u2014 TDA's rule says DELTA-9 and disclaims changing the statute", "detail": "THE SINGLE BEST COMPARISON AVAILABLE FOR THE ULTRA VIRES ARGUMENT, and it is primary-sourced from the Texas Administrative Code. 4 TAC \u00a7 24.1(2) \u2014 the TEXAS DEPARTMENT OF AGRICULTURE's hemp program rule \u2014 defines the identical term 'acceptable hemp THC level' as: 'a DELTA-9 tetrahydrocannabinol content concentration level on a dry weight basis, that, when reported with the laboratory's measurement of uncertainty, produces a distribution or range that includes a result of 0.3% or less.' It then gives the SAME worked example DSHS later copied \u2014 0.35% reported with +/- 0.06% uncertainty passes because 0.3% falls in the range. AND THEN IT SAYS THIS: 'This definition of acceptable hemp THC level AFFECTS NEITHER THE STATUTORY DEFINITION OF HEMP, in 7 U.S.C. 1639o(1) and Texas Agriculture Code \u00a7 121[.001].' PUT THE TWO SIDE BY SIDE. TDA: acceptable hemp THC level = DELTA-9, and expressly disclaims affecting the statutory definition. DSHS at 25 TAC \u00a7 300.101(1): acceptable hemp THC level = TOTAL DELTA-9, and uses it as the operative test for what may be manufactured, transported, distributed or sold. DSHS took a sister agency's term, changed the measured analyte, and dropped the disclaimer. One agency says the term does not touch the statute; the other made it the thing the statute means. That is the 'in form versus in operation' argument in a single side-by-side, and both halves are published rules you can pull up on air.", "status": "OPEN", "sources": [{"label": "4 TAC \u00a7 24.1 \u2014 TDA Hemp Program definitions (PRIMARY)", "url": "https://regulations.justia.com/states/texas/title-4/part-1/chapter-24/subchapter-a/section-24-1/"}], "isToday": true},
  {"date": "2026-09-06", "title": "TDA also carries the 87.7% figure \u2014 and calls it a decarboxylation calculation, not a compliance standard", "detail": "4 TAC \u00a7 24.1(16) defines 'Decarboxylated' as 'the completion of the chemical reaction that converts THC-acid into delta-9-THC \u2026 The decarboxylated value is also calculated using a conversion formula that sums delta-9-THC and EIGHTY-SEVEN AND SEVEN TENTHS (87.7) PERCENT of THC-acid.' SO BOTH AGENCIES USE THE SAME CONVERSION FACTOR. The difference is what they do with the number. TDA treats decarboxylation as a TESTING CALCULATION performed pre-harvest under Tex. Agric. Code \u00a7 122.153(a) to classify a crop; its compliance term remains delta-9 and expressly does not touch the statutory definition. DSHS made the converted value the compliance standard for finished products. THAT IS PRECISELY THE DISTINCTION THE APPELLEES' BRIEF DRAWS \u2014 methodology versus rule of decision \u2014 and it can now be demonstrated by comparing two agencies' rules rather than by argument. Also from \u00a7 24.1: 'Handle' includes harvesting or storing hemp plants or plant parts 'prior to the delivery of such plants or plant parts for further processing' \u2014 relevant to the transport provisions at 25 TAC \u00a7\u00a7 300.206(c) and 300.404, which the petition says regulate upstream material beyond Chapter 443's reach.", "status": "OPEN", "sources": [{"label": "4 TAC \u00a7 24.1 (PRIMARY)", "url": "https://regulations.justia.com/states/texas/title-4/part-1/chapter-24/subchapter-a/section-24-1/"}], "isToday": true},
  {"date": "2026-09-06", "title": "\u26a0 TDA 'hemp processor' definition circulating on social \u2014 real question, unverified sourcing", "detail": "AN ADVOCACY GRAPHIC posted by the account craft_strategies reports that the TEXAS DEPARTMENT OF AGRICULTURE LEGAL DEPARTMENT, responding to an inquiry to Commissioner Sid Miller's office, stated that 'Processing means converting an agricultural commodity into a marketable form' and that 'A registered hemp processor can perform any duties associated with or necessary to their processing procedure.' It poses the question: where does TDA processing end and DSHS manufacturing begin? \u26a0 SOURCING CAUTIONS, all of which matter before this goes on air. (1) The quotes are attributed to an AGENCY CORRESPONDENCE RESPONSE, not a published rule or formal opinion \u2014 I could not locate either sentence in 4 TAC Ch. 24 or Tex. Agric. Code Ch. 122. (2) Instagram labels the post as AI CONTENT, which speaks to the graphic rather than the quotes but is worth noting. (3) It is advocacy material from an interested organization. TO USE IT you would want the actual letter or email from TDA Legal, and ideally a PIA request to TDA for the response and any related guidance. THE UNDERLYING QUESTION IS LEGITIMATE AND WELL-TARGETED, though: it is the same jurisdictional line the THBC petition argues at \u00b6\u00b6 88 and 108-113 \u2014 that Chapter 443 governs CONSUMABLE HEMP PRODUCTS, meaning finished goods for human consumption, and does not authorize DSHS to regulate raw or intermediate plant material used as manufacturing inputs. If TDA takes the position that a registered processor may perform any duty necessary to processing, and DSHS simultaneously bars bringing that same material into Texas for processing, the two agencies are asserting overlapping and possibly conflicting authority over the same activity. THAT CONFLICT IS WORTH DOCUMENTING PROPERLY rather than through a screenshot.", "status": "OPEN", "sources": [{"label": "Instagram post, craft_strategies (advocacy, AI-labeled graphic)", "url": ""}, {"label": "THBC Petition \u00b6\u00b6 88, 108-113 \u2014 the same jurisdictional argument", "url": "https://texashempbusinesscouncil.com/wp-content/uploads/2026/04/2026.04.07-THBC-Original-Petition-and-Application-for-TRO-Injunction-FILED.pdf"}], "isToday": true},
  {"date": "2026-09-06", "title": "Related statute worth having: \u00a7 122.301(b) bars authorizing hemp-for-smoking MANUFACTURE", "detail": "SURFACED WHILE CHECKING THE TDA QUESTION and not previously in this tracker. Tex. Agric. Code \u00a7 122.301(b): '[a] state agency may not authorize a person to manufacture a product containing hemp for smoking.' The companion is Tex. Health & Safety Code \u00a7 443.204(4), which requires DSHS rules to reflect that principle. \u26a0 NOTE THE PRECISE VERB \u2014 MANUFACTURE, not sell or possess. This is the provision behind the smokable-hemp litigation line including DSHS v. Crown Distributing, 647 S.W.3d 648 (Tex. 2022), where the Texas Supreme Court addressed a challenge to the smokable-hemp manufacturing and processing ban. RELEVANCE HERE: \u00a7 443.204 is the same section carrying subsection (1), which says rules must reflect that hemp-derived cannabinoids 'are not considered controlled substances or adulterants' \u2014 already flagged in this tracker as the strongest provision for the argument that agencies cannot treat hemp cannabinoids as controlled substances. The Legislature put a specific manufacturing prohibition and a specific not-a-controlled-substance principle in the SAME statutory section. That pairing suggests the Legislature knew how to write a categorical hemp prohibition when it wanted one, and wrote only that one.", "status": "OPEN", "sources": [{"label": "Beeville Bee-Picayune \u2014 overview series", "url": "https://www.southtexasnews.com/beeville_bee_picayune/hemp-thc-and-cannabis-law-in-texas-legal-scientific-and-political-overview-a-multi-part/article_b071e11c-865f-4331-8729-e5477c72c3b2.html"}], "isToday": true},
  {"date": "2026-09-04", "title": "\u274c TRO DENIED in Kingpin Kush \u2014 temporary injunction hearing set for OCTOBER 30", "detail": "CONFIRMED. Judge Maya Guerra Gamble denied the temporary restraining order. The temporary injunction hearing is set for OCTOBER 30, 2026. \u26a0 DATE CONFLICT RESOLVED: Fox 4 reported from the courtroom that the TI hearing would fall on 'either September 17 or October 8' DEPENDING ON HER RULING \u2014 that was a conditional statement made before she ruled. Now that the TRO is denied, the Sept 4 press release and Marijuana Herald both give OCTOBER 30 as the set date. USE OCTOBER 30, and treat the Sept 17 / Oct 8 dates as superseded conditionals rather than a source conflict. Primary-docket confirmation via the Travis County Odyssey Portal or a filed scheduling order is still worth doing before airing the date. SERGI'S RESPONSE: 'While we are disappointed not to have received the temporary restraining order, we look forward to the hearing date for the temporary injunction. In similar cases, even when a TRO has been denied, the temporary and permanent injunction has been granted.' He added: 'This is a unique case that will require a comprehensive hearing.' \u26a0 THAT LAST POINT IS SUBSTANTIVE, NOT SPIN \u2014 a TRO is decided on an emergency standard with minimal record, while a temporary injunction hearing takes evidence and testimony. The THBC case followed exactly that path: TRO first, then a three-day evidentiary hearing that produced a 19-page order with detailed findings. NEW DETAIL ON HER REASONING: one tracker reports Gamble questioned whether granting the TRO 'would amount to judicial rulemaking' \u2014 which fits her comment from the bench about the proposed order being too broad, and suggests the concern was institutional rather than about the merits.", "status": "RESOLVED", "sources": [{"label": "Marijuana Herald", "url": "https://themarijuanaherald.com/2026/09/texas-judge-denies-temporary-restraining-order-in-hemp-industry-lawsuit-injunction-hearing-set-for-october-30/"}, {"label": "Cannabis Law Report \u2014 press release", "url": "https://cannabislaw.report/press-release-update-temporary-injunction-hearing-date-set-after-denial-of-tro-in-texas-hemp-businesses-lawsuit-against-texas-department-of-state-health-services-industry/"}], "isToday": true},
  {"date": "2026-10-30", "title": "\u2b50 NEXT HARD DATE \u2014 temporary injunction hearing, and it lands 13 days before the federal deadline", "detail": "THE MOST CONSEQUENTIAL DATE ON THE TEXAS CALENDAR. October 30, 2026, before Judge Gamble in the 459th. WHY THE TIMING MATTERS: it sits 13 DAYS BEFORE the federal Nov 12 effective date and roughly six weeks before the Dec 11 CR expiry. A ruling either way lands in the middle of the federal endgame. WHAT IS DIFFERENT FROM THE TRO: a temporary injunction takes evidence and testimony and lasts until the court rules on the merits, rather than 14 days. Sergi has said the case 'will require a comprehensive hearing.' The THBC precedent is instructive \u2014 that TI hearing ran three days and produced a 19-page order with eight enumerated findings. WHAT TO WATCH FOR: whether the scope problem Gamble flagged at the TRO stage gets fixed. She said she would not sign an order permitting delta-8 marketed as delta-8 and that the proposed order did not draw that line clearly. If plaintiffs come back with a narrower order confined to the trace-amount definitional question, her stated objection is answered. If they renew the same breadth, expect the same result.", "status": "OPEN", "sources": [{"label": "Marijuana Herald", "url": "https://themarijuanaherald.com/2026/09/texas-judge-denies-temporary-restraining-order-in-hemp-industry-lawsuit-injunction-hearing-set-for-october-30/"}]},
  {"date": "2026-09-07", "title": "\u26a0\u26a0 THE 'FOURTH SUIT' MAY NOT EXIST \u2014 and I can show where the error came from", "detail": "RESOLVING AN OPEN QUESTION IN THIS TRACKER, and correcting a likely error circulating elsewhere. This tracker has carried two possibly-separate August filings: the 'four hemp retailers' monopoly suit reported by KERA around Aug 19, and the Kingpin Kush enforcement suit. THEY APPEAR TO BE THE SAME CASE. Both: four plaintiffs, 459th Judicial District Court of Travis County, filed Aug 19-20, counsel David K. Sergi, defendants DSHS plus Garcia plus Hargett. \u26a0 HERE IS WHERE THE CONFUSION ORIGINATED. The Texas Tribune initially reported the monopoly suit as filed in the U.S. DISTRICT COURT FOR THE WESTERN DISTRICT OF TEXAS, then issued a formal correction on Aug 21 at 2:15 p.m. placing it in the 459th Judicial District Court of Travis County \u2014 a STATE court. Outlets that syndicated the pre-correction version still say Western District. AND AT LEAST ONE PUBLIC LITIGATION TRACKER NOW LISTS THEM AS TWO SEPARATE CASES \u2014 an SS Distro state action in Travis County AND a 'W.D. Texas Federal Challenge' by 'four hemp retailers (names not publicly confirmed)' filed around Aug 20 alleging Farm Bill violations and a Compassionate Use monopoly. That second entry looks like the uncorrected Tribune story hardening into a phantom case. THE MONOPOLY CLAIM IS REAL \u2014 there are only three operational CUP license holders, which is what gives it force \u2014 but it is most likely one count among several in the SS Distro petition rather than a separate federal action. DO NOT REPORT A FOURTH SUIT. Say three: THBC at the 15th COA, Monti in S.D. Tex., and SS Distro/Kingpin Kush in the 459th. Confirm against the SS Distro petition itself before stating the monopoly claim is in it.", "status": "OPEN", "sources": [{"label": "Texas Tribune \u2014 carries the Aug 21 correction", "url": "https://www.texastribune.org/2026/08/03/texas-hemp-thc-lawsuit-ban-felony/"}, {"label": "cannabisregulations.ai \u2014 calls SS Distro the THIRD case", "url": "https://www.cannabisregulations.ai/cannabis-and-hemp-regulations-compliance-ai-blog/texas-dshs-thca-enforcement-lawsuit-august-2026"}], "isToday": true},
  {"date": "2026-09-07", "title": "Kingpin Kush case profile \u2014 consolidated and confirmed", "detail": "FULL PROFILE, now corroborated across the Sept 4 press release, Marijuana Herald, and cannabisregulations.ai. CAUSE NO. D-1-GN-26-007113, 459th Judicial District Court, Travis County. Filed Aug 20, 2026 (cannabisregulations.ai; KERA said Aug 19 \u2014 minor, unresolved). PLAINTIFFS: SS Distro USA LLC (Dallas-based wholesaler, lead plaintiff); Topps Distro LLC d/b/a KingPin Kush (San Antonio, 10 stores, ~40 employees, pulled ~$300,000 in inventory); Jason Moreno d/b/a My City Hemp (Webster); Trevor Kocaoglan (hemp cultivator and consultant, Rio Grande Valley \u2014 brings the grower perspective). DEFENDANTS: DSHS, Interim Commissioner IMELDA GARCIA, and Division Director GLENN HARGETT. Counsel: David K. Sergi of David K. Sergi & Associates. \u26a0 NAME CHECK: it is IMELDA Garcia. A version of this material circulating elsewhere rendered it 'Jennifer Garcia' \u2014 that error is not in this tracker, but watch for it, and note the separate potential for confusion with JENNIFER SHUFORD, who was DSHS Commissioner and a named defendant when THBC filed in April. WHAT MAKES THIS CASE DISTINCT: cannabisregulations.ai frames it as 'the only one aimed squarely at enforcement practice' rather than at the underlying rules \u2014 targeting what plaintiffs call DSHS's 'Post-July Implementation and Enforcement Standard.' It also challenges the $10,000 manufacturer and $5,000 retailer fees and alleges Texas APA violations and separation-of-powers violations. ECONOMIC ANALYSIS SUBMITTED WITH THE FILING puts the Texas consumable hemp industry at approximately $5.1 BILLION in annual business revenue \u2014 note again this is a different measure from the ~$10B in economic activity in the THBC brief.", "status": "FILED", "sources": [{"label": "Cannabis Law Report \u2014 press release", "url": "https://cannabislaw.report/press-release-update-temporary-injunction-hearing-date-set-after-denial-of-tro-in-texas-hemp-businesses-lawsuit-against-texas-department-of-state-health-services-industry/"}, {"label": "Marijuana Herald", "url": "https://themarijuanaherald.com/2026/09/texas-judge-denies-temporary-restraining-order-in-hemp-industry-lawsuit-injunction-hearing-set-for-october-30/"}], "isToday": true},
  {"date": "2026-09-17", "title": "\u2b50\u2b50 STATE'S REPLY BRIEF FILED \u2014 read in full; briefing is COMPLETE", "detail": "PRIMARY SOURCE, read directly. Filed Sept 17, 2026 in No. 15-26-00099-CV. 7,486 words. Counsel: WILLIAM R. PETERSON, Solicitor General, and CORY A. SCANLON, Assistant Solicitor General, for Paxton and Brent Webster. Oral argument requested by BOTH sides. THE ASK: reverse the denial of the plea to the jurisdiction, DISMISS the ultra vires claims, and VACATE the temporary injunction. \u26a0 NOTE WHAT THE STATE IS NOT ASKING FOR, and it says so twice: 'The State conceded in its opening brief that it was not asking the Court to render a judgment dismissing Vendors' APA claims at this time.' So even a total State win leaves the APA and constitutional claims alive for trial. Report it as a challenge to part of the case. CAPTION CONFIRMS: appellants are DSHS, IMELDA GARCIA as Interim DSHS Commissioner, HHSC, STEPHANIE MUTH as HHSC Executive Commissioner, and Warren Kenneth Paxton Jr. as AG \u2014 on appeal from the 455TH Judicial District Court, Travis County. NINE APPELLEES listed, not ten: Wyatt Purp LLC does not appear in the reply caption though it was in the original petition. Worth checking whether it was dropped or is simply omitted from the short-form caption.", "status": "FILED", "sources": [{"label": "State's Reply Brief (PRIMARY, full text)", "url": "https://texashempbusinesscouncil.com/wp-content/uploads/2026/09/2026.09.17-States-Reply-Brief.pdf"}, {"label": "15th COA official docket", "url": "https://search.txcourts.gov/Case.aspx?cn=15-26-00099-CV&coa=coa15"}], "isToday": true},
  {"date": "2026-09-17", "title": "\u2b50\u2b50 FOOTNOTE 1 \u2014 the Texas AG's own reading of CR Sec. 2019, and it backs the Brewers Association", "detail": "THIS MATTERS FOR THE FEDERAL TRACK AND MAY SETTLE AN OPEN QUESTION IN THIS TRACKER. Footnote 1 of the State's reply reads: 'Continuing Appropriations and Extensions Act, 2027, Pub. L. No. 119-103, \u00a7 2019, 140 Stat. 987, 1003 (2026). Under recently enacted stopgap legislation, the law EXTENDS THE EFFECTIVE DATE FOR THE NEW DEFINITION OF HEMP TO DECEMBER 11, 2026, BUT LEAVES THE ORIGINAL NOVEMBER 26 EFFECTIVE DATE IN PLACE AS TO CHPs WITH CANNABINOIDS THAT CANNOT BE NATURALLY PRODUCED BY THE CANNABIS PLANT.' THREE THINGS. (1) THE CR IS NOW LAW \u2014 PUB. L. NO. 119-103, 140 Stat. 987. Signed. This tracker previously had it as passed but awaiting signature. (2) THE SCOPE QUESTION: the Texas Attorney General's office reads Sec. 2019 the way the BREWERS ASSOCIATION does \u2014 the general definition is pushed to Dec 11, but non-naturally-producible cannabinoids are STILL banned on the original date. That cuts against the Cannabis Business Times and ATACH readings that delta-8 and similar stay on shelves until Dec 11. It is an adversary's litigation position rather than a neutral construction, but it is a sworn filing by the state's chief legal officer. (3) \u26a0 DATE ANOMALY: the brief says 'NOVEMBER 26,' not November 12. Every other source in this tracker says Nov 12. Most likely a typo in the brief, but flag it \u2014 if the AG's office believes the date is Nov 26 that is itself newsworthy. Do not repeat Nov 26 without verifying against \u00a7 781 directly.", "status": "OPEN", "sources": [{"label": "State's Reply Brief, n.1 (PRIMARY)", "url": "https://texashempbusinesscouncil.com/wp-content/uploads/2026/09/2026.09.17-States-Reply-Brief.pdf"}], "isToday": true},
  {"date": "2026-09-17", "title": "\u2705 VERIFIED \u2014 the State DOES concede it never framed the scope objection below", "detail": "THBC's public summary says the State's reply 'acknowledges that the State did not use that phrase or specifically frame the issue in the trial court.' THAT CHARACTERIZATION IS ACCURATE. The brief at III.B states verbatim: 'Although the State did not use the phrase universal injunction or frame the issue as the trial court's power to award interim relief to nonparties, whether the district court could award an injunction related to nonparties was fairly included in the argument below.' THE FALLBACK ARGUMENTS ARE THREE. (1) St. John Missionary Baptist Church v. Flakes, 595 S.W.3d 211 (Tex. 2020): a party preserves an issue by arguing its SUBSTANCE even without naming it. (2) The separation-of-powers dispute ran through the whole case, and the State quotes both sides' closings to show it \u2014 including Vendors' own line at 4.RR.67, 'we're asking you to enter an order that will affect millions of Texans.' (3) FUNDAMENTAL ERROR under Mack Trucks v. Tamez, arguing the universal scope adversely affects the public interest, which is an exception to ordinary preservation. WHY THIS IS THE ISSUE TO WATCH AT ARGUMENT: preservation is a clean, threshold question a panel can decide without reaching the merits. If the court finds waiver under Tex. R. App. P. 33.1, the scope challenge dies and the injunction's breadth survives regardless of what happens on ultra vires.", "status": "OPEN", "sources": [{"label": "State's Reply Brief \u00a7 III.B (PRIMARY)", "url": "https://texashempbusinesscouncil.com/wp-content/uploads/2026/09/2026.09.17-States-Reply-Brief.pdf"}], "isToday": true},
  {"date": "2026-09-17", "title": "\u26a0 THE STATE'S BEST WEAPON \u2014 'five out of six hemp retailers are not following the rules'", "detail": "THE MOST DAMAGING RECORD FACT IN THE CASE FOR THE INDUSTRY, and it comes from the industry's own witness. The State uses it TWICE: 'The Vendors' own witness admitted that FIVE OUT OF SIX HEMP RETAILERS ARE NOT FOLLOWING THE RULES RIGHT NOW. 3.RR.33.' It is deployed first to rebut the claim that the State failed to establish danger, and again to argue that enjoining fee collection perpetuates a 'dangerously under-regulated marketplace.' The State's line: 'That is not equity for Vendors, it is carte blanche to legalize marijuana.' TWO MORE RECORD ITEMS IN THE SAME VEIN: the State cites testimony at 2.RR.193-95 that one of Vendors' main representatives acknowledged intoxication 'is part of the appeal and the reason they make money,' and quotes an exhibit advertisement at 4.RR.32-33 promising 'one puff and you'll see why it's a staff and customer favorite for total body relaxation and a clear, happy headspace.' AND A POINTED OBSERVATION worth knowing before anyone makes the medical argument on air: 'in five years of litigating this issue between Sky Marketing and this case, hemp vendors have yet to offer the testimony of A SINGLE MEDICAL PROFESSIONAL regarding the purported health benefits of hemp.' The appellees did put on an expert in veterans' affairs, but that is not a physician \u2014 the State's point stands as stated.", "status": "OPEN", "sources": [{"label": "State's Reply Brief (PRIMARY)", "url": "https://texashempbusinesscouncil.com/wp-content/uploads/2026/09/2026.09.17-States-Reply-Brief.pdf"}], "isToday": true},
  {"date": "2026-09-17", "title": "\u26a0 TWO FACTUAL DISPUTES where the State contradicts the appellees' brief on the record", "detail": "BOTH SIDES CANNOT BE RIGHT, AND EACH CITES THE RECORD. (1) WHO IS DR. STEVENSON. The appellees' brief describes the State's case as 'testimony from a single LAY WITNESS, Dr. Timothy Stevenson' and says the State 'offered no testimony from any DSHS official.' The State's reply identifies him as 'DSHS's DEPUTY COMMISSIONER FOR CONSUMER PROTECTION' and says his testimony established the need to fix an inadequate six-year inspection cycle and account for going from zero licensees in 2020 to over 14,000 in 2025, and that DSHS would need to expand from SEVEN TO TWENTY-THREE INSPECTORS. If he is the Deputy Commissioner for Consumer Protection, calling him a lay witness who is not a DSHS official is hard to sustain. Verify before repeating the appellees' framing. (2) WAS THE CHARNEY DECLARATION MENTIONED. The appellees say it 'was never mentioned during the hearing.' The State replies: 'Jim Charney's declaration was filed in briefing and was before the trial court \u2014 the State called attention to it during its opening. 2.RR.64. If Vendors took issue with that evidence, they should have objected to it but did not.' A specific record cite against a categorical denial. THIS TRACKER PREVIOUSLY REPEATED THE APPELLEES' VERSION OF BOTH POINTS. Treat both as contested until the reporter's record is checked.", "status": "OPEN", "sources": [{"label": "State's Reply Brief (PRIMARY)", "url": "https://texashempbusinesscouncil.com/wp-content/uploads/2026/09/2026.09.17-States-Reply-Brief.pdf"}, {"label": "Appellees' Brief (user-supplied)", "url": ""}], "isToday": true},
  {"date": "2026-09-17", "title": "The State's strongest authorities \u2014 including this court's own precedent", "detail": "WHAT THE PANEL WILL BE LOOKING AT. ASPIRE POWER VENTURES, LP v. PUC, 733 S.W.3d 122 (Tex. App.\u201415th Dist. 2026, pet. filed) \u2014 THE FIFTEENTH COURT'S OWN DECISION, rejecting ultra vires claims against PUC commissioners for adopting rules requiring backup power during a weather emergency BECAUSE THE RULES WERE REQUIRED BY STATUTE. That is the State's single best case: same court, same year, same structure of argument. SKY MARKETING, READ BROADLY: the State argues it 'was not limited to delta-8 products \u2014 it validated a controlled-substance determination regarding ALL FORMS OF DETECTABLE THC present in hemp.' If the panel accepts that reading it reaches THCA, which is directly relevant to the open THCA question in this tracker. BARLOW v. STATE, sharpened: the State says the Dallas court held 'the total delta-9 THC is the relevant concentration' for a criminal conviction, and adds the rhetorical close \u2014 'If the total delta-9 standard is good enough to criminally convict a defendant for possession, it ought to be good enough for regulating stores.' FEDERAL CIRCUIT SUPPORT: Green Room LLC v. Wyoming, 157 F.4th 1196 (10th Cir. 2025) and BIO GEN LLC v. SANDERS, 142 F.4th 591 (8th Cir. 2025), both for the proposition that states may regulate hemp more strictly than federal law. \u26a0 NOTE: Bio Gen is the SAME case Judge Brown relied on to deny the TRO in Monti. The same precedent is now doing work against the industry in both the state and federal tracks.", "status": "OPEN", "sources": [{"label": "State's Reply Brief (PRIMARY)", "url": "https://texashempbusinesscouncil.com/wp-content/uploads/2026/09/2026.09.17-States-Reply-Brief.pdf"}], "isToday": true},
  {"date": "2026-09-17", "title": "The CUP fee comparison \u2014 $488,520, and where the number came from", "detail": "THE STATE'S ANSWER TO THE OCCUPATION-TAX CLAIM, and it is rhetorically effective. Citing amicus TEXAS ORIGINAL COMPASSIONATE CULTIVATION's brief at 9 and 37 Tex. Admin. Code \u00a7 12.14(a): a Compassionate Use Program licensee pays $7,356 JUST TO APPLY and $488,520 FOR A TWO-YEAR LICENSE. Against that, the State calls the hemp fees of $10,000 and $5,000 'PALTRY by comparison,' and dismisses the appellees' TABC/Anheuser-Busch comparison as irrelevant. \u26a0 NOTE WHO SUPPLIED THE NUMBER. TOCC is a medical cannabis licensee and a State-side amicus \u2014 and the Kingpin Kush plaintiffs are separately alleging that the hemp ban created a MONOPOLY for the Compassionate Use Program. So the State is using a CUP licensee's own fee schedule to defend hemp fees, while a different lawsuit argues that same program is the beneficiary of the crackdown. That juxtaposition is worth airing. ALSO: the appellees' answer is already on record \u2014 a comparison to a different regulatory program does not establish that the hemp fees comply with the cost-recovery limit the Legislature placed on DSHS in \u00a7 12.0111(b). Both framings are fair; the panel will pick one.", "status": "OPEN", "sources": [{"label": "State's Reply Brief (PRIMARY)", "url": "https://texashempbusinesscouncil.com/wp-content/uploads/2026/09/2026.09.17-States-Reply-Brief.pdf"}], "isToday": true},
  {"date": "2026-09-17", "title": "\u2b50 SB 14 CUTS BOTH WAYS \u2014 the State's 'voidable' argument", "detail": "THE CLEVEREST MOVE IN THE BRIEF, and this tracker has been reporting only one half of it. The appellees invoke SB 14, Abbott's 2025 deregulatory statute, for STRONGER APA requirements \u2014 it repealed the safe harbor in former \u00a7 2001.022(c) and made rules voidable for noncompliance. THE STATE TURNS THE SAME BILL AROUND on the REMEDY: SB 14's change 'only means that a violation of that statute is included in section 2001.035's list of provisions, the violation of which merely renders the rule VOIDABLE.' Then: 'Voidable means valid until annulled,' citing Black's Law Dictionary. Therefore, the State argues, 'the Rules were required to remain in effect unless declared void' \u2014 and since the trial court never declared them void, it had no power to enjoin them under the APA's waiver of immunity. It leans on In re Stetson Renewables, 658 S.W.3d 292 (Tex. 2022), for the proposition that when the Legislature specifies a consequence for noncompliance, THAT consequence controls and courts may not invent another. The State also expressly disclaims any deference argument: 'the State has never asserted that it is owed deference as to any legal determination' \u2014 which neutralizes the Loper Bright framing the appellees built around \u00a7\u00a7 2001.042 and 2001.1721. IF YOU HAVE BEEN USING THE SB 14 IRONY ON AIR, this is the rebuttal you will get.", "status": "OPEN", "sources": [{"label": "State's Reply Brief \u00a7 II.A (PRIMARY)", "url": "https://texashempbusinesscouncil.com/wp-content/uploads/2026/09/2026.09.17-States-Reply-Brief.pdf"}], "isToday": true},
  {"date": "2026-09-18", "title": "NEXT STEP \u2014 submission notice; no date, and the court has given no signal", "detail": "BRIEFING IS COMPLETE. The next formal step is a SUBMISSION NOTICE from the Fifteenth Court of Appeals telling the parties whether it will decide on the briefs or set oral argument. BOTH SIDES REQUESTED ARGUMENT. No submission date or argument date has been announced. \u26a0 THE TIMING IS GENUINELY OPEN, and THBC says so plainly: the court's schedule could place the next step before or after the November election and before or after the federal hemp changes expected in December, and 'the court has given no indication whether those outside dates will affect its schedule.' WHAT HAS NOT CHANGED: the challenged DSHS rules remain enforceable, the challenge remains active, and no merits decision has issued. \u26a0 REMINDER ON THE REINSTATEMENT MOTION: THBC's June 22 motion to reinstate the injunction has now been pending 88 days, and its prayer in the appellees' brief renews that request. A panel that sets argument is unlikely to rule on reinstatement first.", "status": "PENDING", "sources": [{"label": "THBC update", "url": "https://texashempbusinesscouncil.com/thbc-v-dshs-update-state-files-reply-brief/"}, {"label": "15th COA docket", "url": "https://search.txcourts.gov/Case.aspx?cn=15-26-00099-CV&coa=coa15"}], "isToday": true},
  {"date": "2026-12-08", "title": "\u2b50\u2b50 ORAL ARGUMENT SET \u2014 December 8, 2026 at the Fifteenth Court of Appeals", "detail": "THE DATE THIS TRACKER HAS BEEN WAITING ON SINCE BRIEFING CLOSED. Per THBC, announced around Oct 7: THBC's challenge to the DSHS hemp rules is SCHEDULED FOR ORAL ARGUMENT BEFORE THE FIFTEENTH COURT OF APPEALS ON DECEMBER 8, 2026. Both sides had requested argument; the court granted it. \u2b50 AN AMICUS BRIEF SUPPORTING THE INDUSTRY'S CHALLENGE has also been filed \u2014 almost certainly the one Jerad Najvar signaled in September, when he said he would address the \u00a7 443.051 'consistent with federal law' argument head-on and that 'the amicus will come first because the game is at the 15th regardless.' CONFIRM THE AUTHOR before attributing it. \u26a0 THE TIMING IS EXTRAORDINARY AND WORTH SAYING OUT LOUD: argument is DEC 8, and the full federal Section 781 regime takes effect DEC 11 \u2014 THREE DAYS LATER. The panel will hear argument about whether Texas may impose a total-THC standard in the same week the federal government imposes one nationally. Najvar's warning that THBC answered the federal-harmonization point in a footnote saying it is 'not law yet' lands directly here: by Dec 8 it is enacted law days from taking effect. Expect the State to press that, and expect the panel to ask about it.", "status": "OPEN", "sources": [{"label": "THBC \u2014 Dec 8 argument set, amicus filed", "url": "https://texashempbusinesscouncil.com/"}, {"label": "Next Level Leaf \u2014 confirms Dec 8", "url": "https://www.nextlevelleaf.com/state-resources/texas/"}], "isToday": true},
  {"date": "2026-11-02", "title": "\u26a0 CORRECTION \u2014 the SS Distro injunction hearing MOVED from Oct 30 to Nov 2", "detail": "THIS TRACKER CARRIED OCT 30 AS THE TEMPORARY INJUNCTION HEARING DATE. IT MOVED. A press release dated Oct 30, 2026 announced that the temporary injunction hearing in SS Distro USA, et al. v. Texas Dept. of State Health Services, et al., Cause No. D-1-GN-26-007113, would be held at 9:00 A.M. ON NOVEMBER 2, 2026 in Travis County District Court. NO RULING HAS BEEN REPORTED as of this check on Nov 10 \u2014 eight days later. \u26a0 ALSO: THE PLAINTIFF LIST HAS DOUBLED. Originally four. Now EIGHT: SS Distro USA LLC; Topps Distro LLC d/b/a KingPin Kush; Jason Moreno d/b/a My City Hemp; Trevor Kocaoglan; plus IHC INVESTMENTS INC.; BLUESTAR OPERATIONS LLC; ZAHQ LLC d/b/a ZOUR STASH; and N&A VENTURES d/b/a BOTANIC BLISS. Four new plaintiffs joined between filing and hearing. \u26a0 COURT NUMBER CONFLICT, AGAIN: d8austin lists the hearing in the 53RD District Court; earlier reporting and the Kingpin Kush materials put the case in the 459TH before Judge Gamble. Travis County's central docket makes both possible \u2014 case assigned to one court, heard in another. Do not state a court number without checking the docket. Sergi's framing remains: DSHS 'engaged in executive overreach by administrative rulemaking, bypassing the Legislature's statutory definition of hemp enacted under House Bill 1325 in 2019.'", "status": "PENDING", "sources": [{"label": "Cannabis Business Times \u2014 Nov 2 hearing notice", "url": "https://www.cannabisbusinesstimes.com/us-states/texas/news/16125212/court-hearing-set-for-nov-2-on-texas-hemp-businesses-lawsuit-against-department-of-state-health-services"}, {"label": "d8austin \u2014 lists 53rd District Court", "url": "https://www.d8austin.com/post/texas-thc-ban-update"}], "isToday": true},
  {"date": "2026-11-10", "title": "Status Tue Nov 10 \u2014 three cases pending, no ruling in any of them", "detail": "WHERE EVERYTHING ACTUALLY STANDS, 2 DAYS BEFORE THE FIRST FEDERAL DEADLINE. \u2022 THBC v. DSHS \u2014 briefing complete, ORAL ARGUMENT DEC 8. The June 22 motion to reinstate the injunction has now been pending 141 DAYS; the appellees' prayer renews it. The DSHS rules remain enforceable. \u2022 SS DISTRO / KINGPIN KUSH \u2014 TRO denied Sept 4; temporary injunction heard NOV 2; NO RULING in 8 days. \u2022 MONTI v. GARCIA \u2014 TRO denied Aug 9; First Amended Complaint and MOTION FOR SUMMARY JUDGMENT filed SEPT 30 (the Oct 1 date in earlier entries was the counsel update, not the filing); defendants' responses were due Oct 9 and Oct 20; first case-management conference was set for NOV 4. No ruling reported. \u2022 TOCC v. HEMP COMPANIES \u2014 Rule 91a motion argued Sept 22; no ruling reported in 7 weeks. \u2022 GREEN NATION \u2014 dormant by design; Najvar's amicus at the 15th appears to have been filed. \u26a0 NOTHING HAS CHANGED ON THE GROUND. Both Texas restrictions remain in force: the March total-THC rules and the July 31 Schedule I reinstatement. Hemp-derived delta-9 at or below 0.3% was never part of either fight and remains legal.", "status": "PENDING", "sources": [{"label": "THBC resources \u2014 filing dates", "url": "https://texashempbusinesscouncil.com/resources/"}], "isToday": true}
