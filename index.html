  {
    id: "pia-records", label: "Public Records \u2014 PIA Requests on Cannabinoid Evidentiary Standards", deadline: "\u26a0 Status reconstructed from prior sessions \u2014 CONFIRM before relying on it", colorVar: "--gold",
    events: [
      { date: "2026-08-14", title: "\u26a0 READ FIRST \u2014 this track is reconstructed from memory, not from documents in hand", detail: "Everything in this track comes from notes carried across earlier sessions rather than from filings or agency responses reviewed in this one. Dates, current status, and whether deadlines have run are all UNVERIFIED as of Aug 14. Confirm each item against the actual portal records and correspondence before treating any of it as current, and correct anything stale. THE ONE THING RESOLVED THIS SESSION: prior notes flagged uncertainty over whether the surname \u2018Tovar\u2019 appearing on PIA correspondence was a filing persona or the requester\u2019s own name. The Netlify account visible in this session reads Nicholas Tovar / tovar365@gmail.com, so it is the real name. That question is closed.", status: "OPEN", sources: [], isToday: true },
      { date: "2026-08-14", title: "WHY THIS MATTERS \u2014 the PIA requests target exactly what Monti v. Garcia litigates", detail: "This is not a side project; it runs straight into the live federal case. The requests seek EVIDENTIARY STANDARDS FOR DISTINGUISHING SCHEDULE I CANNABINOIDS FROM COMPLIANT HEMP \u2014 which is the precise question underlying the void-for-vagueness claim in Monti: that no objective test separates naturally occurring from converted THCs. Andrea Steel, counsel in Monti, has publicly warned that officers cannot determine cannabinoid composition from packaging. Agency responses would show whether departments actually HAVE a workable standard or are operating without one. A response saying no such standard exists is affirmative evidence for the vagueness claim. A detailed protocol would cut the other way. Either outcome is newsworthy, and both are primary-source material of a kind almost nobody else in this coverage area is generating. Note also the Austin Chronicle reporting already in this tracker \u2014 secondhand, from a member group chat \u2014 that DSHS inspectors were not confiscating THCA. PIA responses could confirm or kill that anecdote with documents.", status: "OPEN", sources: [], isToday: true },
      { date: "2026-08-14", title: "SAPD \u2014 submitted and acknowledged; the furthest along", detail: "Request routed to SAPD Open Records, attention Linda Flores, via the City of San Antonio GovQA portal. Acknowledged by PIO Emily Garvin, badge #1821. STATUTORY CLOCK: Tex. Gov\u2019t Code \u00a7 552.221 requires a governmental body to promptly produce public information, generally understood as within 10 BUSINESS DAYS, or else request an Attorney General ruling within that window if it intends to withhold. \u26a0 UNVERIFIED: the submission date is not in these notes, so whether the 10-day clock has run cannot be calculated here. If the deadline has passed with no production and no AG referral, that itself is reportable. If SAPD sought an AG ruling, the AG opinion request becomes a separate public document worth tracking, and Paxton\u2019s office issuing rulings on cannabinoid enforcement records while he is simultaneously a named defendant in Monti v. Garcia is a genuinely notable angle.", status: "PENDING", sources: [], isToday: true },
      { date: "2026-08-14", title: "DSHS, DPS, Bexar County DA \u2014 drafted or undrafted as of last notes", detail: "DSHS: request DRAFTED but NOT SUBMITTED as of the last session covered by these notes. DPS and Bexar County District Attorney: UNDRAFTED. \u26a0 All three statuses may be stale. PRIORITY ARGUMENT FOR DSHS: it is the agency that wrote both the March 2026 total-THC rules and the July 10 Schedule I notice, and it is the lead defendant in THBC v. DSHS with its commissioner named in Monti. Its internal guidance on distinguishing lawful trace isomers from converted product is the single most probative record of the four. DSHS also stated publicly it plans further APA rulemaking to fold the 2021 THC definition into the consumable hemp rules \u2014 records touching that process are timely right now. BEXAR COUNTY DA is worth prioritizing over DPS for a different reason: charging decisions are where the vagueness problem becomes concrete, and a DA\u2019s office either has written screening criteria for these cases or it does not.", status: "PENDING", sources: [], isToday: true },
      { date: "2026-08-14", title: "Practical notes on the PIA mechanics", detail: "Texas PIA basics relevant here: \u00a7 552.221 governs the production duty; a governmental body that wants to withhold must seek an Attorney General decision, generally within 10 business days of receipt. Requests should be specific enough to be answerable but broad enough to capture training materials, field guidance, lab protocols, and internal memoranda rather than only formal policy. For agencies using GovQA (San Antonio), the portal timestamps everything, which is useful evidence if a deadline is missed. WORTH CONSIDERING: a narrow follow-up request for records of COMMUNICATIONS BETWEEN DSHS AND LOCAL AGENCIES about July 31 enforcement would test the Austin Chronicle claim about inspectors deprioritizing THCA, and would be harder to withhold than internal deliberative material.", status: "OPEN", sources: [], isToday: true },
    ],
  },
  {"id": "tocc-v-hemp", "label": "Track F \u2014 TOCC v. Hemp Companies (private enforcement suit)", "deadline": "Rule 91a motion argued Sept 22, 2026 \u2014 ruling pending; removed to Texas Business Court", "colorVar": "--blue", "events": [{"date": "2026-09-23", "title": "\u2b50\u2b50 NEW TRACK \u2014 TOCC is a PLAINTIFF, not just an amicus. This inverts its role.", "detail": "THIS TRACKER HAS DESCRIBED TEXAS ORIGINAL COMPASSIONATE CULTIVATION ONLY AS A STATE-SIDE AMICUS IN THBC v. DSHS. THAT WAS INCOMPLETE. TOCC is separately SUING MULTIPLE HEMP COMPANIES in its own affirmative action, seeking to BLOCK THEM FROM DOING BUSINESS IN TEXAS and to recover damages for lost revenue. Named defendants identified in coverage include MOOD and BIG DAN'S HOLDINGS LLC d/b/a BIG DAN'S HEMPORIUM. TOCC's theory: it holds one of the rare Compassionate Use Program licenses, and the value of that license has been degraded by what it calls 'wildcat' operators selling products above the legal THC limit while marketing them as hemp \u2014 so customers who should have bought through CUP bought from the defendants instead. THE CASE WAS REMOVED TO TEXAS BUSINESS COURT by one of the defendants around early June 2026. \u26a0 WHY THIS MATTERS BEYOND ITS OWN MERITS: the Kingpin Kush plaintiffs allege DSHS enforcement created a MONOPOLY for the Compassionate Use Program. Here is a CUP licensee affirmatively litigating to remove hemp competitors from the market, using testing it also submitted to the court in THBC. The monopoly allegation stops being abstract.", "status": "FILED", "sources": [{"label": "Austin American-Statesman via Yahoo Finance", "url": "https://finance.yahoo.com/sectors/healthcare/articles/austin-medical-marijuana-company-sues-183904409.html"}], "isToday": true}, {"date": "2026-07-06", "title": "Defendants file Rule 91a motion challenging four causes of action", "detail": "From the defendants' hearing slides, 'Where Things Stand.' July 6, 2026: defendants file a TEX. R. CIV. P. 91a motion challenging four causes of action. \u26a0 WHAT RULE 91a IS, and why it matters here: it allows dismissal of a cause of action that has NO BASIS IN LAW OR FACT, decided ON THE PLEADINGS ALONE. The court may not consider evidence. That is the entire strategic point of the defense \u2014 TOCC's 200-plus chemical analyses are irrelevant at this stage no matter what they show, because the motion attacks whether TOCC has the legal right to bring these claims at all, not whether violations occurred. THE FOUR CHALLENGED COUNTS: existing-contract interference, prospective-contract interference, money had and received / unjust enrichment, and declaratory judgment.", "status": "FILED", "sources": [{"label": "Defendants' hearing slides (user-supplied photos)", "url": ""},
      {"date": "2026-10-01", "title": "\u2b50\u2b50 MSJ FILED \u2014 plaintiffs ask the federal court to decide without trial; Commerce Clause claim DROPPED", "detail": "MAJOR PROCEDURAL SHIFT. Plaintiffs filed a FIRST AMENDED COMPLAINT and a MOTION FOR SUMMARY JUDGMENT, asking Judge Brown to decide the case on the papers. Counsel: Andrea Steel and Imani Hutty (The Banks Law Firm), Jim Thorburn (Thorburn Law Group), Susan Burns (S. Burns Legal PLLC). \u2b50 THE STRATEGIC READ OF THE AUG 9 TRO DENIAL IS SHARP AND WORTH UNDERSTANDING. Counsel's own account: the judge was not convinced on vagueness or interstate burden, but on PREEMPTION he said only that the emergency showing was insufficient BY ITSELF and LEFT THE CORE LEGAL QUESTION OPEN. They read that as a signal and restructured around it \u2014 DROPPING THE DORMANT COMMERCE CLAUSE CLAIM ENTIRELY and rebuilding on the two strongest remaining theories. That is the correct lesson from a loss: the court told them which argument still had room, and they cut the ones it had already rejected. NOTE WHAT THIS MEANS FOR READING THE EARLIER DENIAL \u2014 this tracker recorded that Judge Brown denied on three independent grounds including likelihood-of-success findings against vagueness and Commerce Clause. Plaintiffs are conceding the Commerce Clause point by abandoning it, and recasting rather than repeating the vagueness theory.", "status": "FILED", "sources": [{"label": "Plaintiffs' counsel update to THBC, Oct 1 2026 (user-supplied)", "url": ""}], "isToday": true},
      {"date": "2026-10-01", "title": "\u2b50 PARTY CHANGES \u2014 Botany Scientifics (San Antonio) in; Lifted Liquids OUT", "detail": "BOTANY SCIENTIFICS, a nationwide hemp product distributor BASED IN SAN ANTONIO, has joined Monti and The Happy Cactus Apothecary as a plaintiff. LIFTED LIQUIDS IS NO LONGER A PARTY. \u2b50 THESE TWO MOVES GO TOGETHER AND THEY CONFIRM THE STRATEGY. Lifted Liquids was the Wisconsin manufacturer with roughly $6.7M in Texas-bound inventory and about 140 Texas wholesale accounts \u2014 the plaintiff whose facts existed to support the INTERSTATE COMMERCE claim. Drop the claim, drop the plaintiff tied to it. That is disciplined pleading, not attrition. Recall also that Judge Brown's third ground for denying the TRO was that plaintiffs had not alleged a need to ship product THROUGH Texas, only loss of the Texas market \u2014 so the interstate theory was the one he found least developed, and it is now gone rather than repaired. A San Antonio-based distributor instead anchors the case in in-state operations, which fits a preemption-and-vagueness posture rather than a dormant Commerce Clause one.", "status": "FILED", "sources": [{"label": "Plaintiffs' counsel update (user-supplied)", "url": ""}], "isToday": true},
      {"date": "2026-10-01", "title": "\u2b50\u2b50 THE TWO REMAINING COUNTS \u2014 and Count I is a kill shot if it lands", "detail": "COUNT I \u2014 PREEMPTION. Congress specifically removed hemp and its derivatives from the federal Controlled Substances Act and from federal Schedule I. Texas used its own Controlled Substances Act to place that same category into Texas Schedule I. Where a state's controlled-substance classification conflicts with the federal classification, federal law controls. Counsel's own framing: 'IF COUNT I PREVAILS, THERE IS NOTHING FURTHER TO DECIDE.' COUNT II \u2014 VAGUENESS, pleaded in the alternative. If the court holds the provisions can operate together, plaintiffs argue Texas law is unconstitutionally vague because it POINTS IN FOUR DIFFERENT DIRECTIONS about the same products: describing hemp-derived THC products as 'foods, not controlled substances,' expressly excluding them from the definition of 'controlled substance,' AND listing them as Schedule I \u2014 with nothing telling a retailer, a consumer, or a police officer which controls. RELIEF SOUGHT: a declaration that the rule is invalid and an order stopping enforcement. \u2b50 NOTE THE SCOPE \u2014 the declaration request is FACIAL, not as-applied: counsel say they are 'asking the court to rule on the regulation itself, not only as it applies to our clients.' No money damages. A facial declaration would reach every operator in Texas, which makes this the broadest relief currently sought in any of the hemp cases.", "status": "PENDING", "sources": [{"label": "Plaintiffs' counsel update (user-supplied)", "url": ""}], "isToday": true},
      {"date": "2026-10-03", "title": "\u2b50\u2b50\u2b50 THE THCA QUESTION IS ANSWERED \u2014 and my explainer was WRONG", "detail": "CORRECTING THIS TRACKER'S OWN ANALYSIS. Explainer #2 states that the July 31 Schedule I reinstatement reaches ISOMERS and does NOT reach THCA, because THCA is an acid rather than an isomer, and calls conflating them the most common reporting error. THE ACTUAL TEXT, reproduced in plaintiffs' Figure 1, shows that was wrong. NEW TEXAS SCHEDULE I, ITEM *(31): 'Tetrahydrocannabinols, meaning tetrahydrocannabinols NATURALLY CONTAINED in a plant of the genus Cannabis (cannabis plant), EXCEPT FOR UP TO 0.3% DELTA-9-tetrahydrocannabinols in hemp (as defined under Texas Agriculture Code 121).' READ THE STRUCTURE. It captures tetrahydrocannabinols naturally contained in the plant. The ONLY carve-out is for up to 0.3% DELTA-9. THCA is a tetrahydrocannabinol, it is naturally contained in the plant, and it is not delta-9 \u2014 SO IT IS NOT EXCEPTED. The Texas Tribune's reporting that the ban reaches THCA flower was right; my acid-versus-isomer distinction does not appear in the operative text. \u26a0 AND NOTE THE STRANGER IMPLICATION, which is the heart of the vagueness claim: item *(31) reaches THCs 'NATURALLY CONTAINED' in the plant. CONVERTED OR SYNTHESIZED cannabinoids are, by definition, not naturally contained \u2014 so on the face of this item they may fall OUTSIDE it. That is the exact inverse of DSHS's public enforcement position that trace naturally-occurring cannabinoids are lawful while converted ones are banned. The text and the enforcement statement point opposite directions.", "status": "OPEN", "sources": [{"label": "Plaintiffs' Figure 1, text comparison (user-supplied)", "url": ""}, {"label": "KERA \u2014 Tribune reporting that THCA flower is covered", "url": "https://www.keranews.org/texas-news/2026-08-21/texas-hemp-thc-lawsuit-ban-felony"}], "isToday": true},
      {"date": "2026-10-03", "title": "\u2b50\u2b50 THE FOUR DIRECTIONS, with citations \u2014 the best vagueness exhibit in any of these cases", "detail": "PLAINTIFFS' FIGURE 1 LAYS THE CONTRADICTION OUT IN STATUTORY TEXT. Keep these four together; they are the vagueness claim. (1) TEX. H&S CODE \u00a7 481.002(5): \u2018Controlled substance\u2019 \u2026 'The term DOES NOT INCLUDE hemp, as defined by Section 121.001, Agriculture Code, OR THE TETRAHYDROCANNABINOLS IN HEMP.' (2) TEX. H&S CODE \u00a7 443.204(1), already in this tracker: rules must reflect that hemp-derived cannabinoids 'are NOT CONSIDERED CONTROLLED SUBSTANCES or adulterants,' and that products containing them intended for ingestion are 'considered FOODS, not controlled substances.' (3) TEX. H&S CODE \u00a7 481.103(a)(1): 'Penalty Group 2 consists of: (1) any quantity of the following hallucinogenic substances \u2026: TETRAHYDROCANNABINOLS, OTHER THAN MARIHUANA.' (4) NEW SCHEDULE I ITEM *(31): naturally contained tetrahydrocannabinols are Schedule I except up to 0.3% delta-9. \u2b50 THE FEDERAL COMPARISON MAKES IT WORSE FOR TEXAS, not better. 21 U.S.C. \u00a7 812(c), Sch. I(c)(17) reads 'Tetrahydrocannabinols, EXCEPT FOR TETRAHYDROCANNABINOLS IN HEMP (as defined under section 1639o of title 7)' \u2014 and 21 C.F.R. \u00a7 1308.11(d)(31) says tetrahydrocannabinols 'DOES NOT INCLUDE any material, compound, mixture, or preparation that falls within the definition of hemp.' So the federal schedule and \u00a7 481.002(5) use NEARLY IDENTICAL exclusionary language, while the new Texas schedule item reverses it. That parallel is what makes Count I a conflict-preemption argument rather than a mere policy disagreement.", "status": "OPEN", "sources": [{"label": "Plaintiffs' Figure 1 (user-supplied)", "url": ""}], "isToday": true},
      {"date": "2026-11-04", "title": "\u26a0 HARD FEDERAL DEADLINES \u2014 Oct 9, Oct 20, and a Nov 4 case-management conference", "detail": "THE FEDERAL CASE NOW HAS A CALENDAR, which it did not a month ago. OCT 9: defendants must respond to the first amended complaint. OCT 20: defendants must respond to the summary judgment motion. NOV 4: FIRST CASE-MANAGEMENT CONFERENCE, with the parties submitting a proposed case schedule beforehand. All subject to extension, and defendants have already sought extensions once in this case. \u2b50 NOTE HOW THE DATES STACK AGAINST EVERYTHING ELSE. Oct 20 response, then OCT 30 is the Kingpin Kush temporary injunction hearing in Travis County, then NOV 4 federal case management, then NOV 12 is the federal effective date for the narrow category, then DEC 11 is the full Section 781 regime and the CR funding expiry. Five consequential dates in seven weeks across three forums. \u26a0 WHAT HAS NOT CHANGED, and counsel say so plainly: until the judge rules, Texas's rule treating hemp-derived THCs as Schedule I other than up to 0.3% delta-9 REMAINS IN EFFECT AND ENFORCEABLE. A summary judgment motion is not relief.", "status": "OPEN", "sources": [{"label": "Plaintiffs' counsel update (user-supplied)", "url": ""}], "isToday": true}]}, {"date": "2026-08-10", "title": "TOCC files a 438-PAGE amended petition and abandons one claim", "detail": "Aug 10, 2026: TOCC files its FIRST AMENDED PETITION at 438 PAGES, and ABANDONS the existing-contract interference claim \u2014 it is 'no longer asserted.' Aug 13: defendants file a reply and NEITHER WITHDRAW NOR AMEND their motion, so three challenged causes of action went to the hearing. THE DEFENSE FRAMING, from their slide titled '438 Pages of New Material. The Challenged Causes of Action Did Not Change': 'Plaintiff answered the motion with VOLUME, NOT WITH THE MISSING ELEMENTS,' and 'Plaintiff added facts but did not cure the legal defects identified in the Motion.' Their table shows all three surviving counts with 'Allegations unchanged' in the TOCC's-response column. \u26a0 ABANDONING THE EXISTING-CONTRACT CLAIM IS ITSELF NOTEWORTHY \u2014 that is the count requiring an actual contract TOCC lost. Dropping it while keeping PROSPECTIVE interference suggests TOCC could not identify specific contracts, only hypothetical customers.", "status": "FILED", "sources": [{"label": "Defendants' hearing slides (user-supplied photos)", "url": ""}]}, {"date": "2026-09-22", "title": "\u2b50 HEARING HELD \u2014 Courtroom 8D, 1700 Guadalupe, 2:30 PM, two hours", "detail": "Hearing on the Rule 91a motion, in person, Travis County Civil and Family Courts Facility, 1700 Guadalupe Street, Courtroom 8D, eighth floor, set for two hours beginning 2:30 PM. \u26a0 NO PRESS COVERAGE LOCATED as of Sep 23, and no ruling reported. THE DEFENSE ARGUED THREE INDEPENDENT FAILURES, one per surviving count. (1) PROSPECTIVE CONTRACT INTERFERENCE \u2014 lacks RELATIONSHIP: 'No reasonably probable prospective relationship pleaded.' (2) MONEY HAD AND RECEIVED / UNJUST ENRICHMENT \u2014 lacks ENTITLEMENT: 'No proceeds pleaded that in equity and good conscience belong to TOCC.' (3) DECLARATORY JUDGMENT \u2014 lacks AUTHORITY: 'No substantive private right supporting the requested statutory declarations.' NOTE THE STRUCTURE: each attacks an ELEMENT of the claim, not the underlying factual allegations. A court could accept every word of TOCC's testing and still dismiss.", "status": "PENDING", "sources": [{"label": "Defendants' hearing slides (user-supplied photos)", "url": ""}, {"label": "Hearing notice (user-supplied)", "url": ""}], "isToday": true}, {"date": "2026-09-22", "title": "\u2b50\u2b50 THE ARGUMENT THAT MATTERS \u2014 'more facts about a violation do not create a private right to enforce it'", "detail": "THE SHARPEST SLIDE, AND THE ONE WITH IMPLICATIONS BEYOND THIS CASE. Titled 'More Facts About an Alleged Violation Do Not Create a Private Right to Enforce It,' it splits into two columns. WHAT PLAINTIFF ADDED in the 438 pages: testing results, certificates of analysis, advertising allegations, contamination allegations, THC concentration allegations. WHAT IS STILL MISSING: a private enforcement right; a right running between TOCC and these defendants; a legal instrument or legal relationship requiring construction. THE CLOSING LINE: 'Amendment goes to VIOLATION, while the Rule 91a defect goes to AUTHORITY.' THAT IS THE WHOLE CASE IN ONE SENTENCE. Texas generally does not allow private parties to enforce regulatory statutes absent express legislative authorization \u2014 enforcement of the hemp rules belongs to DSHS, which has said its own tools are 'administrative or civil rather than criminal.' If TOCC could sue competitors for regulatory violations, any licensee could privately enforce any regulation against any rival. \u26a0 IF THE MOTION IS GRANTED, the private-enforcement theory dies and TOCC is left as an amicus and a witness rather than a plaintiff. IF DENIED, expect a wave of competitor-versus-competitor suits across the Texas market.", "status": "PENDING", "sources": [{"label": "Defendants' hearing slides (user-supplied photos)", "url": ""}], "isToday": true}, {"date": "2026-08-12", "title": "\u26a0 SAME COUNSEL is running a personal-injury case alongside the competitor suit", "detail": "REPORTED BY THE AUSTIN AMERICAN-STATESMAN and worth knowing before this comes up on air. The attorney representing TOCC in the competitor suit ALSO represents an Austin woman suing over a hemp gummy. Her allegations: a Half Bak'd Primo Twist THCP gummy incapacitated her for days; her behavior deteriorated to the point a therapist recommended inpatient admission; before she could get there she suffered what the suit describes as a psychotic episode in which she believed she was receiving communications from the license plates of passing cars, was subdued by police, taken to an emergency room, and then spent EIGHT DAYS in a psychiatric facility. \u26a0 HANDLE WITH CARE. These are allegations in a pleading, not findings. But the pairing is strategically significant: a sympathetic individual-harm case and a competitor economic case, same lawyer, same defendant class, mutually reinforcing narratives. The individual case supplies the public-safety story that makes the economic case land. That is a deliberate litigation posture and it is fair to describe it as one.", "status": "OPEN", "sources": [{"label": "Austin American-Statesman", "url": "https://www.statesman.com/business/article/austin-thc-gummy-psychosis-lawsuit-hemp-rules-22383212.php"}]}, {"date": "2026-09-23", "title": "The testing claim \u2014 same evidence, two cases, and now discoverable", "detail": "TOCC'S CORE EVIDENTIARY CLAIM, quoted from its own petition: 'Over 200 independent chemical analyses proved that the vast majority of Defendants' so-called hemp products are not hemp at all.' A specific example cited in coverage: Big Dan's 'Marshmallow Dream' cereal bar containing 116 MILLIGRAMS of delta-9 THC, roughly ten times the Texas legal limit. \u26a0 THIS IS THE SAME TESTING TOCC SUBMITTED IN ITS THBC AMICUS FILING, where it argued hemp businesses are using THCA products to compete with the more tightly regulated medical system. SO THE SAME 200-PRODUCT TESTING PROGRAM IS DOING WORK IN TWO PLACES: supporting the State against the hemp industry in THBC, and supporting TOCC's damages claim here. WHAT NOBODY HAS SEEN IS THE METHODOLOGY \u2014 which labs, what methods, chain of custody, whether products were tested as sold or after decarboxylation, and whether 'not hemp at all' means exceeding 0.3% delta-9 as sold or only after conversion. AS A PLAINTIFF RATHER THAN AN AMICUS, TOCC'S TESTING BECOMES DISCOVERABLE. That is arguably the most consequential thing about this case for the broader fight, and it is a reason hemp operators would want to watch it closely.", "status": "OPEN", "sources": [{"label": "Austin American-Statesman via Yahoo Finance", "url": "https://finance.yahoo.com/sectors/healthcare/articles/austin-medical-marijuana-company-sues-183904409.html"}, {"label": "KUT \u2014 the same testing in the THBC amicus", "url": "https://www.kut.org/business/2026-04-29/austin-tx-texas-hemp-industry-lawsuit-cannabis"}], "isToday": true}, {"date": "2026-09-23", "title": "\u2b50\u2b50 COUNSEL \u2014 Heidi Coughlin, and the same firm appears on the State's side in THBC", "detail": "TOCC'S ATTORNEY IS HEIDI COUGHLIN, quoted in the Austin American-Statesman on the competitor suit: 'Our position is succinct, it's based in law, and we are confident it will succeed in court.' \u2b50 THE CONNECTION WORTH KNOWING: she is already in this tracker, in a place nobody would look for her. The e-service list on the THBC APPELLEES' BRIEF includes hcoughlin@w-g.com, alongside BRANTLEY ROSS PRINGLE JR. and LAUREN ROSS at the same domain \u2014 WRIGHT & GREENHILL, appearing as outside counsel on the STATE's side of THBC v. DSHS. So the same firm is doing both jobs: supporting DSHS against the hemp industry in the appellate case, and representing TOCC suing hemp companies directly. \u26a0 TWO CAVEATS BEFORE AIRING. (1) I am matching an EMAIL DOMAIN to a firm \u2014 confirm Coughlin is at Wright & Greenhill and that Pringle and Ross are on the same matters rather than merely the same service list. (2) The Statesman does not name her in the Jane Doe psychosis case specifically; it says 'the attorney who represents her is also representing' TOCC, and Coughlin is the named TOCC attorney. Strong inference, not a stated fact. Verify against the Doe petition before saying she filed it.", "status": "OPEN", "sources": [{"label": "Austin American-Statesman via Yahoo \u2014 Coughlin quote", "url": "https://finance.yahoo.com/sectors/healthcare/articles/austin-medical-marijuana-company-sues-183904409.html"}, {"label": "THBC Appellees' Brief e-service list (user-supplied)", "url": ""}], "isToday": true}, {"date": "2026-09-23", "title": "TEN DEFENDANTS \u2014 the full list, and who moved the case", "detail": "MORE COMPANIES THAN EARLIER COVERAGE INDICATED. Named defendants: BIG DAN'S HEMPORIUM; CLOUD PONICS; GREENBELT BOTANICALS / GREENBELT CBD; JTE ENTERPRISES d/b/a Green Cross ATX, Green Cross CBD and Greenbox; RESTART CBD; CBD AMERICAN SHAMAN LLC; SOUTHEAST FARMING PARTNERS d/b/a Haygood Farms; COOKIES CREATIVE CONSULTING & PROMOTIONS; VIIA HEMP / VIIA; and MOOD / HELLOMOOD. \u2b50 RESTART CBD REMOVED THE CASE TO TEXAS BUSINESS COURT. Note the range \u2014 this is not a suit against fly-by-night operators. CBD American Shaman is a national franchise, Cookies is a major national brand, Mood/Hellomood is a large online retailer. Naming established companies alongside smaller Austin shops suggests TOCC is trying to establish the principle broadly rather than pick off weak defendants.", "status": "FILED", "sources": [{"label": "Austin American-Statesman via Yahoo", "url": "https://finance.yahoo.com/sectors/healthcare/articles/austin-medical-marijuana-company-sues-183904409.html"}], "isToday": true}, {"date": "2026-09-23", "title": "TOCC's compliance-cost framing \u2014 the monopoly claim, inverted", "detail": "TOCC'S OWN ARGUMENT, and it is sympathetic on its face. The company says it has SPENT MILLIONS complying with Compassionate Use Program regulations \u2014 security, inspections, testing, background checks \u2014 while hemp businesses face far fewer restrictions and potentially expose consumers to unregulated products that may contain synthetic drugs and other harmful substances. It calls them 'WILDCAT' operators and says the largely unregulated market now competes with the highly regulated TCUP market to the detriment of its licensees. \u2b50 THIS IS THE KINGPIN KUSH MONOPOLY ALLEGATION STATED FROM THE OTHER DIRECTION. Same underlying facts \u2014 a few heavily regulated CUP licensees, many lightly regulated hemp businesses, enforcement now falling on the latter. The hemp plaintiffs call it a state-protected monopoly; TOCC calls it unfair competition against a company that played by the rules. Both descriptions fit. WHICH ONE A COURT ADOPTS depends less on the economics than on whether TOCC has a PRIVATE RIGHT to enforce the hemp rules at all \u2014 exactly what the Rule 91a motion argued Sept 22.", "status": "OPEN", "sources": [{"label": "Austin American-Statesman via Yahoo", "url": "https://finance.yahoo.com/sectors/healthcare/articles/austin-medical-marijuana-company-sues-183904409.html"}], "isToday": true}]},
  {"id": "green-nation", "label": "Track G \u2014 Green Nation / TX Hemp Constitutional Alliance v. DSHS (Najvar)", "deadline": "FIRST-FILED case (Mar 31, 2026) \u00b7 held dormant by design \u00b7 amicus at the 15th COA now coming", "colorVar": "--green", "events": [{"date": "2026-03-31", "title": "\u2b50\u2b50 THE FIRST SHOT \u2014 filed a week BEFORE THBC, then deliberately held back", "detail": "THIS TRACKER HAS HAD 'GREEN NATION' ONLY AS A NAME IN A STATESMAN LIST OF OTHER TRAVIS COUNTY SUITS. It is considerably more than that. Filed MARCH 31, 2026 \u2014 the same day the DSHS rules took effect and A FULL WEEK BEFORE the THBC petition of April 7. This was the FIRST case filed against the rules. PLAINTIFFS: GREEN NATION, a registered hemp retailer with three locations in the Tyler/Lindale area of East Texas, and the TEXAS HEMP CONSTITUTIONAL ALLIANCE, a nonprofit. DEFENDANT: DSHS. COUNSEL: JERAD NAJVAR of Houston. THEORY: identical separation-of-powers and ultra vires grounds \u2014 DSHS adopted by rulemaking what the Legislature considered and declined to enact, without statutory authority, on an expedited timeline with minimal notice. \u2b50 WHY IT WENT QUIET: per Jay Maguire's reporting, the case 'remained largely dormant BY DESIGN.' Rather than create competing litigation over substantially identical issues, Najvar DEFERRED to the THBC challenge once THBC obtained injunctive relief \u2014 there was little strategic value in asking a second district judge to decide the same questions while another judge's injunction stood. That is disciplined coordination, not weakness, and it matters now because the injunction is gone.", "status": "FILED", "sources": [{"label": "Green Nation press kit", "url": "https://gnhemptx.com/press-kit/"}, {"label": "Jay Maguire \u2014 'The First Shot Fired'", "url": "https://jaymaguireatx.substack.com/p/the-first-shot-fired-inside-the-green"}], "isToday": true}, {"date": "2026-09-25", "title": "\u2b50 WHO NAJVAR IS \u2014 and why the State should take this seriously", "detail": "NOT A CANNABIS LAWYER. Jerad Najvar is a constitutional trial and appellate litigator at Chalmers, Adams, Backer & Wallen LLC in Houston, previously founder of Najvar Law Firm PLLC. His practice is government overreach and structural constitutional guarantees including SEPARATION OF POWERS \u2014 which is precisely the theory in all of these cases. TRACK RECORD: part of the legal team behind McCutcheon v. FEC and co-counsel to the plaintiff through the U.S. Supreme Court, where a federal contribution limit was struck down for the first time. Judgments against the FDA, the FEC, and the Texas Ethics Commission. \u2b50 MOST RELEVANT HERE: he has PREVAILED AGAINST THE FDA IN THE FIFTH AND ELEVENTH CIRCUITS IN ADMINISTRATIVE PROCEDURE ACT CHALLENGES. That is the same species of claim as the APA counts in THBC. Oral argument in four federal circuits, including eight in the Fifth Circuit, plus the Texas Supreme Court and two Texas courts of appeals. WHAT THAT MEANS PRACTICALLY: the industry side now has an appellate specialist with an APA win record writing an amicus for the Fifteenth Court, separate from trial counsel. That is a meaningful addition regardless of what his own case does.", "status": "OPEN", "sources": [{"label": "Chalmers Adams firm bio", "url": "https://chalmersadams.com/jerad-w-najvar/"}], "isToday": true}, {"date": "2026-09-25", "title": "\u2b50\u2b50 NAJVAR'S READ \u2014 the State's best argument is \u00a7 443.051 'consistent with,' and THBC left it in a footnote", "detail": "FROM A MESSAGE FORWARDED INTO AN INDUSTRY GROUP, dated Sept 25. Najvar, having read the State's reply brief, assesses that ITS BEST ARGUMENT is the agency's authority to adopt rules 'CONSISTENT WITH' FEDERAL HEMP LAW \u2014 Tex. Health & Safety Code \u00a7 443.051 \u2014 coupled with reference to the federal omnibus amendment taking effect in December. \u26a0 HIS CRITICISM OF THE INDUSTRY'S OWN BRIEFING IS THE PART TO SIT WITH: 'THBC didn't really address that other than to say it's not law yet. See THBC brief at 59 n. 7.' A FOOTNOTE. On what he identifies as the State's strongest point. HIS COUNTER, stated crisply: 'The general directive to regulate consistent with fed law cannot authorize an agency to contradict express statutes.' That is the right frame \u2014 a consistency mandate constrains the exercise of delegated authority; it is not an independent grant of authority to rewrite \u00a7\u00a7 443.151-.152. HE PLANS TO ADDRESS IT in an amicus brief and in his own district court filings, and says 'the amicus will come first BECAUSE THE GAME IS AT THE 15TH REGARDLESS.' \u26a0 SOURCING: this is a forwarded private message, attributed to Najvar, shared into a group chat. Treat the analysis as credible and the attribution as unverified \u2014 do not quote him by name on air without confirming he said it.", "status": "OPEN", "sources": [{"label": "Forwarded message attributed to Najvar (user-supplied screenshot)", "url": ""}], "isToday": true}, {"date": "2026-09-25", "title": "\u26a0\u26a0 THE TIMING TRAP \u2014 'it's not law yet' was true in August and is FALSE NOW", "detail": "THIS IS THE MOST ACTIONABLE THING IN NAJVAR'S MESSAGE AND IT COMPOUNDS. THBC's brief, filed Aug 14, answered the federal-harmonization argument in a footnote saying the December federal standard IS NOT LAW YET. THAT WAS ACCURATE ON AUG 14. IT IS NOT ACCURATE NOW. The continuing resolution was signed Sept 2 as PUB. L. NO. 119-103, 140 Stat. 987 \u2014 the State's own reply brief cites it at footnote 1. Section 781 is ENACTED LAW; it is merely not yet EFFECTIVE, with the general definition operative Dec 11 and the narrower category possibly Nov 12. SO THE FOOTNOTE IS NOW STALE, AND IT GETS STALER. If the Fifteenth Court rules after Nov 12 or Dec 11, the federal total-THC standard will be in force, and the State's 'we are harmonizing with federal law' argument gets materially stronger while the industry's answer sits in a footnote written when the premise was different. THBC has itself noted the court's schedule could place its decision before or after the federal changes. \u2b50 THIS IS A CONCRETE REASON THE INDUSTRY WANTS A RULING SOONER and the State may be content to wait. Watch the submission notice with that in mind.", "status": "OPEN", "sources": [{"label": "State's Reply Brief n.1 (PRIMARY)", "url": "https://texashempbusinesscouncil.com/wp-content/uploads/2026/09/2026.09.17-States-Reply-Brief.pdf"}, {"label": "Forwarded Najvar message (user-supplied)", "url": ""}], "isToday": true}, {"date": "2026-09-25", "title": "\u2b50 'THEY ARE VERY DIFFERENT' \u2014 and here is why he is right, with the numbers", "detail": "NAJVAR SAYS THE STATE IS 'VERY IMPRECISE IN SUGGESTING THE NEW RULES HARMONIZE THE STATE REGS WITH SOON TO BE EFFECTIVE FED LAW; THEY ARE VERY DIFFERENT.' HE IS CORRECT, AND THE DIFFERENCE IS EASY TO SHOW. THE TEXAS RULE, 25 TAC \u00a7 300.101(1) and (45): compliance turns on TOTAL DELTA-9 THC as a CONCENTRATION by dry weight, calculated as delta-9 plus 0.877 times THCA, against a 0.3% ceiling. THE FEDERAL STANDARD under \u00a7 781: a 0.3% TOTAL THC dry-weight definition PLUS a separate cap of 0.4 MILLIGRAMS TOTAL THC PER CONTAINER on finished products. THREE STRUCTURAL DIFFERENCES. (1) TOTAL THC versus TOTAL DELTA-9 THC \u2014 the federal metric sweeps in all tetrahydrocannabinols; the Texas metric counts delta-9 plus converted THCA. Not the same set of molecules. (2) CONCENTRATION versus ABSOLUTE MASS \u2014 a percentage by dry weight and a milligram cap per container are different kinds of limit, and a product can pass one while failing the other. (3) The federal per-container cap has NO TEXAS ANALOGUE AT ALL, and DSHS expressly DECLINED to adopt it \u2014 in the March adoption document it said it would 'consider the requested revision in a future rulemaking when the federal amendments take effect.' \u2b50 THAT LAST POINT IS THE KILL SHOT AND IT IS PRIMARY-SOURCED: DSHS cannot claim its rules harmonize with a federal standard it specifically refused to adopt.", "status": "OPEN", "sources": [{"label": "Texas Register \u2014 Adopted Rules, DSHS declining the 0.4mg standard (PRIMARY)", "url": "https://www.sos.state.tx.us/texreg/archive/March202026/Adopted%20Rules/25.HEALTH%20SERVICES.html"}], "isToday": true}]},
  {"id": "election-2027", "label": "Track H \u2014 The 2026 Election & the 90th Legislature (2027)", "deadline": "Prefiling opened Nov 9, 2026 \u00b7 session convenes Jan 12, 2027 \u00b7 filing deadline Mar 12 \u00b7 sine die May 31", "colorVar": "--gold", "events": [{"date": "2026-11-03", "title": "\u2b50\u2b50\u2b50 TEXAS FLIPPED \u2014 every statewide executive office went Democratic", "detail": "THE SINGLE LARGEST STRUCTURAL CHANGE SINCE THIS TRACKER BEGAN. Results of the Nov 3, 2026 midterm: GOVERNOR \u2014 GINA HINOJOSA (D) defeated Greg Abbott by roughly 7 points. First Democratic governor since Ann Richards left office in 1995; first Latina governor. LT. GOVERNOR \u2014 VIKKI GOODWIN (D) defeated Dan Patrick by about 6 points, 52-46. First woman elected to the office; first Democrat since 1994. Patrick conceded by phone after midnight. ATTORNEY GENERAL \u2014 NATHAN JOHNSON (D) defeated Mayes Middleton by about 6 points for an open seat; first Democratic AG since 1994. U.S. SENATE \u2014 JAMES TALARICO (D) defeated KEN PAXTON. Also flipped: Comptroller (Sarah Eckhardt, D) and Land Commissioner (Benjamin Flores, D). Per MultiState, 26 legislative seats flipped and 19 incumbents lost. \u26a0 CHAMBER CONTROL \u2014 SOURCES CONFLICT, GET THIS RIGHT: MultiState and the Audacy/KRLD report both say DEMOCRATS TOOK THE HOUSE while REPUBLICANS KEPT THE SENATE 19-12, with a Democratic lieutenant governor presiding over a Republican chamber. NBC DFW wrote that Democrats 'won control of both the House and the Senate' \u2014 that appears to be loose wording. Use House D / Senate R until confirmed. NOTE ALSO: the Senate Republican majority is reported to be considering NEW CHAMBER RULES TO LIMIT GOODWIN'S POWERS, since the lieutenant governor appoints committee chairs, refers bills, and sets priorities. That rules fight on Jan 12 may matter more to hemp than any single bill.", "status": "RESOLVED", "sources": [{"label": "MultiState \u2014 full results", "url": "https://www.multistate.us/elections/results/texas-2026"}, {"label": "CBS Texas live results", "url": "https://www.cbsnews.com/texas/live-updates/texas-midterm-elections-2026/"}, {"label": "KERA", "url": "https://www.kera.org/2026/11/03/texas-lieutenant-governor-election-results-2026-dan-patrick-vikki-goodwin/"}], "isToday": true}, {"date": "2026-11-03", "title": "\u2b50\u2b50 THE INCOMING GOVERNOR IS ALREADY ON RECORD AGAINST THE HEMP CRACKDOWN", "detail": "THIS TRACKER FACT-CHECKED HER IN AUGUST WITHOUT KNOWING SHE WOULD WIN. Gov.-elect GINA HINOJOSA posted publicly in August: 'Greg Abbott single-handedly made THC products that were legal last month a felony to possess today. Abbott's actions are an attack on our freedoms.' This tracker assessed that claim as directionally right on structure \u2014 none of it came from the Legislature \u2014 and wrong on the specific mechanism, since the felony exposure traces to the Sky Marketing revival rather than GA-56. THE ASSESSMENT STANDS; WHAT CHANGED IS THAT SHE IS NOW THE GOVERNOR. GOODWIN IS EVEN MORE EXPLICIT. She says she WANTS TO REDO THE THC REGULATIONS and, in a separate interview, that she is 'NOT IN FAVOR OF A THC BAN.' She has also claimed PATRICK PUSHED THE HEMP BAN TO BENEFIT ALCOHOL COMPANIES, which she notes are among his substantial campaign contributors. \u26a0 TREAT THAT LAST ONE AS AN ALLEGATION BY A POLITICAL OPPONENT, not an established fact \u2014 but note it rhymes with something already in this tracker: the Wine & Spirits Wholesalers of America and a retail alcohol coalition were both active on the federal hemp provision in August.", "status": "OPEN", "sources": [{"label": "Marijuana Moment \u2014 Goodwin on THC", "url": "https://www.marijuanamoment.net/marijuana-would-be-legalized-statewide-in-texas-under-new-bills-filed-for-2027-session"}, {"label": "Fox 7 Austin \u2014 what Goodwin means for hemp", "url": "https://www.fox7austin.com/news/texas-hemp-what-will-vikki-goodwin-lt-governor-do"}], "isToday": true}, {"date": "2026-11-03", "title": "\u2b50\u2b50 PAXTON IS LEAVING \u2014 and he is a named defendant in two of the tracked cases", "detail": "UNDER-APPRECIATED CONSEQUENCE. KEN PAXTON did not seek re-election as Attorney General; he ran for U.S. Senate and LOST to James Talarico. NATHAN JOHNSON (D) takes the office. PAXTON IS A NAMED DEFENDANT, IN HIS OFFICIAL CAPACITY, IN BOTH THBC v. DSHS and MONTI v. GARCIA. In an official-capacity suit the successor is automatically substituted, so Johnson inherits both. \u26a0 WHY THIS COULD MATTER MORE THAN ANY RULING: the OAG controls the State's litigation posture. A new AG can decline to press an appeal, narrow arguments, settle, or confess error. The State's reply brief in THBC was filed Sept 17 under Solicitor General William R. Peterson; whether that office and that posture survive a change of administration is an open question. SAME FOR DSHS: Interim Commissioner Imelda Garcia serves in an agency under the Governor's appointees, and Hinojosa could replace agency leadership. THE RULES THEMSELVES COULD BE REPEALED ADMINISTRATIVELY \u2014 by the same rulemaking power that created them, without any legislation at all. \u26a0 DO NOT OVERSTATE THIS ON AIR. Transitions take time, the inauguration is in January, agency rulemaking takes months, and a new AG may well defend the State's rules on institutional grounds regardless of party. But the people who built this enforcement posture are leaving office.", "status": "OPEN", "sources": [{"label": "Wikipedia \u2014 2026 TX AG election", "url": "https://en.wikipedia.org/wiki/2026_Texas_Attorney_General_election"}], "isToday": true}, {"date": "2026-11-09", "title": "\u2b50\u2b50 PREFILING OPENED \u2014 six known cannabis/hemp bills on day one", "detail": "BILL FILING FOR THE 90TH LEGISLATURE OPENED MONDAY, NOV 9, 2026. Session convenes JAN 12, 2027; most-bills filing deadline MAR 12, 2027; sine die MAY 31, 2027. For scale, the 2025 session saw more than 8,700 bills filed. \u2b50 FULL BILL-BY-BILL DETAIL NOW LIVES IN TRACK I \u2014 BILL TRACKER, with captions, authors, mechanics and gaps. Summary here. DAY-ONE CANNABIS AND HEMP FILINGS: \u2022 HB 362 \u2014 Rep. JOHN BUCY III (D-Austin), the TEXAS REGULATION OF CANNABIS ACT: full adult-use legalization covering cultivation, manufacture, processing, distribution, sale, testing, transportation, delivery, transfer, possession, use and taxation, plus local regulation of cannabis establishments, occupational licensing, a criminal offense provision and a tax. \u2022 HB 369 \u2014 Rep. JOE MOODY (D-El Paso), near-identical companion, same title. \u2022 HB 507 \u2014 Bucy: bars state agencies and political subdivisions from drug testing most employees and independent contractors for cannabinoids, or penalizing them for lawful use of low-THC medical cannabis or consumable hemp. \u2b50 THAT ONE IS DIRECTLY RELEVANT TO THE EMPLOYMENT TRACK IN THIS TRACKER and would be the first Texas statutory employment protection for hemp users. \u2022 HB 330 \u2014 Rep. MIHAELA PLESA (D): expands medical low-THC eligibility to patients whose condition causes menstrual cramps. \u2022 HB 667 \u2014 Moody: statewide decriminalization, concentrates. \u2022 SB 237 \u2014 SEN. CAROL ALVARADO (D-Houston), Senate legalization companion (added Nov 10 \u2014 omitted from this entry's first version). \u26a0 NOTE WHAT IS NOT YET FILED: no bill has appeared repealing or rewriting the DSHS consumable hemp rules or the Schedule I reinstatement, which is the thing that would actually resolve the litigation. Watch for it.", "status": "FILED", "sources": [{"label": "Texas Cannabis Policy \u2014 bill tracker", "url": "https://texascannabispolicy.org/texas-cannabis-bills/"}, {"label": "Marijuana Moment", "url": "https://www.marijuanamoment.net/marijuana-would-be-legalized-statewide-in-texas-under-new-bills-filed-for-2027-session"}, {"label": "Houston Public Media", "url": "https://www.houstonpublicmedia.org/articles/news/politics/2026/11/09/566649/texas-democrats-set-sights-on-2027-legislative-session-as-bill-filing-begins/"}], "isToday": true}, {"date": "2026-11-10", "title": "\u26a0 THE BAN SIDE IS NOT GONE \u2014 Perry has already said he will file again", "detail": "DO NOT READ THE ELECTION AS THE END OF THE FIGHT. SEN. CHARLES PERRY (R-Lubbock), the author of the 2025 ban bill, CONFIRMED BEFORE THE ELECTION that he will again file a bill to ban consumable hemp products in the next session. Republicans retain the Senate majority, and committee composition in that chamber is where ban bills have historically advanced. WHAT ACTUALLY CHANGED, stated precisely: (1) the Lieutenant Governor who drove the ban no longer controls bill referral or committee appointments; (2) the House, which repeatedly moderated SB 3 into a regulatory bill rather than a ban, is now under Democratic control; (3) the Governor who vetoed the ban and then ordered the rules is replaced by one who called the crackdown an attack on freedoms. A BAN BILL CAN STILL PASS THE SENATE. It now has to survive a Democratic House and a Governor on record against it \u2014 which is close to the inverse of 2025, when the ban passed both chambers and died by veto. \u26a0 AND THE SENATE RULES FIGHT ON JAN 12 IS THE THING TO WATCH FIRST: if Republicans strip powers from the Lieutenant Governor by rule, the practical effect on bill flow could be substantial.", "status": "OPEN", "sources": [{"label": "KERA \u2014 Perry will file again", "url": "https://www.keranews.org/news/2026-08-11/texas-hemp-thc-ban-federal-court-emergency"}, {"label": "MultiState \u2014 Senate rules consideration", "url": "https://www.multistate.us/elections/results/texas-2026"}], "isToday": true}, {"date": "2026-11-10", "title": "\u26a0 CORRECTION \u2014 I missed SB 237; and this bill list is still NOT complete", "detail": "THE PRIOR ENTRY LISTED FIVE DAY-ONE CANNABIS BILLS. THERE ARE AT LEAST SIX. MISSING: SB 237 \u2014 SEN. CAROL ALVARADO (D-Houston), the SENATE companion on legalization: 'regulating the cultivation, manufacture, processing, distribution, sale, testing, transportation, delivery, transfer, possession, and use of cannabis and cannabis products; authorizing the imposition of fees; requiring occupational licenses; creating a criminal offense.' Filed 11/9/2026. \u2b50 THAT ONE MATTERS DISPROPORTIONATELY because Republicans hold the Senate. A Senate-side legalization vehicle with a Democratic author gives the bill a referral path in the chamber where it is hardest, and Alvarado is a senior member. MECHANICS COMMON TO THE LEGALIZATION BILLS, newly reported: the TEXAS DEPARTMENT OF LICENSING AND REGULATION would handle licensing for growers, retail cannabis establishments, secure transporters and testing labs; a 20 PERCENT TAX on retail sales to consumers on top of existing state sales tax, plus a 15 PERCENT TAX on grower-to-retailer sales. \u26a0 THE LIST MAY STILL BE INCOMPLETE. MORE THAN A THOUSAND BILLS were filed Monday. The authoritative source is the Texas Legislature Online filing-date report for 11/09/2026 (capitol.texas.gov/Reports/Report.aspx?ID=filingDate&LegSess=90R), which I could only retrieve in truncated form \u2014 it showed additional H and S filings whose captions were cut off, including an HB 188 authored by Bucy that I cannot identify. CHECK TLO DIRECTLY before treating any bill list as exhaustive. \u2b50 ALSO WORTH NOTING: no bill repealing or rewriting the DSHS hemp rules or the Schedule I reinstatement has surfaced, and NO BAN BILL APPEARS AMONG DAY-ONE FILINGS despite Perry's pre-election commitment to file one. Republicans' day-one filings went to property taxes, local lobbying, and English as the official language.", "status": "OPEN", "sources": [{"label": "Texas Cannabis Policy \u2014 SB 237", "url": "https://texascannabispolicy.org/texas-cannabis-bills/"}, {"label": "Audacy/KRLD \u2014 Alvarado, TDLR, tax rates", "url": "https://www.audacy.com/krld/news/local/texas-democrats-file-bills-to-legalize-adult-use-cannabis-and-home-growing"}, {"label": "TLO filing-date report (authoritative, truncated on retrieval)", "url": "https://capitol.texas.gov/Reports/Report.aspx?ID=filingDate&LegSess=90R&Code=2026-11-09"}, {"label": "Texas Tribune \u2014 GOP day-one filings", "url": "https://www.texastribune.org/2026/11/09/texas-legislature-90th-session-bill-filing-begins/"}], "isToday": true}]},
  {"id": "bill-tracker", "label": "Track I \u2014 Bill Tracker: 90th Texas Legislature (2027)", "deadline": "Prefiling opened Nov 9, 2026 \u00b7 convenes Jan 12 \u00b7 filing deadline Mar 12 \u00b7 sine die May 31, 2027", "colorVar": "--gold", "events": [{"date": "2026-11-10", "title": "\u2b50 HOW TO READ THIS TRACK \u2014 summary, and what it is NOT", "detail": "PURPOSE: a running record of every cannabis and hemp bill filed for the 90th Legislature, with author, caption and status, so the legislative front can be tracked separately from the litigation. \u26a0 COMPLETENESS WARNING, STATED UP FRONT: THIS LIST IS NOT EXHAUSTIVE AND SHOULD NOT BE TREATED AS SUCH. More than a thousand bills were filed on Nov 9 alone. The authoritative source is Texas Legislature Online's filing-date report at capitol.texas.gov/Reports/Report.aspx?ID=filingDate&LegSess=90R \u2014 TLO blocks automated retrieval, so everything here comes from secondary trackers and press coverage. At least one Bucy-authored bill, HB 188, appeared in a truncated TLO listing and could not be identified. CHECK TLO DIRECTLY BEFORE SAYING 'ALL' OR 'ONLY' ABOUT ANY BILL COUNT. \u2b50 THE BIG PICTURE IN ONE PARAGRAPH: six cannabis/hemp bills are confirmed filed on day one, all by Democrats. Three are legalization vehicles \u2014 two House, one Senate. One expands medical eligibility. One creates employment protections. One decriminalizes concentrates. NOT ONE of them touches the DSHS consumable-hemp rules or the July 31 Schedule I reinstatement, which are the two things actually suppressing the market right now. And no ban bill has been filed despite Sen. Charles Perry's pre-election commitment to refile one. \u2b50 WHY THE ABSENCES MATTER MORE THAN THE FILINGS: legalization bills are aspirational in a chamber Republicans still control. A bill repealing or rewriting the DSHS rules would be narrow, would moot much of the pending litigation, and would be far easier to pass. Its absence on day one is the most informative fact in this track.", "status": "OPEN", "sources": [{"label": "TLO filing-date report (authoritative)", "url": "https://capitol.texas.gov/Reports/Report.aspx?ID=filingDate&LegSess=90R&Code=2026-11-09"}, {"label": "Texas Cannabis Policy \u2014 bill tracker", "url": "https://texascannabispolicy.org/texas-cannabis-bills/"}], "isToday": true}, {"date": "2026-11-09", "title": "HB 362 \u2014 Bucy (D-Austin) \u00b7 Texas Regulation of Cannabis Act \u00b7 FULL LEGALIZATION", "detail": "CAPTION: 'Relating to the regulation of the cultivation, manufacture, processing, distribution, sale, testing, transportation, delivery, transfer, possession, use, and taxation of cannabis and cannabis products and local regulation of cannabis establishments; authorizing the imposition of fees; requiring an occupational license or registration; creating a criminal offense; imposing a tax.' STATUS: 11/9/2026 H Filed. MECHANICS: adults 21 and over; limited home growing; regulated retail that could begin in 2027. The TEXAS DEPARTMENT OF LICENSING AND REGULATION would license growers, retail cannabis establishments, secure transporters and testing labs. TAXES: 20% on retail sales to consumers on top of existing state sales tax, plus 15% on grower-to-retailer sales. \u26a0 NOTE THE LICENSING CHOICE \u2014 TDLR, not DSHS and not DPS. That is a deliberate move away from both agencies currently running hemp and the Compassionate Use Program, and it would create a third regulatory structure rather than folding cannabis into either existing one.", "status": "FILED", "sources": [{"label": "Texas Cannabis Policy", "url": "https://texascannabispolicy.org/texas-cannabis-bills/"}, {"label": "Audacy/KRLD \u2014 TDLR and tax detail", "url": "https://www.audacy.com/krld/news/local/texas-democrats-file-bills-to-legalize-adult-use-cannabis-and-home-growing"}]}, {"date": "2026-11-09", "title": "HB 369 \u2014 Moody (D-El Paso) \u00b7 Texas Regulation of Cannabis Act \u00b7 near-identical companion", "detail": "Same title as HB 362, described in coverage as containing 'largely identical provisions.' STATUS: 11/9/2026 H Filed. \u2b50 WHY TWO NEARLY IDENTICAL HOUSE BILLS: Moody has carried cannabis reform in the Texas House for multiple sessions and chairs or has chaired criminal-jurisprudence-side work; Bucy is an Austin member with a broader reform portfolio. Filing companions from two authors spreads committee-referral risk and gives leadership two vehicles to choose between. It is a routine tactic, not a disagreement between them. WATCH WHICH ONE GETS A HEARING \u2014 that is the one leadership is backing.", "status": "FILED", "sources": [{"label": "Audacy/KRLD", "url": "https://www.audacy.com/krld/news/local/texas-democrats-file-bills-to-legalize-adult-use-cannabis-and-home-growing"}]}, {"date": "2026-11-09", "title": "\u2b50 SB 237 \u2014 Alvarado (D-Houston) \u00b7 Senate legalization \u00b7 THE ONE THAT MATTERS MOST", "detail": "CAPTION: 'Relating to regulating the cultivation, manufacture, processing, distribution, sale, testing, transportation, delivery, transfer, possession, and use of cannabis and cannabis products; authorizing the imposition of fees; requiring occupational licenses; creating a criminal offense.' STATUS: 11/9/2026 S Filed. \u2b50 NOTE WHAT THE CAPTION OMITS compared to the House versions: no 'taxation,' no 'local regulation of cannabis establishments,' no 'imposing a tax.' Whether that reflects a narrower bill or just caption drafting needs the actual text \u2014 but a Senate vehicle without a tax provision has different committee-referral consequences, since tax bills draw additional scrutiny. \u2b50 WHY THIS IS THE CONSEQUENTIAL FILING: REPUBLICANS STILL HOLD THE SENATE 19-12. Legalization has never had a path in that chamber under Dan Patrick, who controlled referral and committee appointments. Vikki Goodwin now holds that gavel \u2014 though Senate Republicans are reported to be weighing rules changes to limit her powers. Alvarado is a senior member with real standing. This bill is the test of whether the lieutenant governor change actually alters what moves in the Senate, and the answer will be visible by whether it gets referred to a friendly committee.", "status": "FILED", "sources": [{"label": "Texas Cannabis Policy", "url": "https://texascannabispolicy.org/texas-cannabis-bills/"}, {"label": "Audacy/KRLD \u2014 Alvarado authorship", "url": "https://www.audacy.com/krld/news/local/texas-democrats-file-bills-to-legalize-adult-use-cannabis-and-home-growing"}]}, {"date": "2026-11-09", "title": "\u2b50 HB 507 \u2014 Bucy (D) \u00b7 employment protections \u00b7 DIRECTLY RELEVANT TO THE EMPLOYMENT TRACK", "detail": "CAPTION: 'Relating to drug testing and prescription drug policies for employees and independent contractors of state agencies and political subdivisions regarding the medical use of low-THC cannabis and hemp.' STATUS: 11/9/2026 H Filed. EFFECT per Marijuana Moment: would PREVENT STATE AGENCIES AND LOCAL GOVERNMENTS from drug testing most employees and independent contractors for cannabinoids, or penalizing them for lawfully using low-THC medical cannabis or consumable hemp products. \u2b50 WHY THIS IS THE MOST CONSEQUENTIAL BILL IN THE GROUP FOR WORKING TEXANS, and the one this tracker's employment front has been waiting for. Texas currently has NO pre-employment drug-testing statute, Tex. Labor Code \u00a7 21.120 affirmatively permits denying employment to Schedule I/II users, and Compassionate Use Program patients have ZERO workplace protection. HB 507 would be the first Texas statutory employment protection for hemp and medical cannabis users. \u26a0 ITS SCOPE IS LIMITED TO PUBLIC EMPLOYERS \u2014 state agencies and political subdivisions. It does not reach private employers, and it would not touch DOT-regulated safety-sensitive positions, which remain governed by 49 CFR Part 40 regardless of state law.", "status": "FILED", "sources": [{"label": "Marijuana Moment", "url": "https://www.marijuanamoment.net/marijuana-would-be-legalized-statewide-in-texas-under-new-bills-filed-for-2027-session"}, {"label": "NBC DFW", "url": "https://www.nbcdfw.com/news/local/texas-news/texas-legislature-2027-priorities-affordability-big-tech-regulating-big-business/4103564/"}]}, {"date": "2026-11-09", "title": "HB 330 \u2014 Plesa (D) \u00b7 medical eligibility expansion \u00b7 menstrual cramps", "detail": "CAPTION: 'Relating to the medical use of low-THC cannabis by patients with a medical condition that causes menstrual cramps.' STATUS: 11/9/2026 H Filed. A narrow Compassionate Use Program eligibility expansion. \u2b50 CONTEXT WORTH CARRYING: the Legislature expanded CUP in 2025 to cover more conditions and allow additional delivery methods, so this continues an established incremental pattern rather than breaking new ground \u2014 which historically makes these the cannabis bills most likely to pass. \u26a0 AND THE STRUCTURAL IRONY: CUP currently has only THREE OPERATIONAL LICENSE HOLDERS, which is the factual basis for the monopoly claim in the SS Distro litigation and for TOCC's own competitive-injury theory. Expanding eligibility without expanding licensure increases demand inside a three-company market.", "status": "FILED", "sources": [{"label": "Texas Cannabis Policy", "url": "https://texascannabispolicy.org/texas-cannabis-bills/"}]}, {"date": "2026-11-09", "title": "HB 667 \u2014 Moody (D) \u00b7 statewide decriminalization, concentrates", "detail": "STATUS: 11/9/2026 H Filed. Listed by Texas Cannabis Policy as 'Statewide Decriminalization (Concentrates).' \u26a0 FULL CAPTION NOT RETRIEVED \u2014 the tracker entry was truncated. In the 2025 session Moody carried a bill 'relating to the criminal penalties for possession or delivery of marihuana concentrate,' and this is likely a refile of that, but DO NOT ASSUME IDENTICAL TEXT. \u2b50 WHY CONCENTRATES SPECIFICALLY MATTER HERE: concentrate possession in Texas is charged under Penalty Group 2, the same penalty group that now reaches non-delta-9 hemp cannabinoids after the July 31 Schedule I reinstatement. A bill reducing PG2 concentrate penalties could incidentally reduce exposure for hemp products caught by that reinstatement \u2014 which would make it far more relevant to the hemp fight than its title suggests. WORTH PULLING THE TEXT.", "status": "FILED", "sources": [{"label": "Texas Cannabis Policy", "url": "https://texascannabispolicy.org/texas-cannabis-bills/"}]}, {"date": "2026-11-10", "title": "\u26a0 KNOWN GAPS \u2014 what is missing from this track right now", "detail": "LOGGED SO THE HOLES ARE VISIBLE RATHER THAN INVISIBLE. (1) HB 188, authored by BUCY, appeared in a truncated TLO filing-date listing with its caption cut off. UNIDENTIFIED. Given Bucy filed HB 362 and HB 507, a third cannabis-adjacent bill is plausible but unconfirmed. (2) The TLO listing showed ADDITIONAL H and S filings on 11/9 whose captions were truncated \u2014 there may be more cannabis or hemp bills among them. (3) A Penalty Group 1-B benzimidazole-opioids bill was filed the same day; that is Controlled Substances Act territory but not hemp, noted only so it is not mistaken for one. (4) AUTHOR PARTY AND DISTRICT are confirmed for Bucy, Moody, Plesa and Alvarado; no Republican-authored cannabis or hemp bill has been identified among day-one filings. (5) NO COMMITTEE REFERRALS YET \u2014 referral happens after the session convenes Jan 12, and under the new lieutenant governor that is the first real signal in the Senate. \u2b50 HOW TO CLOSE THESE GAPS: the TLO filing-date report and the TLO subject search for 'hemp' and 'cannabis' under LegSess=90R are authoritative and free. They block automated retrieval but open fine in a browser.", "status": "OPEN", "sources": [{"label": "TLO filing-date report", "url": "https://capitol.texas.gov/Reports/Report.aspx?ID=filingDate&LegSess=90R&Code=2026-11-09"}], "isToday": true}, {"date": "2027-01-12", "title": "\u2b50 CALENDAR \u2014 the dates that govern everything in this track", "detail": "NOV 9, 2026 \u2014 prefiling opened. JAN 12, 2027 \u2014 90th Legislature convenes. Members choose the House speaker and adopt chamber rules; \u2b50 THE SENATE RULES VOTE IS THE ONE TO WATCH, because it decides how much power Lieutenant Governor Goodwin actually keeps over referral and committee appointments, and Senate Republicans are reported to be considering limits. MAR 12, 2027 \u2014 deadline to file most bills; after this, new bills need special action. MAY 31, 2027 \u2014 sine die; anything not passed by both chambers is dead. \u26a0 AND THE VETO TRAP, which matters differently now: governors can veto AFTER the session ends, when no override vote is possible. That is exactly how SB 3 died in 2025 under Abbott. With Hinojosa in office the same mechanism now cuts the other direction \u2014 a ban bill that passes both chambers could be vetoed post-session with no override available. FOR SCALE: the 2025 session saw more than 8,700 bills filed and roughly 20% became law.", "status": "OPEN", "sources": [{"label": "CannaWize \u2014 2027 calendar", "url": "https://www.cannawize.co/texas-cannabis-2027-legislature-how-to-get-involved"}, {"label": "Texas Cannabis Policy", "url": "https://texascannabispolicy.org/texas-cannabis-bills/"}]}, {"date": "2027-03-12", "title": "\u26a0 WHAT TO WATCH FOR BEFORE THE MARCH 12 DEADLINE", "detail": "THE BILLS THAT DO NOT EXIST YET ARE THE ONES THAT WOULD MATTER MOST. (1) A BILL REPEALING OR REWRITING THE DSHS CONSUMABLE HEMP RULES \u2014 25 TAC Ch. 300, the total-THC standard, the fee schedule. This would moot much of THBC v. DSHS and is far narrower than legalization. (2) A BILL ADDRESSING THE SCHEDULE I REINSTATEMENT \u2014 the Sky Marketing line of authority runs through Tex. Health & Safety Code \u00a7 481.034, and the Texas Supreme Court said expressly that the commissioner's scheduling decisions are 'final unless altered by statute.' THE COURT TOLD THE LEGISLATURE IT HAS THE TOOL. Justice Young: if the legislature wants to legalize powerful drugs it has every tool it needs, and should do so unmistakably. (3) A STATUTORY DEFINITION OF 'CONVERTED' VERSUS 'NATURALLY OCCURRING' cannabinoids \u2014 the ambiguity driving the trace-amount fight in SS Distro and the vagueness count in Monti. DSHS deferred this to 'a future rulemaking' that never happened. (4) PERRY'S BAN BILL, promised before the election and not yet filed. (5) ANY BILL RESPONDING TO THE FEDERAL DEC 11 STANDARD \u2014 Texas has not aligned with the 0.4mg per-container cap and DSHS expressly declined to adopt it. \u2b50 IF A HEMP-RULES BILL APPEARS, IT CHANGES THE LITIGATION CALCULUS IMMEDIATELY \u2014 courts do not like deciding constitutional questions the legislature is actively resolving.", "status": "OPEN", "sources": [], "isToday": true}]},
  {
    id: "tx-schedule-i", label: "Texas Schedule I Reinstatement — Synthetic/Converted Cannabinoids", deadline: "Takes effect no earlier than July 31, 2026", colorVar: "--red",
    events: [
      { date: "2026-05-01", title: "Texas Supreme Court decides DSHS v. Sky Marketing Corp. (No. 23-0887)", detail: "Reverses the Nov. 2021 temporary injunction that had blocked DSHS's 2021 Schedule I definitions of \u201cTetrahydrocannabinols\u201d and \u201cMarihuana extract\u201d for nearly five years. Court holds the commissioner's 2021 objection to DEA's 2020 conforming rule was procedurally valid, final, and reviewable only by the legislature. DIRECT QUOTE FROM THE OPINION, per Texas Scorecard — Justice Evan Young wrote that if the legislature wants to legalize powerful drugs it has every tool it needs to do so, and to do so unmistakably, as the Court expects for such a major change to social policy; the role of the courts is merely to assess the state of the law as it is. That is the Court explicitly handing the question back to the Legislature, and it is the best short quote available for explaining the holding on air. Lawmakers are expected to take THC legislation up again in 2027 — and that it doesn't conflict with the 2019 Texas Farm Bill (HB 1325).", status: "RESOLVED", sources: [{ label: "Vicente LLP", url: "https://vicentellp.com/insights/texas-reinstates-schedule-i-ban-on-synthetic-cannabinoids-after-supreme-court-ruling/" }, { label: "Texas Scorecard — Justice Young quote", url: "https://texasscorecard.com/state/court-order-blocking-hemp-classification-expires-in-a-week/" }] },
      { date: "2026-06-05", title: "Mandate issues — injunction dissolved, but the case survives", detail: "The Texas Supreme Court's mandate formally dissolved the November 2021 temporary injunction. CORRECTION to earlier tracker versions, which described this as closing out the litigation: per KUT, the Court said the CASE MAY STILL PROCEED — what it removed was the order that had stopped enforcement, not the suit itself. Sky Marketing remains live; only the shield is gone.", status: "RESOLVED", sources: [{ label: "Vicente LLP", url: "https://vicentellp.com/insights/texas-reinstates-schedule-i-ban-on-synthetic-cannabinoids-after-supreme-court-ruling/" }] },
      { date: "2026-07-10", title: "DSHS publishes Texas Register notice reinstating 2021 Schedule I definitions", detail: "Restores definitions omitted from the published schedules since January 2022. Practical effect: converted/synthetic cannabinoids — delta-8 THC (converted from hemp CBD), delta-10, THC-O, HHC, and similar products — are once again Schedule I controlled substances in Texas. Only up to 0.3% delta-9 THC in compliant hemp (Tex. Ag. Code Ch. 121), and trace naturally-occurring delta-8, remain outside the schedules — a narrow carve-out that covers essentially no commercial product.", status: "FILED", sources: [{ label: "Vicente LLP", url: "https://vicentellp.com/insights/texas-reinstates-schedule-i-ban-on-synthetic-cannabinoids-after-supreme-court-ruling/" }, { label: "Texas Register notice (PDF)", url: "https://www.sos.texas.gov/texreg/archive/July102026/In%20Addition/202602610-1.pdf" }] },

function esc(str) {
  var d = document.createElement("div");
  d.textContent = str;
  return d.innerHTML;
}

function fmtDate(iso) {
  if (iso.slice(-3) === "-xx") {
    var d1 = new Date(iso.replace("-xx", "-01") + "T00:00:00");
    return d1.toLocaleDateString("en-US", { month: "long", year: "numeric" });
  }
  var d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
}

function sortKey(iso) {
  // "-xx" months sort as the 1st of that month
  return iso.replace("-xx", "-01");
}

function byDate(events) {
  return events.slice().sort(function (a, b) {
    var ka = sortKey(a.date), kb = sortKey(b.date);
    return ka < kb ? -1 : ka > kb ? 1 : 0;
  });
}

function sourcesHtml(sources) {
  if (!sources || sources.length === 0) return "";
  var links = sources.map(function (s) {
    if (!s.url) { return '<span class="source-offline">' + esc(s.label) + "</span>"; }
    return '<a class="source-link" href="' + esc(s.url) + '" target="_blank" rel="noreferrer">' + esc(s.label) + " ↗</a>";
  }).join("");
  return '<div class="sources">' + links + "</div>";
}

function stampHtml(status) {
  return '<div class="stamp stamp-' + status + '">' + status + "</div>";
}

function eventCardHtml(e) {
  var todayCls = e.isToday ? " today" : "";
  return (
    '<div class="event">' +
      '<div class="event-dot' + todayCls + '"></div>' +
      '<div class="event-card' + todayCls + '">' +
        '<div class="event-top">' +
          '<div><div class="event-date">' + fmtDate(e.date) + '</div>' +
          '<div class="event-title">' + esc(e.title) + "</div></div>" +
          stampHtml(e.status) +
        "</div>" +
        '<div class="event-detail">' + esc(e.detail) + "</div>" +
        sourcesHtml(e.sources) +
      "</div>" +
    "</div>"
  );
}
