      {"date":"2026-04-30","title":"Comer withdraws 2026 Farm Bill amendment; Barr draft not attached","detail":"House passes 2026 Farm Bill without addressing the hemp ban. Barr's Legal Hemp Protection Act draft (1% delta-9 dry-weight threshold, measured on finished product) circulates but isn't formally attached before Rules Committee action.","status":"WITHDRAWN","sources":[{"label":"Cannabis Business Times","url":"https://www.cannabisbusinesstimes.com/hemp/news/15823852/s-house-passes-2026-farm-bill-intoxicating-hemp-product-ban-remains"}]},
      {"date":"2026-05-28","title":"Barr, Fry, Comer file amendments to H.R. 8646 (FY27 Ag appropriations)","detail":"Barr: full regulatory framework (Amendment #54) — FDA oversight, mg limits, labeling, Medicare Advantage coverage, TTB enforcement/user fee. Fry (w/ Baird), amendment FRY_128: a one-sentence delay striking “365 days” and inserting “3 years” in §781. INCONSISTENCY RESOLVED: earlier entries called this both a 3-year and a 2-year delay, and both are correct because they measure from different points. §781 was enacted Nov. 12, 2025 with implementation 365 days later (Nov. 12, 2026). Changing that clock to 3 years from enactment moves implementation to Nov. 12, 2028 — which is a TWO-year delay relative to the current deadline. So: “3 years” is the statutory text, “2-year delay” is the practical effect. On air, say it pushes the deadline to November 2028 and avoid the bare year-count. Caveat on provenance: this reconciliation comes from an earlier tracker build of mine plus arithmetic, NOT from the amendment text — the arithmetic is sound but the “365 days” → “3 years” wording is unverified against the filed amendment. Note this lands on the same Nov. 2028 date as H.R. 7024, by a different drafting route. Comer (w/ Griffith), amendment COMER_098: a one-sentence appropriations rider prohibiting any FY2027 funds from being used to implement §781. Mechanically the weakest of the three and the most legally fragile — it does not touch the underlying statute, so §781 remains law and becomes enforceable again the moment funding is restored or a future administration reads the rider narrowly. It buys one fiscal year and resets the same fight at the next appropriations cycle. Comer is a Kentucky Republican, same state as Barr — the two represent different theories of relief from the same constituency pressure: Barr builds a permanent framework, Comer just stops the clock.","status":"FILED","sources":[{"label":"Cannabis Business Times","url":"https://www.cannabisbusinesstimes.com/hemp/news/15826349/3-us-house-republicans-attempt-to-thwart-intoxicating-hemp-product-ban"},{"label":"Marijuana Moment","url":"https://www.marijuanamoment.net/gop-lawmakers-file-amendments-to-prevent-federal-recriminalization-of-hemp-thc-products-this-year/"},{"label":"Barr Amendment text (House Rules Cmte PDF)","url":"https://amendments-rules.house.gov/amendments/BARR_144_xml260529091653809.pdf"}]},
      {"date":"2026-06-02","title":"House Rules Committee blocks all hemp amendments from floor votes","detail":"Correction to prior tracking — this was not still pending. The Rules Committee declined to make in-order any of the hemp-related amendments: Barr's Lawful Hemp Protection Act (25 pp.), Fry/Baird's 2-year delay, Omar's separate 1-year delay, and Comer/Fry's non-enforcement rider. None will receive a floor vote as amendments to H.R. 8646.","status":"BLOCKED","sources":[{"label":"Marijuana Moment","url":"https://www.marijuanamoment.net/amendments-to-keep-hemp-thc-products-federally-legal-wont-get-votes-after-congressional-committee-blocks-them/"}]},
      {"date":"2026-06-24","title":"OMB (Vought) letter to Speaker Johnson","detail":"On behalf of Trump, requests Congress either adopt the Barr framework (Amendment #54 language) or, at minimum, extend the Section 781 implementation deadline. Signals White House engagement now that the amendment route is closed.","status":"OPEN","sources":[{"label":"Cannabis Business Times","url":"https://www.cannabisbusinesstimes.com/hemp/news/15828617/white-house-asks-congress-to-revise-hemp-definition-delay-thc-product-ban"},{"label":"U.S. Hemp Roundtable","url":"https://hempsupporter.com/news/big-news-the-white-house-just-called-on-congress-to-fix-the-hemp-ban/"}]},
      {"date":"2026-06-04","title":"H.R. 8646 passes full House — no hemp language attached","detail":"213-210. With the amendments blocked before reaching the floor, the bill moved through without a Barr framework, Fry delay, or Comer rider. Bill now sits with the Senate.","status":"RESOLVED","sources":[{"label":"House Approps Cmte (R) release","url":"https://appropriations.house.gov/news/press-releases/house-passes-hr-8646-strong-agriculture-strong-communities-strong-america"},{"label":"Congress.gov actions","url":"https://www.congress.gov/bill/119th-congress/house-bill/8646/all-actions"}]},
      {"date":"2026-08-02","title":"⚠ NEW VEHICLE — FY27 stopgap CR, Div. B Sec. 2019 “Section 781 Extension”","detail":"Text released Sunday Aug 2, 2026 by Senate Appropriations (Collins/Murray) as the Continuing Appropriations and Extensions Act, 2027. Legislative vehicle: H.R. 6500. Funds government through Dec 11, 2026, past the Sept 30 fiscal year end. Marijuana Moment characterizes the carve-out as permitting immediate Nov 12 recriminalization of synthetic cannabinoids “that are not capable of being naturally produced by a Cannabis sativa L. plant.” This is a BUDGET-RIDER MECHANISM inside a funding CR — categorically different from the seven standalone bills tracked above (Barr/Craig, CSRA, CAOA, Mace, Baird, Griffith, Paul/Klobuchar), and it should not be grouped with them. THE FULL TEXT IS TWO SENTENCES: ‘SEC. 2019. SECTION 781 EXTENSION. Until December 11, 2026, the amendments made by section 781 of division B of Public Law 119-37 (7 U.S.C. 1639o note) shall only apply with respect to products described in paragraphs (1)(C)(ii)(I) and (1)(C)(iv)(I) of section 297A of the Agricultural Marketing Act of 1946 (7 U.S.C. 1639o) (as amended by such section 781).’ WHAT IS CONSPICUOUSLY ABSENT: there is no language striking ‘365 days’ and inserting a longer period. That is how EVERY prior delay measure was drafted — Baird’s Hemp Planting Predictability Act (H.R. 7024) and the Comer amendment both pushed the effective date itself. Sec. 2019 leaves the effective date untouched and narrows SCOPE instead. Different mechanism, and the distinction drives everything below.","status":"FILED","sources":[{"label":"Nothing But Canna — full text + analysis","url":"https://www.nothingbutcanna.net/blogs/news/senate-funding-bill-includes-temporary-extension-for-hemp"},{"label":"CED Clinic — independent read","url":"https://cedclinic.com/senate-hemp-thc-delay-december-2026/"}]},
      {"date":"2026-08-03","title":"⚠⚠ CRITICAL FRAMING — this is a 29-day narrowing, NOT a delay of the ban","detail":"The single most likely thing to get reported wrong. MECHANISM PRECISELY: (1) Nov 12, 2026 — Section 781’s new hemp definition still takes effect on schedule, entirely unchanged. The ban switches on. (2) Nov 12 to Dec 11, 2026 — a 29-day window during which Section 781 applies ONLY to products under 297A paragraphs (1)(C)(ii)(I) and (1)(C)(iv)(I): cannabinoids that cannot be naturally produced by the cannabis plant. That means HHC, HHC-O, THC-O acetate and other fully synthetic analogs become federally unlawful on Nov 12 and STAY unlawful. (3) Everything else — the total-THC standard and the 0.4mg-per-container cap that together threaten the THCA and edibles market — goes dormant for those 29 days, then SNAPS BACK into force Dec 11 unless Congress acts again first. PODCAST FRAMING: this is a delay of consequence, not a delay of the law. It does not save the THCA or edibles market past Dec 11. It buys roughly four weeks and punts the real fight to the next funding deadline. STRUCTURAL POINT WORTH AIRING: the Dec 11 hemp expiry is the SAME DATE the CR’s government funding runs out — so hemp gets relitigated at the next shutdown deadline, with all the leverage dynamics that implies. Anyone describing this as ‘hemp saved’ or ‘ban delayed a year’ is wrong on both counts.","status":"PENDING","sources":[{"label":"Nothing But Canna","url":"https://www.nothingbutcanna.net/blogs/news/senate-funding-bill-includes-temporary-extension-for-hemp"},{"label":"CED Clinic — ‘pending proposal, not a permission slip’","url":"https://cedclinic.com/senate-hemp-thc-delay-december-2026/"}]},
      {"date":"2026-08-03","title":"Aug 3 procedural vote — cloture on MOTION TO PROCEED, not passage","detail":"WHAT THE Aug 3 VOTE ACTUALLY WAS: per the Senate Democratic Caucus schedule, the Senate convened at 3:00pm and at approximately 5:30pm voted on a motion to invoke cloture on the MOTION TO PROCEED to Cal. #320, H.R. 6500 — the legislative vehicle for the CR. That is a procedural step to begin debate, two removes from passage. ✅ GAP CLOSED as of Aug 6: cloture WAS invoked, 89-4, Senate Record Vote No. 218, on MONDAY EVENING Aug 3 (confirmed by The Hill and CBS). The four nays were Kaine (D-VA), RAND PAUL (R-KY), Sanders (I-VT), and Warren (D-MA). PAUL’S NO VOTE IS THE NOTABLE ONE and worth airing carefully: Paul is the Senate’s most consistent hemp defender — he voted against the November 2025 CR specifically over the §781 hemp redefinition and offered the one-page amendment to strike it, which failed 76-24. Here he voted against a CR that contains hemp RELIEF. No public explanation was located for that vote; a plausible read is that a 29-day narrowing is not a fix and he wants the underlying redefinition repealed outright, but DO NOT ASSERT THAT MOTIVE ON AIR without a statement from him. VERIFICATION GAP: I could not confirm the outcome of that cloture vote as of this check. Do not assume it succeeded, and do not describe the CR as Senate-passed. Bipartisan support was reported and the measure was expected to clear 60 votes, but NOTHING HAS PASSED. Sequence still required: Senate passage, then House agreement, then presidential signature. A CR can change materially during negotiation — released committee text is not enacted law, and Sec. 2019 could be modified or stripped in conference. CED Clinic’s framing is the right one for air: this is a pending federal proposal, not a current permission slip, and state law can remain more restrictive regardless. CRITICAL FOR TEXAS LISTENERS: even if Sec. 2019 becomes law, it changes NOTHING about the Texas Schedule I isomer ban that took effect July 31 (Track 4) or the DSHS total-THC rules at issue in THBC v. DSHS (Track 1). Federal relief does not preempt stricter state law, and the Barr/Craig bill’s own non-preemption clause reflects that same principle. Delta-8 remains a state jail felony in Texas irrespective of what the Senate does today.","status":"PENDING","sources":[{"label":"CED Clinic","url":"https://cedclinic.com/senate-hemp-thc-delay-december-2026/"}],"isToday":true},
      {"date":"2026-08-04","title":"⚠⚠ HEADLINE TRAP — “Senate Approves 30-Day Hemp Deadline Extension” is NOT accurate","detail":"BevNET and Brewbound both ran the headline ‘Senate Approves 30-Day Hemp Deadline Extension’ on Aug 3. THEIR OWN ARTICLE BODIES CONTRADICT THE HEADLINE — the same pieces state the provision is ‘expected to go to a vote this week’ and that ‘Should it pass in the Senate, the resolution would still need approval from the House of Representatives and then the President.’ What actually happened on Aug 2 was that Senate Appropriations LEADERS RELEASED TEXT. Marijuana Moment, reporting the same day, is precise: leaders ‘included provisions’ in a bill, and ‘if the Senate passes its new provision it would then still need approval by the other chamber.’ IF YOU SAW A HEADLINE SAYING THE SENATE APPROVED THIS ON AUG 3, IT WAS WRONG OR AT BEST PREMATURE. UPDATE Aug 6: the Senate has since invoked cloture on the motion to proceed 89-4 and agreed to the motion to proceed by voice vote — real progress, but STILL NOT PASSAGE. Cloture has been filed on the Collins substitute carrying the actual text; the substitute has not been voted, the bill has not passed the Senate, and the House has not acted. The headline was premature on Aug 3 and remains inaccurate today. Trade press in this sector routinely compresses ‘text released’ into ‘approved.’ Use Marijuana Moment or the Senate Appropriations release itself over trade-outlet headlines on procedural questions.","status":"OPEN","sources":[{"label":"Marijuana Moment — precise account","url":"https://www.marijuanamoment.net/senate-gives-hemp-thc-products-a-lifeline-by-including-provisions-to-delay-planned-federal-ban-in-new-spending-bill/"},{"label":"Senate Approps — bill text release","url":"https://www.appropriations.senate.gov/news/majority/bill-text-continuing-appropriations-and-extensions-act-2027"},{"label":"BevNET — the overstated headline","url":"https://www.bevnet.com/news/2026/senate-approves-30-day-hemp-deadline-extension-beverage-leaders-praise-important-step"}]},
      {"date":"2026-08-04","title":"THE HOUSE PROBLEM — it already passed a CR with NO hemp language","detail":"The most underreported obstacle. Per Marijuana Moment: last month the House passed its OWN version of the continuing resolution, and it contained no provisions altering the hemp ban. So Sec. 2019 is a Senate addition to a bill the House has already acted on without it. The House must affirmatively accept language it previously declined to include — that is a real hurdle, not a formality, and it is where the provision is most likely to die. Recall also that the House Rules Committee blocked all four hemp amendments from floor votes on June 2, so House leadership has already demonstrated it will keep hemp off the floor when it chooses. INDUSTRY’S OWN FRAMING CONFIRMS THIS IS NOT DONE: Jonathan Miller (U.S. Hemp Roundtable) called it ‘a landmark victory... our biggest win since the 2018 Farm Bill’ — but note the conditional in his actual sentence: ‘Passage of the CR IN ITS CURRENT FORM WOULD BE a landmark victory.’ He then said the work is not done, that USHR will be ‘deeply engaged in ensuring that the current language is retained through the Senate and House CR votes,’ and that they will pursue ‘a more comprehensive fix when we reach the next government funding deadline in December.’ That is the industry’s own counsel independently confirming this tracker’s Dec 11 leverage analysis.","status":"PENDING","sources":[{"label":"Marijuana Moment","url":"https://www.marijuanamoment.net/senate-gives-hemp-thc-products-a-lifeline-by-including-provisions-to-delay-planned-federal-ban-in-new-spending-bill/"}],"isToday":true},
      {"date":"2026-08-05","title":"Motion to proceed AGREED TO — and the CR text moves into a substitute amendment","detail":"Per the Senate Daily Press for Wednesday Aug 5: at 10:43 a.m. the motion to proceed to H.R. 6500 was agreed to BY VOICE VOTE and Majority Leader Thune filed the amendment tree. At 10:47 a.m. Thune filed cloture on COLLINS SUBSTITUTE AMENDMENT #6732 to H.R. 6500. THIS IS THE PROCEDURAL FACT THAT MATTERS MOST RIGHT NOW: the CR text — and therefore Sec. 2019, the hemp provision — rides in the Collins substitute, not in the base bill. Watch amendment #6732, not H.R. 6500, to track whether the hemp language survives. Filing the amendment tree also limits what else can be attached, which is standard leadership practice to protect a negotiated package. NEXT STEP: a cloture vote on the Collins substitute, then final passage, then the House.","status":"PENDING","sources":[{"label":"U.S. Senate Daily Press — Aug 5","url":"https://www.dailypress.senate.gov/wednesday-august-5-2026/"}]},
      {"date":"2026-08-06","title":"H.R. 6500 is a SHELL — it is not a hemp bill or even a spending bill","detail":"Worth knowing before anyone looks it up and gets confused. H.R. 6500’s actual title, per Senate floor records, is a bill to extend duty-free treatment for imports from certain African countries under the African Growth and Opportunity Act and to extend customs user fees. It is a House-passed vehicle being repurposed to carry the continuing resolution — routine practice, since a bill that has already cleared the House can be substituted-into and sent back without starting over. So: the AGOA/customs text is the husk, the Collins substitute #6732 is the actual CR, and Sec. 2019 is the hemp provision inside that substitute. If you search the bill number you will find an Africa trade bill; that is not an error.","status":"OPEN","sources":[{"label":"Senate floor activity — H.R. 6500 title + Vote 218","url":"https://www.senate.gov/legislative/LIS/floor_activity/floor_activity.htm"}]},
      {"date":"2026-08-18","title":"Status as of today (Tue Nov 10): 86 days out — House returns in ~2 weeks","detail":"✅ SENATE AMENDMENT PROCESS COMPLETE: motion to table the Budd amendment agreed to 61-32; Collins substitute #6732 agreed to, putting Sec. 2019 into the bill text; third reading ordered, meaning a final passage vote follows immediately. THE FIGHT NOW MOVES ENTIRELY TO THE HOUSE, which returns Aug 31 and passed its own CR through Dec 4 with no hemp language. Historical note on how this resolved: the outcome turned on a MOTION TO TABLE the Budd amendment (#6747), moved by Klobuchar on behalf of a bipartisan group. That is a meaningfully different posture than a straight up-or-down vote on Budd’s amendment, and it favors the extension’s survival — tabling lets senators kill the amendment procedurally without casting a recorded vote on hemp’s merits, which is easier for members who are uneasy about the products but do not want to blow up a bipartisan funding deal. Earlier today this tracker assessed Sec. 2019 as more likely than not to be STRIPPED, based on the germaneness ruling, nine cosponsors, and the Daily Caller’s read. That assessment is now UNCERTAIN rather than leaning either way — the tabling motion is a real counterweight and I do not know the result. Do not describe the hemp extension as likely to become law, and do not describe it as likely dead either. Procedural history: cloture on the motion to proceed invoked 89-4 Monday evening Aug 3; motion to proceed agreed by voice vote Aug 5; cloture filed on the Collins substitute carrying the CR and Sec. 2019. Senate aiming to pass before leaving for recess this week. REVISED RISK ASSESSMENT: the 89-4 margin still suggests the CR itself is not in trouble, but Sec. 2019 SPECIFICALLY is now in real jeopardy on TWO fronts rather than one. (1) SENATE — GOP senators are reportedly adamant about stripping the hemp language, which the White House inserted late and without warning to the conference. (2) HOUSE — it passed a DIFFERENT CR on July 20 running to Dec 4 with no hemp provision, and does not return until Aug 31. Anyone treating Sec. 2019 as likely to become law is overreading a procedural vote on the underlying funding bill. Government funding and the hemp 29 days are now clearly SEPARABLE outcomes.","status":"PENDING","sources":[{"label":"Senate Daily Press","url":"https://www.dailypress.senate.gov/"}],"isToday":true},
      {"date":"2026-08-06","title":"⚠⚠ MAJOR — the hemp language came from the WHITE HOUSE, and GOP senators want it STRIPPED","detail":"Reported by The Hill roughly seven hours before this update. GOP senators battled White House legislative staff at Wednesday’s conference lunch over language THE WHITE HOUSE ADDED to the CR delaying the hemp-derived THC ban until December. Republicans in the meeting described the discussion as HEATED and said the White House BLINDSIDED GOP lawmakers with the addition. Some GOP senators are reported as adamant about stripping it. Thune, arriving at the Capitol Wednesday morning and juggling this alongside a budget resolution fight and Cruz’s college-athlete bill, told reporters: ‘It’s kind of a train wreck, isn’t it?’ WHY THIS MATTERS FOR ATTRIBUTION: this tracker previously flagged as DISPUTED Barr’s claim that the White House backed his standalone bill — a White House official declined to confirm it to Marijuana Moment and sources cited objections to inhalable provisions. This reporting does not resolve that dispute, but it does establish the administration is actively inserting hemp language into must-pass vehicles itself. The correct framing is that the White House is engaged on hemp — but on its own terms and its own text, not necessarily behind Barr’s bill. RISK TO SEC. 2019: the provision now faces intra-party opposition from the same conference whose votes it needs, and it was added by the executive branch rather than negotiated through the committee. That is a materially weaker position than ‘bipartisan appropriations agreement’ implies.","status":"OPEN","sources":[{"label":"The Hill — GOP vs. White House on CR hemp language","url":"https://thehill.com/homenews/senate/6012731-senate-gop-internal-squabbles/"}],"isToday":true},
      {"date":"2026-08-06","title":"⚠ DATE MISMATCH — House CR runs to Dec 4, Senate CR to Dec 11","detail":"Easy to miss and consequential. Per Cannabis Business Times, the House passed its own stopgap on JULY 20 funding agencies through DECEMBER 4 — and with NO hemp extension. The Senate’s Continuing Appropriations and Extensions Act, 2027 runs through DECEMBER 11 and carries Sec. 2019. So the two chambers differ on both the funding date and the hemp provision, which guarantees the House must act again rather than simply accepting the Senate text. TIMING PROBLEM: the House has already left for August recess and does not return until AUG 31 per CBS. The Senate is trying to pass its version before leaving this week. That means a roughly three-and-a-half week gap in which the Senate text sits with no House counterpart, and Speaker Johnson faces a choice between a bipartisan Senate package and pressure from his own conference to hold the House-approved measure. If Sec. 2019 dies, this gap is the likeliest place it happens.","status":"PENDING","sources":[{"label":"Cannabis Business Times — House CR Dec 4, no hemp","url":"https://www.cannabisbusinesstimes.com/hemp/news/15831475/us-senate-plans-to-delay-ban-on-intoxicating-hemp-products"},{"label":"CBS — House returns Aug 31","url":"https://www.cbsnews.com/news/senate-government-funding-midterm-elections/"}],"isToday":true},
      {"date":"2026-08-04","title":"⚠⚠ TRUMP PERSONALLY CALLED BUDD — and the stated reason is new","detail":"Per Axios (Stef W. Kight), Trump personally intervened Tuesday night Aug 4, calling Sen. Ted Budd (R-NC) in a wide-ranging call to lay out why the White House supports the one-month delay. THE RATIONALE IS THE NEWS: per a source familiar with the call, the White House is working on A BROADER FRAMEWORK ADDRESSING THC PRODUCTS FOR MEDICINAL USES, and officials are concerned the ban could complicate those plans. That is the first reported explanation of WHY the administration wants breathing room, and it reframes Sec. 2019 as a placeholder protecting a larger unannounced initiative rather than a favor to the hemp industry. Axios’s framing: THC clearly matters to the White House ahead of the midterms. FOR THE PODCAST: this connects to the Barr/Craig dispute already tracked here — the White House would not confirm backing Barr’s specific bill, and this suggests why: it may be developing its own medicinal-THC framework rather than endorsing someone else’s.","status":"OPEN","sources":[{"label":"Axios — Inside the GOP hemp wars","url":"https://www.axios.com/2026/08/05/trump-ted-budd-senate-republicans-hemp"}]},
      {"date":"2026-08-06","title":"⚠⚠ BUDD AMENDMENT RULED GERMANE — 50 votes, not 60, and it may pass","detail":"THE MOST IMPORTANT PROCEDURAL FACT IN THIS TRACK RIGHT NOW. Sen. Ted Budd (R-NC) filed an amendment to STRIP Sec. 2019 from the CR. On Thursday Aug 6 the Senate parliamentarian ruled it GERMANE, meaning it needs only a SIMPLE MAJORITY of 50 votes rather than 60 — per a Senate aide familiar, via Axios. Support has grown: the amendment now has NINE COSPONSORS, with Pete Ricketts (R-NE) publicly standing behind it alongside Budd. The Daily Caller assessed that Budd’s amendment WOULD LIKELY PASS. If it does, the hemp extension is stripped and the Nov 12 ban stands unchanged. Budd’s own framing, posted Aug 3: he is offering the amendment ‘to strip out an extension of the hemp loophole to ensure unregulated, dangerous intoxicants are not sold, especially to kids.’ TIMING: a vote could come as soon as TODAY, Friday Aug 7 — NACS issued an urgent member alert eight hours before this update urging opposition. This is live right now.","status":"PENDING","sources":[{"label":"Axios — germaneness ruling, 9 cosponsors","url":"https://www.axios.com/2026/08/05/trump-ted-budd-senate-republicans-hemp"},{"label":"Daily Caller — ‘would likely pass’","url":"https://dailycaller.com/2026/08/06/hemp-ban-could-cause-xxxx-to-go-up-in-smoke/"},{"label":"Marijuana Herald — parliamentarian ruling","url":"https://themarijuanaherald.com/2026/08/senate-hemp-ban/"},{"label":"NACS — urgent action alert","url":"https://www.convenience.org/stay-current/news/2026/august/7/urgent-the-senate-could-vote-today-on-hemp-amendment"}]},
      {"date":"2026-08-05","title":"The GOP lunch, in detail — and a White House commitment worth holding them to","detail":"Axios, citing three sources familiar with the closed-door Senate GOP lunch Wednesday Aug 5: Sens. TOM COTTON (R-AR), PETE RICKETTS (R-NE) and TED BUDD (R-NC) clashed with White House legislative liaison JAMES BRAID and argued forcefully for letting the ban take effect in November as planned. Their concern centered on children’s access — Cotton called the products ‘gas-station marijuana candy,’ which is the quote that will travel. THE COMMITMENT: Braid, in response, COMMITTED TO NO FURTHER DELAYS beyond the one in the short-term funding measure. That is a specific, on-record administration promise — worth logging now and checking against behavior at the Dec 11 deadline, when the industry will want another extension. If the White House seeks a second delay in December, this commitment is the thing to hold up.","status":"OPEN","sources":[{"label":"Axios","url":"https://www.axios.com/2026/08/05/trump-ted-budd-senate-republicans-hemp"}]},
      {"date":"2026-08-05","title":"⚠ CONFLICT-OF-INTEREST REPORTING — handle carefully on air","detail":"REPORTED, NOT ADJUDICATED — state it as reporting and attribute it. The New York Times (Aug 5) and NBC News reported that a delay would benefit White House Chief of Staff Susie Wiles’ son-in-law, who owns a company selling intoxicating hemp products. Per the Daily Caller citing NBC: Bret Worley, CEO of MC Nutraceuticals, married Wiles’ daughter Caroline in June 2026. The Marijuana Herald headlined it as a Colorado hemp executive with family ties to the Trump chief of staff being at the center of the push to delay. HOW TO HANDLE THIS: a family relationship is not itself evidence of improper influence, and no finding of wrongdoing has been reported. Attribute to NYT and NBC, describe the relationship factually, and note that the White House has offered a separate stated rationale (the medicinal-THC framework, above). Presenting the family tie as the explanation would go beyond what the reporting supports. I have NOT read the NYT piece directly — this is secondhand via Axios and Daily Caller summaries.","status":"OPEN","sources":[{"label":"Axios — links NYT reporting","url":"https://www.axios.com/2026/08/05/trump-ted-budd-senate-republicans-hemp"},{"label":"Daily Caller — names Worley, cites NBC","url":"https://dailycaller.com/2026/08/06/hemp-ban-could-cause-xxxx-to-go-up-in-smoke/"}]},
      {"date":"2026-08-06","title":"TEXAS ANGLE — Cruz now BACKS the hemp language, calling it ‘common sense’","detail":"Per the Marijuana Herald (Aug 6), Sen. Ted Cruz (R-TX) backs the Senate funding bill’s hemp language and called the short extension ‘common sense.’ NOTE THE EVOLUTION AGAINST EARLIER TRACKING: this tracker previously recorded Cruz describing the odds of averting the ban this year as an ‘uphill path.’ These are not strictly contradictory — one is a prediction about likelihood, the other a position on the merits — but if you quoted the ‘uphill path’ line on air previously, update it. Cruz supporting the extension is meaningful for Texas listeners given that Texas has moved the opposite direction at the state level, with the isomer ban effective July 31 and criminal exposure attaching to possession.","status":"OPEN","sources":[{"label":"Marijuana Herald","url":"https://themarijuanaherald.com/2026/08/daily-cannabis-news-brief-for-8-6-2026/"}]},
      {"date":"2026-08-06","title":"34 state AGs oppose the delay — and the Farm Bill vehicle just closed","detail":"TWO ITEMS. (1) Per Cannabis Business Times, the chief legal officers of 34 STATES AND ONE U.S. TERRITORY sent a letter to congressional leaders directing them NOT to delay the ban. That is substantial multistate law-enforcement pressure running directly against Sec. 2019, and it is the institutional counterweight to the industry lobbying. Worth checking whether Texas AG Paxton signed — he is a defendant in Monti v. Garcia and his position would be notable either way. (2) THE FARM BILL PATH IS CLOSED FOR NOW: the Senate Agriculture Committee voted 11-10 on Aug 6 NOT to advance its 2026 Farm Bill package, so it will not reach the floor until at least September. This tracker previously listed the Farm Bill as a plausible alternative vehicle for a hemp fix — that route is unavailable in the near term. If hemp-related amendments are to harmonize with the House’s provisions, it now happens after recess at the earliest. The 2018 Farm Bill extension expires Sept 30.","status":"OPEN","sources":[{"label":"Cannabis Business Times — 34 AG letter","url":"https://www.cannabisbusinesstimes.com/hemp/news/15831475/us-senate-plans-to-delay-ban-on-intoxicating-hemp-products"},{"label":"Cannabis Business Times — Farm Bill fails 11-10","url":"https://www.cannabisbusinesstimes.com/legislation-and-regulation/2018-farm-bill-status/news/15831972/senate-fails-to-advance-2026-farm-bill-what-it-means-for-hemp"}]},
      {"date":"2026-08-07","title":"⚠⚠ LIVE TONIGHT — Klobuchar moves to TABLE Budd amendment #6747; READ THE VOTE BACKWARDS","detail":"From a floor transcript of tonight’s session. Sen. Amy Klobuchar (D-MN) rose on behalf of herself and several others, Democrats and Republicans, and MOVED TO TABLE amendment number 6747 — the Budd amendment — and asked for the yeas and nays. The clerk began the roll call. ⚠ CRITICAL FOR READING THE RESULT: a motion to table KILLS an amendment without a vote on its merits and requires only a SIMPLE MAJORITY. The vote logic is INVERTED from what you would expect: A YES/AYE VOTE ON THE MOTION TO TABLE = KILLING THE BUDD AMENDMENT = SEC. 2019 AND THE HEMP EXTENSION SURVIVE. A NO VOTE = the Budd amendment stays alive and likely passes, stripping the extension. If you report this on air, do not say ‘senators voted yes on hemp’ or ‘no on hemp’ without specifying that the vote was on a procedural motion to table. This is the single easiest thing to get backwards tonight. AMENDMENT NUMBERS, to keep straight: #6732 is the Collins substitute carrying the CR and Sec. 2019; #6747 is the Budd amendment to strip it. ✅ FINAL: motion to table agreed to 61-32. Budd amendment dead. Collins substitute #6732 then agreed to, incorporating Sec. 2019 into the bill text, followed by third reading. See the Aug 8 result entry for what this does and does not mean. VOTE-COUNTING NOTE that proved important: Budd had picked up Democratic cosponsors, so this never broke on party lines — and the 61-vote margin to table confirms substantial bipartisan support for keeping the extension.","status":"PENDING","sources":[{"label":"Floor transcript (user-supplied, ASR)","url":""}],"isToday":true},
      {"date":"2026-08-07","title":"⚠ CORRECTION — Sec. 2019 is NOT purely a White House invention; it derives from the Klobuchar/Paul/Merkley bill","detail":"IMPORTANT CORRECTION to this tracker’s framing over the last two days. Klobuchar’s own press release states that the CR’s hemp provision is BASED ON THE BIPARTISAN HEMP PLANTING PREDICTABILITY ACT she introduced with Sens. PAUL (R-KY) and MERKLEY (D-OR), and negotiated with the strong support of Sen. SHEEHY (R-MT). That is H.R. 7024 / S. 3686 — which this tracker has been listing as a SEPARATE competing bill in the crowded-field entry. So the two framings are both partly right and need to be held together: The Hill accurately reported that the White House added the language and blindsided the GOP conference on process, but the TEXT ITSELF descends from an existing bipartisan Senate bill with a Republican cosponsor, not from something the administration drafted alone. Saying ‘the White House inserted its own hemp language’ is accurate as to process and misleading as to origin. The cleaner formulation for air: the White House pushed a provision derived from a bipartisan bill into the CR without warning the Senate GOP conference. NOTE THE PAUL PUZZLE DEEPENS: Rand Paul is a cosponsor of the underlying bill, yet voted NO on cloture Aug 3. Still no public explanation located.","status":"OPEN","sources":[{"label":"Klobuchar press release","url":"https://www.klobuchar.senate.gov/public/index.cfm/news-releases?ID=E49714F1-7975-4D00-9C4B-5CE5087BC9F0"},{"label":"The Hill — White House process account","url":"https://thehill.com/homenews/senate/6012731-senate-gop-internal-squabbles/"}]},
      {"date":"2026-08-07","title":"The floor arguments, both sides — usable quotes","detail":"KLOBUCHAR FOR TABLING (transcript tonight): she framed the ask as giving the body four more weeks to work toward legislation that supports a thriving hemp industry, ensures proper regulation, and protects kids from dangerous products. Her key mechanical point, which matches this tracker’s reading: the CR delays a ban on NATURALLY PRODUCED hemp products for four weeks WHILE TAKING SYNTHETIC HEMP DERIVATIVES OFF THE MARKET. She noted Minnesota’s safety rules have worked, the product is taxed, and the state has not had issues since those rules went in. MINNESOTA FIGURE: hemp products brought in $16 MILLION in state tax revenue in 2025. Her process argument: the original ban was tucked into a bill to reopen the government last November, many members did not have the chance to learn about it, there had been no hearings, and it moved without input from those affected. She also said she agrees with Budd’s concerns about bad actors. BUDD AGAINST (Aug 5 floor, via CBT): ‘This is a public health crisis that deserves this Senate’s immediate attention. Our children should never be the testing ground for an industry willing to exploit a loophole in federal law for profit.’ He argued that if substances cause intoxication like marijuana they should be regulated as such rather than given a free pass as hemp. NACS confirms the mechanism independently: the delay applies only to naturally occurring products, and synthetics including many sourced from overseas still come off the market Nov 12.","status":"OPEN","sources":[{"label":"Floor transcript (user-supplied, ASR)","url":""},{"label":"Cannabis Business Times — Budd floor remarks","url":"https://www.cannabisbusinesstimes.com/hemp/news/15831841/us-senators-aim-to-keep-hemp-thc-product-ban-on-schedule-despite-white-house-pressure"},{"label":"NACS — mechanism confirmation","url":"https://www.convenience.org/stay-current/news/2026/august/7/urgent-the-senate-could-vote-today-on-hemp-amendment"}]},
      {"date":"2026-08-07","title":"Budd’s closing floor argument tonight — the strongest version of the anti-delay case","detail":"From tonight’s floor transcript, immediately before the tabling vote. His frame is REAFFIRMATION, not new policy: nine months ago both parties overwhelmingly voted to close the hemp loophole, and he is asking colleagues simply to reaffirm that decision. Per his own press office, the number was 76 MEMBERS — which squares with this tracker’s note that Rand Paul’s amendment to strike the ban language failed 76-24 last November. ⚠ STATISTIC REQUIRING VERIFICATION: Budd claimed emergency departments have seen a 461% INCREASE in cases of pediatric cannabis poisoning, most involving children four years old or younger. He cited no study on the floor. Do NOT repeat this figure on air without locating the underlying source — the magnitude, the baseline year, and whether it covers hemp-derived products specifically versus all cannabis are all unstated. It is the emotional core of his argument and therefore the number most likely to be quoted back at you. HIS REBUTTAL TO THE MEDICARE ARGUMENT, which connects directly to the White House rationale tracked above: opponents say the delay protects research into hemp-derived products for seniors, veterans, and people with disabilities on Medicare. Budd’s response: what does allowing unregulated intoxicating edibles on gas station shelves have to do with CMS’s ability to study hemp-derived products for pain relief? Not a thing. That is a direct hit on the administration’s stated medicinal-framework rationale, and it is the sharpest exchange of the fight so far.","status":"OPEN","sources":[{"label":"Floor transcript (user-supplied, ASR)","url":""},{"label":"Budd press release — 76 members","url":"https://www.budd.senate.gov/2026/08/05/icymi-budd-calls-on-colleagues-to-permanently-stop-dangerous-hemp-loophole-targeting-american-children/"}],"isToday":true},
      {"date":"2026-08-07","title":"⚠⚠ BOTH SIDES NOW SEE DEC 11 AS THE REAL FIGHT — and Budd says so out loud","detail":"THE MOST ANALYTICALLY IMPORTANT THING BUDD SAID TONIGHT, and it independently confirms this tracker’s Dec 11 leverage analysis from the opposite direction. Asked what the harm is in a month-long delay, he answered that the goal is not an extra month to work on policy — the hemp lobby has already had nine months for that — but rather, in his words, to JAM US IN DECEMBER ON A MUST-PASS PACKAGE and permanently entrench intoxicating products into the machinery of government. Set that beside Jonathan Miller of the U.S. Hemp Roundtable, who said the industry will pursue a comprehensive fix when Congress reaches the next funding deadline in December. THE TWO SIDES AGREE ON THE MECHANICS AND DISAGREE ONLY ABOUT WHETHER IT IS LEGITIMATE. Both understand that a Dec 11 expiry landing on the same day as a government funding cliff converts hemp into must-pass leverage. For the podcast, this is the cleanest possible framing: the four weeks are not really about four weeks of policy work — they are about who holds the hostage in December. Budd is voting against the delay precisely BECAUSE he understands the December dynamic, not despite it.","status":"OPEN","sources":[{"label":"Floor transcript (user-supplied, ASR)","url":""},{"label":"Marijuana Moment — Miller on December","url":"https://www.marijuanamoment.net/senate-gives-hemp-thc-products-a-lifeline-by-including-provisions-to-delay-planned-federal-ban-in-new-spending-bill/"}],"isToday":true},
      {"date":"2026-08-06","title":"VANCE deployed to settle it — and Budd has picked up DEMOCRATIC cosponsors","detail":"Escalation on both ends. Per The Hill, VICE PRESIDENT JD VANCE met with Senate Republicans at the Capitol on Thursday to discuss moving the GOP agenda, which had stalled in part over this fight. Sending the VP to the Hill over a one-month hemp provision is a measure of how much the White House wants it. Meanwhile Budd told reporters he is working a deal with Thune to get a vote and said: ‘Working on it, working on it. We’ve now got Dem co-sponsorships on the amendment.’ THAT MATTERS FOR VOTE COUNTING — the opposition to the extension is no longer purely a Republican family argument, which makes the tabling motion harder for Klobuchar than a party-line count would suggest. Note the cross-cutting alignment: the White House, Cruz, Klobuchar, Paul-as-bill-author and the hemp industry favor the delay; Budd, Cotton, Ricketts, 34 state AGs and some Democrats oppose it. This does not map onto party at all.","status":"OPEN","sources":[{"label":"The Hill — Vance meeting, Budd on Dem cosponsors","url":"https://thehill.com/homenews/senate/6014671-vance-gop-hemp-thc-ban-funding-bill/"}]},
      {"date":"2026-08-07","title":"Industry counter-mobilization — ~100 orgs, and a rebuttal worth knowing","detail":"Per the U.S. Hemp Roundtable, nearly 100 organizations urged the Senate to preserve the delay, and USHR issued a new CBD FACT SHEET specifically to rebut the argument that consumers would retain access to non-intoxicating CBD if the extension is stripped. Their claim: the 0.4mg total THC per container standard would eliminate many of today’s most widely used hemp-derived CBD products, because trace THC is not economically removable at scale. NACS makes the parallel argument that prohibiting products over 0.4mg per container bans many non-intoxicating low-dose products used therapeutically, and warns that eliminating legal products without a licensing framework pushes consumers toward an unregulated market that is less safe and potentially MORE accessible to children — inverting Budd’s child-safety argument rather than denying the premise. TREAT AS ADVOCACY: USHR and NACS are interested parties. But the underlying technical claim about trace THC in CBD products is the same one this tracker recorded from independent sources, so it is not merely spin.","status":"OPEN","sources":[{"label":"U.S. Hemp Roundtable — ~100 orgs + CBD fact sheet","url":"https://hempsupporter.com/news/nearly-100-organizations-urge-senate-to-preserve-hemp-ban-delay-new-fact-sheet-rebuts-cbd-access-claims/"},{"label":"NACS","url":"https://www.convenience.org/stay-current/news/2026/august/7/urgent-the-senate-could-vote-today-on-hemp-amendment"}]},
      {"date":"2026-08-08","title":"✅ FINAL — Budd amendment TABLED 61-32, and Collins substitute #6732 AGREED TO","detail":"OFFICIAL FROM THE CHAIR, per floor transcript: ‘On this vote, the yeas are sixty-one, the nays are thirty-two, and the motion is agreed to.’ FINAL TALLY IS 61-32, not the 61-31 shown on the live feed mid-vote — one additional nay was recorded before the vote closed. Use 61-32. 93 of 100 members recorded. THE BUDD AMENDMENT IS DEAD and Sec. 2019 survives. ✅ SECOND AND EQUALLY IMPORTANT STEP IN THE SAME SEQUENCE: the chair then stated that under the previous order, AMENDMENT 6732 IS AGREED TO — that is the Collins substitute, which is where the entire CR text and Sec. 2019 actually live. The substitute is now incorporated into H.R. 6500. Sec. 2019 is no longer a proposal riding alongside the bill; it IS the bill text. The clerk was then directed to read the title a third time — THIRD READING IS THE STEP IMMEDIATELY BEFORE FINAL PASSAGE, so a Senate passage vote follows directly. The read title also confirms the shell-vehicle entry in this tracker verbatim: Calendar number 320, H.R. 6500, an act to extend duty-free treatment provided with respect to imports from certain countries in Africa and for other purposes.","status":"RESOLVED","sources":[{"label":"Senate floor transcript (user-supplied) + live feed capture","url":""}],"isToday":true},
      {"date":"2026-08-08","title":"Scorecard on this tracker’s own calls — one wrong, one right","detail":"Logged deliberately, since forecasting accuracy matters more than looking consistent. ON AUG 7 MORNING this tracker assessed Sec. 2019 as ‘MORE LIKELY THAN NOT TO BE STRIPPED,’ based on the germaneness ruling, nine cosponsors, and the Daily Caller read. THAT CALL WAS WRONG — the tabling motion carried comfortably, not close. ON AUG 7 EVENING, after Klobuchar moved to table, this tracker revised to ‘UNCERTAIN rather than leaning either way’ and specifically noted that tabling favors the extension because it lets senators kill the amendment procedurally without a recorded merits vote on hemp. THAT REASONING HELD UP. THE LESSON FOR FUTURE READS: cosponsor counts and germaneness rulings measure how easy it is to GET a vote, not how the vote will GO. Nine cosponsors on an amendment told us almost nothing about the other ninety-one senators. And when leadership reaches for a motion to table rather than letting an up-or-down vote happen, that is itself evidence they have counted and are protecting members from a recorded position.","status":"OPEN","sources":[],"isToday":true},
      {"date":"2026-08-08","title":"✅✅ SENATE PASSED THE CR, 90-6 — Sec. 2019 intact, bill goes to the House","detail":"Passed in a pre-dawn vote shortly before 4-5 a.m. Saturday Aug 8 (sources vary on the exact hour), as the Senate’s LAST ORDER OF BUSINESS before adjourning for a five-week August recess. Funds government through Dec 11, extending the deadline from Oct 1. THE SIX NAYS, per the American Subcontractors Association: Cassidy (R-LA), Kaine (D-VA), Markey (D-MA), PAUL (R-KY), Sanders (I-VT), Warren (D-MA). Rand Paul voting no again is notable given he COSPONSORED the Hemp Planting Predictability Act that Sec. 2019 is based on — still no public explanation located; this is now the third recorded Paul vote against a vehicle carrying hemp relief he helped author. TABLING VOTE CONFIRMED at 61-32 by the Senate Cloakroom account directly: ‘Agreed to, 61-32: Klobuchar motion to table Budd amendment #6747 to Cal. #320, H.R.6500.’ That is now primary-sourced, not just a floor transcript. KLOBUCHAR AFTER THE VOTE: a federal hemp ban would wipe out thousands of Minnesota jobs; her farmers and small businesses already follow strong safety rules; a one-size-fits-all federal ban ignores that. She added that this buys time and she is not done fighting.","status":"RESOLVED","sources":[{"label":"Roll Call","url":"https://rollcall.com/2026/08/08/funding-patch-passes-senate-to-head-off-fall-shutdown/"},{"label":"Cannabis Business Times","url":"https://www.cannabisbusinesstimes.com/hemp/news/15832009/senate-votes-to-delay-intoxicating-hemp-thc-product-ban-keep-delta8-thc-on-shelves-longer"},{"label":"ASA — the six nays","url":"https://www.asaonline.com/2026/08/12/senate-passes-continuing-resolution-setting-up-house-senate-negotiations/"},{"label":"Agri-Pulse — Klobuchar quote","url":"https://www.agri-pulse.com/articles/25097-senate-passes-bill-to-avert-shutdown-delay-hemp-ban-as-midterms-loom"}]},
      {"date":"2026-08-08","title":"⚠⚠ UNRESOLVED CONFLICT — does delta-8 actually get the reprieve? Sources disagree.","detail":"DO NOT STATE THIS CONFIDENTLY EITHER WAY ON AIR. Two credible sources describe the practical effect of Sec. 2019 differently, and the difference is enormous for retailers. CANNABIS BUSINESS TIMES says products containing cannabinoids CAPABLE of being naturally produced by the hemp plant — explicitly including delta-8, delta-10 and THCP — would remain on shelves until at least Dec 11. BREWERS ASSOCIATION says the opposite for the main commercial category: through Dec 11 the Section 781 amendments apply only to products containing cannabinoids that CANNOT be naturally produced by the plant, and in their reading the exclusion for non-naturally-occurring cannabinoids — SUCH AS DELTA-8 THC MADE FROM CBD — would STILL take effect in November. THE FAULT LINE IS THE SAME ONE RUNNING THROUGH THE ENTIRE TEXAS FIGHT: does the statute turn on whether a molecule CAN occur naturally in the plant, or on whether THIS PARTICULAR PRODUCT was naturally produced rather than converted from CBD? Nearly all commercial delta-8 is converted from CBD. Under CBT’s reading it survives to Dec 11; under the Brewers Association reading it does not. This is the federal mirror image of the Texas trace-versus-converted distinction DSHS drew for July 31, and it is the same ambiguity the Monti vagueness claim attacks. RESOLUTION REQUIRES the actual Sec. 2019 text read against § 297A paragraphs (1)(C)(ii)(I) and (1)(C)(iv)(I) — which this tracker has quoted but not parsed against the underlying subparagraphs. Flagging as genuinely open.","status":"OPEN","sources":[{"label":"Cannabis Business Times — delta-8 stays","url":"https://www.cannabisbusinesstimes.com/hemp/news/15832009/senate-votes-to-delay-intoxicating-hemp-thc-product-ban-keep-delta8-thc-on-shelves-longer"},{"label":"Brewers Association — delta-8 from CBD still banned Nov","url":"https://www.brewersassociation.org/government-affairs-updates/hemp-on-the-hill-congress-buys-more-time/"}],"isToday":true},
      {"date":"2026-08-14","title":"⚠ CORRECTIONS — Budd’s cosponsors, the House date, and when the House CR passed","detail":"THREE FIXES TO EARLIER ENTRIES. (1) BUDD’S COSPONSOR LIST WAS FAR LONGER THAN THE ‘NINE’ THIS TRACKER RECORDED. Marijuana Moment lists Ricketts (R-NE), Lankford (R-OK), Grassley (R-IA), Rounds (R-SD), McCONNELL (R-KY), JOHN CORNYN (R-TX), Cassidy (R-LA), Cotton (R-AR) and Ernst (R-IA) among others. TWO NAMES MATTER SPECIALLY: McConnell, who as former majority leader was blamed for blocking SAFE Banking for years, and CORNYN — a TEXAS senator — who was cosponsoring the effort to KILL the delay while Ted Cruz publicly BACKED it. Texas’s two senators were on opposite sides. That is a real Texas story this tracker missed. (2) HOUSE RETURN DATE: earlier entries said Aug 31. Roll Call and Dallas Express both say the House is out until THE FIRST WEEK OF SEPTEMBER. Use early September. (3) WHEN THE HOUSE PASSED ITS CR: this tracker recorded July 20 from Cannabis Business Times; Marijuana Moment says JUNE. Unresolved — do not cite a specific date for the House CR without checking. What is NOT in dispute: the House version contains no hemp language, runs to a different date, and passed with Republican votes only, while the Senate version is bipartisan.","status":"OPEN","sources":[{"label":"Marijuana Moment — cosponsor list","url":"https://www.marijuanamoment.net/senate-rejects-amendment-to-keep-hemp-thc-product-ban-on-track-for-november-teeing-up-delay-trump-pushed-for/"},{"label":"Roll Call — House back first week of September","url":"https://rollcall.com/2026/08/08/funding-patch-passes-senate-to-head-off-fall-shutdown/"}],"isToday":true},
      {"date":"2026-09-01","title":"✅ RESOLVED — House took the Senate bill rather than forcing a conference","detail":"RESOLVED SEP 1: the House passed H.R. 6500 by 370-48 with Sec. 2019 intact, taking the Senate package rather than forcing a conference — the central risk this entry flagged did not materialize. Original analysis retained: the House returns the first week of September and must reconcile its version with the Senate’s. Dallas Express expects a final decision EARLY TO MID-SEPTEMBER, before the Sept 30 funding deadline, once the House acts and the measure reaches Trump for signature. UNTIL THAT HAPPENS THE NOV 12 DATE REMAINS FULLY IN FORCE — nothing has changed for any operator today. WHAT TO WATCH: whether House leadership takes up the Senate bill as-is or forces a conference. Budd’s cosponsor list included McConnell and Cornyn, so the opposition has institutional weight, and House Republicans passed their own version without hemp language on party-line votes. The Senate’s 90-6 margin gives the package momentum, but the hemp provision specifically was added at White House request and survived only a 61-32 tabling vote — a 29-vote margin on hemp inside a 84-vote margin on funding. Those are separable, and the House is where they may separate.","status":"OPEN","sources":[{"label":"Dallas Express — early-to-mid September expectation","url":"https://dallasexpress.com/national/proposed-hemp-ban-delay-survives-senate-votes-90-6-to-push-restrictions-back-one-month/"}]},
      {"date":"2026-09-xx","title":"UPCOMING — Senate Ag appropriations action (FY27)","detail":"Senate companion process is the next realistic vehicle for a hemp fix (Barr framework, delay, or non-enforcement rider) if a standalone bill doesn't move first. Confirm exact Senate committee markup/floor date on next check — not yet scheduled as of this update.","status":"OPEN","sources":[]},
      {"date":"2026-09-30","title":"⚠ SUPERSEDED — the FY-end appropriations moment arrived EARLY, as the Aug 2 CR","detail":"UPDATED Aug 3: this entry's core prediction was correct but its timing was wrong — it argued the September fiscal-year-end appropriations moment would be the natural vehicle for a hemp rider. That vehicle materialized, but on Aug 2 rather than late September, as the FY27 stopgap CR carrying Sec. 2019. Congress moved before the recess rather than after it. If the CR passes, the Sept 30 fiscal deadline is absorbed by the stopgap and the NEXT funding cliff becomes Dec 11, 2026 — which is also the date Sec. 2019's hemp relief expires. ORIGINAL ANALYSIS, retained because the underlying logic still governs what happens next: The operative constraint is the congressional calendar, not the November 12 date. An extension must PASS before Nov 12 to matter, and the working days between now and then are scarce: August is recess; September is effectively the only full working month and terminates at the September 30 fiscal-year deadline, which is the natural vehicle for an appropriations rider; then October into early November is consumed by the November 3 midterms, with members campaigning rather than legislating. The deadline itself falls just nine days after the election. If the September appropriations moment passes without a hemp fix, the next natural legislative vehicle is a year-end package — which lands AFTER the cliff. This is the arithmetic behind Sen. Cruz's 'uphill path' assessment and Vicente's judgment that standalone bills face 'an uphill climb in a divided and distracted Congress.' Status check: per Forbes (Jul 20), delay legislation remains stalled at the COMMITTEE stage — neither chamber's version has advanced past referral. Practical read for the podcast: watch September appropriations, not November.","status":"OPEN","sources":[{"label":"Forbes — delay bills stalled","url":"https://www.forbes.com/sites/noelburgess/2026/07/20/thc-drinks-federal-hemp-deadline-2026/"},{"label":"Vicente LLP","url":"https://vicentellp.com/insights/2026-federal-hemp-ban-what-it-means-for-the-future-of-consumable-hemp-products/"}]},
      {"date":"2026-12-11","title":"⚠⚠ THE NEW CLIFF — CR through both chambers; Dec 11 is now the operative date","detail":"NO LONGER CONDITIONAL \u2014 the CR passed the House 370-48 on Sep 1 and awaits signature. Two things expire simultaneously on Dec 11, 2026. (1) The hemp narrowing lapses — the full Section 781 regime, including the total-THC standard and the 0.4mg-per-container cap, snaps back into force against the entire market rather than just synthetic analogs. (2) Government funding under the CR runs out. Those being the SAME DATE is the structural fact worth building a segment around: hemp relief becomes a bargaining chip in the next shutdown fight, and the industry’s 29-day reprieve converts directly into leverage for whoever is negotiating that package. The practical read is that Congress has bought itself four weeks of quiet and moved the hemp question from a standalone fight into an appropriations hostage position. Watch whether the Barr/Craig framework, the Baird 2-year delay, or something new gets attached to the December package — that negotiation, not November 12, is now where the market’s fate is likely decided.","status":"OPEN","sources":[{"label":"Nothing But Canna","url":"https://www.nothingbutcanna.net/blogs/news/senate-funding-bill-includes-temporary-extension-for-hemp"}]},
      {"date":"2026-11-12","title":"⚠ THE DEADLINE — 2 DAYS OUT as of Nov 10","detail":"⚠ READ WITH THE CR ENTRIES ABOVE: if Sec. 2019 of the Aug 2 stopgap is enacted, Section 781 STILL takes effect on this date — the CR does not move it — but between Nov 12 and Dec 11 it would reach only non-naturally-occurring cannabinoids (HHC, HHC-O, THC-O acetate and similar synthetics). The total-THC standard and 0.4mg cap described below would go dormant for those 29 days and return Dec 11. Everything below describes the FULL regime as enacted, which is what governs absent the CR and what returns on Dec 11 regardless. Section 781 of P.L. 119-37 takes effect absent Congressional action. DATE PRECISION: use November 12, not November 13. Reason.org published the 13th, but Vicente resolves it cleanly — the law was signed November 12, 2025 with a one-year delayed implementation, so November 12, 2026. WHAT ACTUALLY CHANGES: two separate restrictions land together. (1) The federal hemp definition shifts to a TOTAL THC standard — 0.3% total THC dry weight, inclusive of THCA and delta-8 — replacing the delta-9-only standard from the 2018 Farm Bill. (2) Final-form hemp-derived cannabinoid products are separately capped at 0.4mg total THC PER CONTAINER. Products falling outside the new definition become subject to the federal CSA as marijuana, per the Congressional Research Service. SCALE: U.S. Hemp Roundtable estimates ~95% of existing hemp cannabinoid products would be eliminated, and says more than 90% of NON-intoxicating hemp products already exceed the 0.4mg cap because trace THC is not economically removable. Commonly cited industry figures: $28.4B sector, ~300,000 jobs, ~$1.5B annual state tax revenue; 65-75% of U.S. hemp is grown for cannabinoid extraction. NOT AFFECTED: industrial hemp — fiber, textiles, seed, building materials. ALSO ON THIS CLOCK: USDA must overhaul its Domestic Hemp Production Program before this date to align with the total-THC standard, and law-enforcement and public-health groups that pushed the change expect aggressive implementation.","status":"OPEN","sources":[{"label":"Vicente LLP — ban explainer","url":"https://vicentellp.com/insights/2026-federal-hemp-ban-what-it-means-for-the-future-of-consumable-hemp-products/"},{"label":"Forbes — THC drinks deadline","url":"https://www.forbes.com/sites/noelburgess/2026/07/20/thc-drinks-federal-hemp-deadline-2026/"},{"label":"Legis1 — USDA program overhaul","url":"https://legis1.com/news/hemp-rules-congress-rewrites-industry-faces"}]},
      {"date":"2026-07-22","title":"Standalone Lawful Hemp Protection Act introduced — Barr (R-KY) + Craig (D-MN); 'White House-backed' claim is DISPUTED (see next entry)","detail":"Correction to earlier tracking: introduced July 22, not July 23 (a Marijuana Moment article covering it published the next day). Repeals the Section 781 hemp-ban language enacted in the FY2026 ag appropriations law and replaces it with a federal regulatory framework. Redefines hemp as up to 1% total THC — explicitly INCLUDING THCA — on a dry-weight basis (vs. today's 0.3% delta-9-only standard, and vs. the Nov. 12 cliff to 0.4mg total THC per container). Creates a 3-tier alcohol-style system for hemp beverages (manufacturer/wholesaler/retailer, strict tied-house separation, no cross-tier ownership), age-21 purchase limit with marketing-to-children ban, TTB permitting/registration for manufacturers, prohibits synthetic/artificially-modified cannabinoids. Requires all hemp in interstate commerce to be grown, processed, and packaged in the U.S. Tax: 5¢/mg THC on beverages, 5% of retail price on other consumables, 5% on manufacturer sales revenue. Directs FDA to set per-cannabinoid maximum serving limits by rulemaking within 12 months; if FDA misses that deadline, fallback defaults kick in automatically: 5mg total THC per serving for oral products, 50mg per serving for inhalable products, 50mg per serving for topical products. Includes an explicit non-preemption clause: states/territories/tribes remain free to pass MORE stringent HDCP laws, but the bill also bars states from blocking the interstate transport of federally compliant products through their territory.","status":"FILED","sources":[{"label":"Marijuana Moment","url":"https://www.marijuanamoment.net/major-alcohol-industry-lobby-backs-bill-to-keep-hemp-thc-drinks-legal-but-it-wants-more-discussion-on-tax-rate/"},{"label":"Barr House press release","url":"https://barr.house.gov/2026/7/barr-introduces-lawful-hemp-protection-act-to-protect-kentucky-farmers-consumers-and-the-future-of-the-hemp-industry"},{"label":"U.S. Hemp Roundtable","url":"https://hempsupporter.com/news/andy-barr-and-angie-craig-introduce-bipartisan-bill-to-repeal-hemp-ban-and-protect-hemp-products/"},{"label":"Cannabis Law Report — THCA flower critique","url":"https://cannabislaw.report/the-lawful-hemp-protection-act-is-a-lifeline-but-it-leaves-thca-flower-behind/"}]},
      {"date":"2026-07-23","title":"CORRECTION: 'White House-backed' claim is disputed by the administration itself","detail":"Barr's own press release headline says the bill is 'Backed by the White House' — but when Marijuana Moment asked directly, a White House official declined to confirm, replying only that the administration's 'only definitive positions... are in President Trump's December EO and April Truth post' — not an endorsement of this specific bill. Two sources familiar with negotiations say the White House specifically objects to the bill's treatment of INHALABLE hemp products within the legal definition. Barr's office, when pressed, pointed only to a general OMB letter and an April technical-assistance letter — neither of which endorses this specific 60-page bill. Treat 'White House-backed' as a contested characterization by the bill's sponsor, not a confirmed administration position, for podcast accuracy.","status":"OPEN","sources":[{"label":"Marijuana Moment — WH dispute","url":"https://www.marijuanamoment.net/gop-lawmaker-claims-white-house-backs-his-hemp-bill-but-administration-has-problems-with-inhalable-product-provisions-sources-say/"}]},
      {"date":"2026-07-25","title":"Untangling the crowded field: at least 7 distinct hemp bills now in play — do not conflate them","detail":"For podcast accuracy, these are SEPARATE bills, several sharing sponsors (esp. Klobuchar), which makes them easy to conflate: (1) H.R. 6209 'American Hemp Protection Act' (Mace, Nov. 2025) — clean repeal of Section 781, no regulatory framework. (2) H.R. 7024 'Hemp Planting Predictability Act' + Senate companion S. 3686 (Baird/Comer/Craig; Klobuchar/Paul/Merkley, Jan. 2026) — 2-year delay only, pushes effective date to Nov. 2028. UPDATED Jul 31: now at 38 House cosponsors (gained one on Jul 27) — earlier tracker versions cited 15, which came from a stale Jan/Feb source. ⚠ UPDATED Aug 7 — THIS BILL IS NO LONGER JUST A COMPETING OPTION: per Klobuchar's own press release, the CR's Sec. 2019 hemp provision is BASED ON this bill, negotiated with strong support from Sen. Sheehy (R-MT). So the Hemp Planting Predictability Act is now the textual parent of the live CR provision, not a separate alternative to it. Do not describe them as rival approaches. This is the quiet-momentum bill: it has more than double the cosponsors of anything else in the field, which matters because 'extension' is the stated preference of much of the industry over any framework bill. Caveat: per Forbes (Jul 20), neither the House nor Senate delay measure had advanced beyond committee referral. (3) H.R. 7212 'HEMP Act' (Griffith/Veasey, Jan. 22, 2026) — FDA regulatory framework with reported FDA drafting input; Griffith himself has said it likely won't move until after the 2026 election. (4) S. 4315 'Hemp Safety Enforcement Act' (Paul/Klobuchar/Ernst, Apr. 16, 2026) — DIFFERENT bill from the Sheehy-Klobuchar companion below despite shared sponsor; creates a state/tribal opt-out mechanism rather than a new federal framework. (5) S. 3474 'Cannabinoid Safety and Regulation Act' (Wyden, reintroduced Dec.) — manufacturing/testing/labeling framework, national age-21 minimum. (6) The new standalone 'Lawful Hemp Protection Act' (Barr/Craig, July 22, 2026) — the most comprehensive framework, broadest coalition, this track's main focus. (7) An UNFILED Senate companion to Barr-Craig, expected from Sheehy/Klobuchar — Sheehy has said only 'relatively soon,' not confirmed for any specific week; may include a different tax structure than the House bill's 5¢/mg + 5% structure.","status":"OPEN","sources":[{"label":"CRS — Changes to Statutory Definition of Hemp","url":"https://www.congress.gov/crs-product/IF13136"},{"label":"Nothing But Canna — Sheehy profile","url":"https://www.nothingbutcanna.net/blogs/news/a-gop-senator-says-hemp-can-unite-congress-and-hes-bringing-a-bill-to-prove-it"},{"label":"The Hill","url":"https://thehill.com/homenews/house/5981591-craig-barr-hemp-bill/"},{"label":"Congress.gov — H.R. 7024 cosponsors","url":"https://www.congress.gov/bill/119th-congress/house-bill/7024/cosponsors"},{"label":"Forbes — delay bills stalled","url":"https://www.forbes.com/sites/noelburgess/2026/07/20/thc-drinks-federal-hemp-deadline-2026/"}],"isToday":true},
      {"date":"2026-07-25","title":"Senate companion to Barr-Craig: still unfiled, timing unconfirmed","detail":"Correction to earlier tracking: the Sheehy/Klobuchar companion to the Barr-Craig House bill has NOT been filed as of this check — Sheehy has said only that it's coming 'relatively soon,' not a specific week. Do not report it as filed or imminent-by-date. Separately, adjacent context: a CMS Medicare hemp-coverage pilot (up to $500/year for eligible patients, up to 3mg total THC per serving, focused on CBD) launched in April is being challenged in court by anti-marijuana groups and a pharma company after an initial dismissal — appeal ongoing.","status":"OPEN","sources":[{"label":"Nothing But Canna — Sheehy profile","url":"https://www.nothingbutcanna.net/blogs/news/a-gop-senator-says-hemp-can-unite-congress-and-hes-bringing-a-bill-to-prove-it"},{"label":"Marijuana Moment — WH dispute","url":"https://www.marijuanamoment.net/gop-lawmaker-claims-white-house-backs-his-hemp-bill-but-administration-has-problems-with-inhalable-product-provisions-sources-say/"}],"isToday":true},
      {"date":"2026-07-23","title":"Key critique: bill's total-THC/THCA definition would eliminate the THCA flower market","detail":"Cannabis attorney analysis (Kight on Cannabis / Cannabis Law Report) flags that raising the threshold to 1% sounds generous but isn't, because it's TOTAL THC including THCA, not delta-9-only. Since THCA converts to delta-9 when heated, commercial THCA flower routinely runs many times above 1% total THC — meaning this bill would eliminate one of the hemp industry's largest and most economically significant product categories even as it 'saves' hemp broadly. This is a meaningful nuance the '1% is more generous than 0.3%' framing can obscure.","status":"OPEN","sources":[{"label":"Cannabis Law Report","url":"https://cannabislaw.report/the-lawful-hemp-protection-act-is-a-lifeline-but-it-leaves-thca-flower-behind/"}]},
      {"date":"2026-07-23","title":"WSWA (alcohol wholesalers' lobby) endorses regulatory framework, wants tax rate renegotiated","detail":"Wine & Spirits Wholesalers of America publicly backs the bill's 3-tier structure as modeled on alcohol's 90-year-old system, but explicitly withholds endorsement of the tax rate, seeking 'continued discussion' toward 'parity with beverage alcohol.' Bill's broader support coalition per Barr's office: American Healthy Alternatives Association, American Herbal Products Association, Americans for Prosperity, Coalition for Adult Beverage Alternatives, Hemp Beverage Alliance, HIFA, Kentucky Hemp Association, Midwest Hemp Council, Team Hemp, Total Wine & More, U.S. Hemp Roundtable, and WSWA itself. Separately, a newly formed group — Beverage Alcohol Merchants Coalition (BAMCO), founding members Total Wine & More, BevMo!/Gopuff, ABC Fine Wine & Spirits, Spec's — is pushing for a delay rather than this specific bill. National Restaurant Association has also sent a letter pushing for delay. Sen. Ted Cruz (R-TX) — notable given your TX focus — has separately called the odds of averting the ban this year an 'uphill path.'","status":"OPEN","sources":[{"label":"Marijuana Moment","url":"https://www.marijuanamoment.net/major-alcohol-industry-lobby-backs-bill-to-keep-hemp-thc-drinks-legal-but-it-wants-more-discussion-on-tax-rate/"}]},
      {"date": "2026-09-01", "title": "\u2705\u2705 HOUSE PASSES H.R. 6500, 370-48 \u2014 hemp provision intact, goes to Trump", "detail": "The House passed the Continuing Appropriations and Extensions Act, 2027 on Tuesday Sept 1 by 370-48, with Sec. 2019 INTACT. The Senate had already passed it 90-6 on Aug 8. It now heads to the President, with signature expected quickly. THE MARGIN IS THE STORY: 370-48 is overwhelming, and it comes from the same chamber whose Rules Committee blocked all four hemp amendments from floor votes on June 2 and which passed its own CR with no hemp language at all. House leadership took the Senate package rather than forcing a conference \u2014 which was the single biggest open risk this tracker had flagged for Sec. 2019. That risk is now closed. SEQUENCE COMPLETE: Senate cloture 89-4 (Aug 3) \u2192 Budd strip amendment tabled 61-32 (Aug 7) \u2192 Collins substitute #6732 adopted \u2192 Senate passage 90-6 (Aug 8) \u2192 House passage 370-48 (Sep 1) \u2192 presidential signature pending. Nothing is law until signed.", "status": "RESOLVED", "sources": [{"label": "User-supplied, verified against multiple outlets", "url": ""}], "isToday": true},
      {"date": "2026-09-01", "title": "\u26a0\u26a0 PRECISION FLAG \u2014 'moves the effective date to Dec 11' vs. what Sec. 2019 actually says", "detail": "THIS IS THE MOST IMPORTANT THING TO GET RIGHT ON AIR, and it is the same dispute as the synthetic-derivative question below \u2014 they are one issue, not two. THE COMMON SHORTHAND, including in reliable summaries, is that the CR 'moves the effective date of the new federal hemp restrictions from November 12 to December 11.' THE TEXT OF SEC. 2019 DOES NOT SAY THAT. It reads: 'Until December 11, 2026, the amendments made by section 781 \u2026 shall only apply with respect to products described in paragraphs (1)(C)(ii)(I) and (1)(C)(iv)(I) of section 297A \u2026' That is a SCOPE NARROWING, not a date change. Section 781 still takes effect Nov 12; between Nov 12 and Dec 11 it reaches only the narrow category, then reaches everything on Dec 11. WHY THE DISTINCTION IS NOT ACADEMIC: if the effective date truly moved, NOTHING is federally banned on Nov 12. If scope narrowed, the products in those two subparagraphs ARE banned starting Nov 12 and never get the reprieve. For most of the market the practical result is the same \u2014 a one-month delay. For whoever falls inside (1)(C)(ii)(I) and (1)(C)(iv)(I), the difference is total. SAFEST FORMULATION: 'the CR delays the bulk of the federal restrictions until December 11, though some narrow categories may still take effect November 12 \u2014 that scope question is contested.'", "status": "OPEN", "sources": [{"label": "Sec. 2019 text (in Source Bank, PRIMARY)", "url": ""}], "isToday": true},
      {"date": "2026-09-01", "title": "\u26a0 CONTESTED \u2014 ATACH says synthetic conversions ARE protected; others say they are banned Nov 12", "detail": "NOW A THREE-WAY DISAGREEMENT, and this tracker has been carrying two sides of it since Aug 8. (1) CANNABIS BUSINESS TIMES: products with cannabinoids 'capable of being naturally produced' by the plant \u2014 delta-8, delta-10, THCP \u2014 stay on shelves to Dec 11. (2) BREWERS ASSOCIATION: the exclusion for non-naturally-occurring cannabinoids, 'such as delta-8 THC made from CBD,' still takes effect in November. (3) NEW \u2014 ATACH disputes reports that synthetic-derivative products are banned Nov 12, arguing the bill's language was written to protect SYNTHETIC CONVERSIONS of nonintoxicating cannabinoids into intoxicating ones, so long as the SOURCE MOLECULE occurs naturally. \u26a0 ATACH IS AN INDUSTRY TRADE ASSOCIATION \u2014 advocacy tier, not neutral analysis, and it is arguing for the reading most favorable to its members. But note their reading is textually plausible: the carve-out language turns on cannabinoids 'not capable of being naturally produced,' and delta-8 IS capable of natural production even when a given batch was converted from CBD. THAT IS THE EXACT SAME AMBIGUITY AS THE TEXAS TRACE-VERSUS-CONVERTED FIGHT \u2014 does the statute classify the MOLECULE or the PRODUCTION METHOD? Federal and state law are now converging on the same unresolved question. \u2705 RESOLVED NOV 10 \u2014 see the Nov 12 entry. THBC now states the split plainly on its own site, matching the Brewers Association and the Texas AG: most changes delayed to Dec 11, but cannabinoids that CANNOT be naturally produced lose hemp status NOV 12. Three sources from opposite sides agree. The CBT and ATACH readings were wrong.", "status": "OPEN", "sources": [{"label": "ATACH position (user-supplied, advocacy tier)", "url": ""}, {"label": "Cannabis Business Times", "url": "https://www.cannabisbusinesstimes.com/hemp/news/15832009/senate-votes-to-delay-intoxicating-hemp-thc-product-ban-keep-delta8-thc-on-shelves-longer"}, {"label": "Brewers Association", "url": "https://www.brewersassociation.org/government-affairs-updates/hemp-on-the-hill-congress-buys-more-time/"}], "isToday": true},
      {"date": "2026-12-11", "title": "\u26a0\u26a0 'NO MORE EXTENSIONS' \u2014 now corroborated from two directions", "detail": "A White House official reportedly told Senate Republicans BEFORE the vote that there would NOT be another extension after this one. THAT CORROBORATES WHAT THIS TRACKER ALREADY LOGGED FROM A DIFFERENT SOURCE: at the Aug 5 Senate GOP lunch, White House legislative liaison James Braid committed to NO FURTHER DELAYS beyond the one in the short-term funding measure, per Axios citing three sources familiar. Two independent reports, same commitment, made to the same audience. TREAT THE DECEMBER RELIEF AS THE LAST ONE UNLESS SOMETHING CHANGES. WHY THAT MATTERS FOR THE DEC 11 DYNAMIC: this tracker has flagged that hemp relief and government funding now expire on the SAME DAY, which converts hemp into must-pass leverage \u2014 and that Budd said the quiet part out loud on the Senate floor, that the point of the delay was 'to jam us in December on a must-pass package.' If the White House holds to no-more-extensions, the December fight is not about another 30 days; it is about whether a permanent framework passes or the full Section 781 regime lands. Both sides have now said so publicly.", "status": "OPEN", "sources": [{"label": "User-supplied", "url": ""}, {"label": "Axios \u2014 Braid commitment", "url": "https://www.axios.com/2026/08/05/trump-ted-budd-senate-republicans-hemp"}]}
    ,
      {"date": "2026-11-12", "title": "\u2b50\u2b50\u2b50 TWO DAYS OUT \u2014 and the Sec. 2019 scope question is SETTLED", "detail": "THE DISPUTE THIS TRACKER HAS CARRIED SINCE AUG 8 IS RESOLVED, and by the industry's own organization. THBC states it plainly on its own site: 'Congress delayed most changes to the federal hemp definition until DECEMBER 11, 2026. RESTRICTIONS ON CANNABINOIDS THAT CANNOT BE NATURALLY PRODUCED BY CANNABIS STILL TAKE EFFECT NOVEMBER 12.' THAT IS THE BREWERS ASSOCIATION READING AND THE TEXAS AG'S READING \u2014 both of which this tracker recorded \u2014 and it is AGAINST the Cannabis Business Times and ATACH readings that everything stays on shelves until Dec 11. Three independent sources from opposite sides of the fight now agree: the State's own reply brief at footnote 1, the Brewers Association, and THBC. TREAT IT AS SETTLED. \u2b50 SO THE SPLIT IS: NOV 12 \u2014 cannabinoids that CANNOT be naturally produced by the cannabis plant lose federal hemp status. That is converted and synthesized material, which is most commercial delta-8. DEC 11 \u2014 everything else, including the 0.3% total THC redefinition and the 0.4mg total THC per container cap on finished products. \u26a0 FOR TEXAS OPERATORS the Nov 12 date changes little in practice, because those same products have been Texas Schedule I since July 31. The Dec 11 date is the one that reaches products still legal in Texas today \u2014 beverages, gummies, and compliant delta-9.", "status": "OPEN", "sources": [{"label": "THBC \u2014 the split, stated plainly", "url": "https://texashempbusinesscouncil.com/"}, {"label": "State's Reply Brief n.1 (PRIMARY)", "url": "https://texashempbusinesscouncil.com/wp-content/uploads/2026/09/2026.09.17-States-Reply-Brief.pdf"}], "isToday": true},
      {"date": "2026-12-11", "title": "\u26a0 31 DAYS \u2014 the full regime, and the CR expires the same day", "detail": "DEC 11, 2026 remains the doubled-up cliff this tracker flagged in August: the Sec. 2019 narrowing lapses AND the CR's government funding expires on the SAME DATE. Both sides said out loud in August that this was the real fight \u2014 Budd on the Senate floor saying the delay's purpose was 'to jam us in December on a must-pass package,' and the U.S. Hemp Roundtable saying it would pursue a comprehensive fix 'when we reach the next government funding deadline in December.' \u26a0 AND THE WHITE HOUSE SAID NO MORE EXTENSIONS \u2014 twice, from two independent reports: James Braid at the Aug 5 Senate GOP lunch, and a White House official to Senate Republicans before the Aug 7 vote. Unless that commitment softens, December is not about another 30 days; it is about whether a permanent framework passes or the full Section 781 regime lands. WHAT TO WATCH: whether a hemp provision attaches to the December funding package, and in what form. Which brings up the next entry.", "status": "OPEN", "sources": [{"label": "Axios \u2014 Braid commitment", "url": "https://www.axios.com/2026/08/05/trump-ted-budd-senate-republicans-hemp"}], "isToday": true},
      {"date": "2026-11-10", "title": "\u26a0 NEW AND UNVERIFIED \u2014 a 'beverage carve-out' bill that THBC says would kill the rest of the industry", "detail": "FLAGGING EARLY, WITH THE SOURCING CAVEAT UP FRONT. THBC has published a piece titled 'The Beverage Carve Out That Would Kill the Hemp Industry,' described as: 'A proposed bill would preserve a narrow market for hemp drinks while leaving the rest of the industry behind \u2014 and requiring the drinks that survive\u2026' The summary is truncated in what I retrieved and I have NOT read the piece or identified the bill. \u26a0 DO NOT REPORT A SPECIFIC BILL ON THIS BASIS. WHY IT IS PLAUSIBLE AND WORTH CHASING: it fits a pattern already documented in this tracker. The Barr/Craig Lawful Hemp Protection Act built a three-tier ALCOHOL-STYLE distribution system specifically for hemp BEVERAGES while leaving other categories to FDA serving limits. The Wine & Spirits Wholesalers of America endorsed that structure while withholding support on the tax rate. A retail alcohol coalition \u2014 Total Wine, BevMo, ABC Fine Wine, Spec's \u2014 organized around it. If the December vehicle narrows to beverages only, the alcohol distribution industry gets a regulated category it can handle and smokable, edible and topical operators get nothing. THAT IS THE SHAPE TO WATCH FOR in any December attachment. Read the THBC piece and identify the bill before airing any of this.", "status": "OPEN", "sources": [{"label": "THBC \u2014 headline only, piece not read", "url": "https://texashempbusinesscouncil.com/"}], "isToday": true}],
  },
