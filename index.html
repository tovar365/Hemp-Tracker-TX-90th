<!DOCTYPE html>

<title>Hemp Policy Tracker — Grassroots Resistance Collective</title>
<style>
  :root {
    --bg: #0F1B2D;
    --panel: #16243B;
    --panelAlt: #1C2E4A;
    --line: #2A3E5C;
    --ink: #E8E6DF;
    --inkMuted: #8FA0B8;
    --gold: #C9A227;
    --green: #7CA36B;
    --red: #C1553D;
    --amber: #D69A3C;
    --blue: #6E9BD6;
    --displayFont: Georgia, 'Iowan Old Style', serif;
    --monoFont: 'SFMono-Regular', Menlo, Consolas, monospace;
    --bodyFont: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); }
  body { font-family: var(--bodyFont); }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; }

  .wrap { max-width: 820px; margin: 0 auto; padding: 32px 20px; }

  .tabs { display: flex; gap: 8px; margin-bottom: 28px; border-bottom: 1px solid var(--line); }
  .tab-btn {
    font-family: var(--monoFont); font-size: 12px; font-weight: 600; letter-spacing: 0.08em;
    padding: 10px 18px; border: none; background: transparent; color: var(--inkMuted);
    border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .tab-btn.active { color: var(--gold); border-bottom-color: var(--gold); }

  .header { border-bottom: 1px solid var(--line); padding-bottom: 20px; margin-bottom: 24px; }
  .eyebrow { font-family: var(--monoFont); font-size: 11px; color: var(--gold); letter-spacing: 0.15em; margin-bottom: 6px; }
  .h1 { font-family: var(--displayFont); font-size: 30px; color: var(--ink); font-weight: 600; line-height: 1.15; }
  .subline { font-family: var(--monoFont); font-size: 12px; color: var(--inkMuted); margin-top: 6px; }
  .note { margin-top: 12px; font-size: 13px; color: var(--ink); line-height: 1.6; }

  .live-panel { border: 1px solid var(--line); border-radius: 6px; padding: 16px; background: var(--panelAlt); margin-bottom: 28px; }
  .live-panel-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .live-title { font-family: var(--displayFont); font-size: 16px; color: var(--ink); }
  .live-sub { font-family: var(--bodyFont); font-size: 12px; color: var(--inkMuted); margin-top: 2px; }
  .live-btn {
    font-family: var(--monoFont); font-size: 12px; font-weight: 600; letter-spacing: 0.05em;
    color: var(--bg); background: var(--gold); border: none; border-radius: 4px; padding: 9px 16px;
  }
  .live-btn:disabled { opacity: 0.6; cursor: default; }
  .live-result {
    margin-top: 12px; font-family: var(--bodyFont); font-size: 13px; line-height: 1.6; color: var(--ink);
    white-space: pre-wrap; border-top: 1px solid var(--line); padding-top: 12px;
  }
  .live-error { margin-top: 10px; font-family: var(--bodyFont); font-size: 12px; color: var(--red); line-height: 1.5; }

  .filter-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
  .filter-btn {
    font-family: var(--monoFont); font-size: 11px; font-weight: 600; letter-spacing: 0.06em;
    padding: 6px 12px; border-radius: 4px; border: 1px solid var(--line); background: transparent; color: var(--inkMuted);
  }
  .filter-btn.active { border-color: var(--gold); background: rgba(201,162,39,0.12); color: var(--gold); }

  .timeline { position: relative; padding-left: 24px; }
  .timeline::before { content: ""; position: absolute; left: 5px; top: 6px; bottom: 6px; width: 1px; background: var(--line); }
  .event { position: relative; margin-bottom: 22px; }
  .event-dot {
    position: absolute; left: -24px; top: 5px; width: 11px; height: 11px; border-radius: 50%;
    background: var(--bg); border: 2px solid var(--inkMuted);
  }
  .event-dot.today { background: var(--gold); }
  .event-card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px; }
  .event-card.today { background: var(--panelAlt); border-color: var(--gold); }
  .event-top { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: flex-start; }
  .event-date { font-family: var(--monoFont); font-size: 11px; color: var(--inkMuted); margin-bottom: 4px; }
  .event-title { font-family: var(--displayFont); font-size: 16.5px; color: var(--ink); font-weight: 600; }
  .event-detail { font-size: 13px; color: var(--ink); line-height: 1.6; margin-top: 8px; opacity: 0.92; }

  .stamp {
    display: inline-block; border: 2px solid var(--inkMuted); font-family: var(--monoFont); font-size: 11px;
    font-weight: 600; letter-spacing: 0.12em; padding: 3px 9px; border-radius: 3px; transform: rotate(-2deg);
    white-space: nowrap; flex-shrink: 0;
  }
  .stamp-ACTIVE { border-color: var(--green); color: var(--green); }
  .stamp-PENDING { border-color: var(--amber); color: var(--amber); }
  .stamp-STAYED, .stamp-BLOCKED { border-color: var(--red); color: var(--red); }
  .stamp-WITHDRAWN, .stamp-RESOLVED { border-color: var(--inkMuted); color: var(--inkMuted); }
  .stamp-FILED { border-color: var(--gold); color: var(--gold); }
  .stamp-OPEN { border-color: var(--blue); color: var(--blue); }

  .sources { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 10px; }
  .source-link { font-family: var(--monoFont); font-size: 11px; color: var(--gold); border-bottom: 1px dotted var(--gold); }
  .source-offline { font-family: var(--monoFont); font-size: 11px; color: var(--inkMuted); border-bottom: 1px dotted var(--line); cursor: default; }

  .senate-section { margin-top: 32px; margin-bottom: 8px; }
  .senate-card { background: var(--panel); border: 1px solid var(--amber); border-radius: 6px; padding: 16px 18px; }
  .correction-box {
    margin-top: 10px; padding: 10px 12px; background: rgba(193,85,61,0.1); border: 1px solid var(--red);
    border-radius: 4px; font-size: 12.5px; color: var(--ink); line-height: 1.6;
  }

  .track-section { margin-bottom: 32px; }
  .track-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; }
  .track-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .track-label { font-family: var(--displayFont); font-size: 19px; color: var(--ink); font-weight: 600; }
  .track-deadline { font-family: var(--monoFont); font-size: 11px; color: var(--inkMuted); margin-bottom: 14px; margin-left: 18px; }

  .sb-intro { font-size: 13px; color: var(--ink); line-height: 1.65; margin-bottom: 20px; opacity: 0.92; }
  .sb-card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px; margin-bottom: 14px; }
  .sb-top { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: flex-start; }
  .sb-cat { font-family: var(--monoFont); font-size: 10px; letter-spacing: 0.14em; color: var(--gold); margin-bottom: 5px; }
  .sb-cite { font-family: var(--displayFont); font-size: 16px; color: var(--ink); font-weight: 600; line-height: 1.3; }
  .sb-via { font-family: var(--monoFont); font-size: 11px; color: var(--inkMuted); margin-top: 4px; }
  .sb-badge { display: inline-block; font-family: var(--monoFont); font-size: 9.5px; font-weight: 600; letter-spacing: 0.1em;
    padding: 3px 8px; border-radius: 3px; white-space: nowrap; flex-shrink: 0; border: 1px solid; }
  .sb-PRIMARY { border-color: var(--green); color: var(--green); }
  .sb-SECONDARY { border-color: var(--amber); color: var(--amber); }
  .sb-UNREAD { border-color: var(--red); color: var(--red); }
  .sb-quote { margin-top: 10px; padding: 10px 12px; border-left: 3px solid var(--gold); background: rgba(201,162,39,0.06);
    font-family: Georgia, serif; font-size: 13.5px; line-height: 1.6; color: var(--ink); font-style: italic; }
  .sb-note { margin-top: 9px; font-size: 12.5px; line-height: 1.6; color: var(--ink); opacity: 0.9; }
  .ex-hero { border-left: 3px solid var(--gold); padding: 14px 16px; background: rgba(201,162,39,0.06); border-radius: 4px; margin-bottom: 22px; }
  .ex-hero-line { font-family: var(--displayFont); font-size: 17px; line-height: 1.5; color: var(--ink); }
  .ex-sec { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 15px 17px; margin-bottom: 13px; }
  .ex-h { font-family: var(--displayFont); font-size: 17px; font-weight: 600; color: var(--ink); margin-bottom: 9px; line-height: 1.3; }
  .ex-b { font-size: 13.5px; line-height: 1.68; color: var(--ink); opacity: 0.93; }
  .ex-b p { margin: 0 0 10px 0; }
  .ex-b p:last-child { margin-bottom: 0; }
  .ex-key { color: var(--gold); font-weight: 600; }
  .ex-flag { margin-top: 11px; padding: 9px 12px; border-radius: 4px; font-size: 12.5px; line-height: 1.6; border: 1px solid; }
  .ex-flag-air { background: rgba(124,163,107,0.08); border-color: var(--green); }
  .ex-flag-warn { background: rgba(193,85,61,0.08); border-color: var(--red); }
  .ex-flag-lbl { font-family: var(--monoFont); font-size: 9.5px; letter-spacing: 0.13em; font-weight: 600; display: block; margin-bottom: 4px; }
  .ex-air .ex-flag-lbl { color: var(--green); }
  .ex-warn .ex-flag-lbl { color: var(--red); }
  .footer-note { margin-top: 32px; font-family: var(--monoFont); font-size: 10.5px; color: var(--inkMuted); text-align: center; }
</style>
</head>

<script>

var docketEvents = [
  {"date":"2019-06-10","title":"STATUTORY FOUNDATION — HB 1325 takes effect (see Source Bank tab for verified text)","detail":"The Hemp Farming Act. Passed House 144-0, Senate 31-0, effective immediately. Four provisions carry the whole Texas argument, all verified against the enrolled text: (1) Tex. Agric. Code § 121.001 defines hemp to expressly include 'all derivatives, extracts, cannabinoids, ISOMERS, ACIDS, salts, and salts of isomers' at or below 0.3% delta-9 — delta-8 is an isomer, THCA is an acid. (2) Tex. Health & Safety Code § 481.002(5), added by SECTION 8 of the bill, excludes hemp 'or the tetrahydrocannabinols in hemp' from the definition of controlled substance — note PLURAL. (3) § 481.002(26)(F) excludes hemp from 'marihuana' for criminal purposes. (4) § 443.204(1) commands that rules regulating consumable hemp sales must reflect the principle that hemp-derived cannabinoids 'are not considered controlled substances or adulterants' — the closest the statute comes to an express answer, though it governs sale rules rather than scheduling. CORRECTIONS from earlier tracker versions: the 481.002 amendment is SECTION 8, not Section 6 (Section 6 was introduced-version numbering); and 'tetrahydrocannabinols' is plural, not singular — several secondary sources get this wrong and the singular materially weakens the provision.","status":"FILED","sources":[{"label":"HB 1325 enrolled text (LegiScan)","url":"https://legiscan.com/TX/text/HB1325/id/2026154"}]},
  {"date":"2025-09-10","title":"⚠ MISSING PIECE — Abbott issues Executive Order GA-56, the origin of the March 2026 rules","detail":"A GAP IN THIS TRACKER UNTIL NOW: the Mar 31, 2026 entry described DSHS rules taking effect without ever explaining WHY DSHS wrote them. This is why. After vetoing SB 3 in June 2025 — the Legislature’s outright THC ban — Abbott issued Executive Order GA-56 on Sept 10, 2025, directing DSHS and TABC to act under EXISTING statutory authority. Per DSHS’s own presentation to the Senate HHS Committee, GA-56 directed the agency to immediately begin rulemaking to prohibit sales to minors and require age verification, and to REVIEW AND REVISE TESTING REQUIREMENTS, FEES, LABELING AND RECORDKEEPING. DSHS first enacted emergency age-gating rules, then adopted the long-term rules on March 31, 2026 — which include, in the agency’s own words, INCLUSION OF THC-A IN THE TOTAL DELTA-9 THC AMOUNT, plus labeling requirements and updated fees. Over 1,400 public comments were submitted; some fees were reduced from the original proposal but most restrictions survived. SO THE CAUSAL CHAIN IS DIRECT: Abbott veto → GA-56 → DSHS rulemaking → the total-THC standard now being challenged in THBC v. DSHS. Texas Policy Research’s observation is worth airing: the agencies’ action effectively implements key elements of the policy Abbott had vetoed earlier that year.","status":"FILED","sources":[{"label":"DSHS presentation to Senate HHS (PRIMARY)","url":"https://www.dshs.texas.gov/sites/default/files/legislative/89th/senate-hhs-hemp-rulemaking.pdf"},{"label":"TX SOS — proposed rules citing GA-56","url":"https://www.sos.state.tx.us/texreg/archive/December262025/Proposed%20Rules/25.HEALTH%20SERVICES.html"},{"label":"Texas State Law Library — GA-56 guide","url":"https://guides.sll.texas.gov/cannabis/hemp-products"},{"label":"THBC on the final rules","url":"https://texashempbusinesscouncil.com/dshs-publishes-new-rules-to-regulate-the-texas-hemp-industry/"}]},
  {"date":"2026-03-31","title":"DSHS Total-THC rules take effect","detail":"25 TAC Ch. 300 rules — new total-THC compliance standard plus fee increases. FEE CORRECTION: manufacturer $250 → $10,000 per facility, retailer $150 → $5,000 per location. Earlier tracker versions said $258 for the manufacturer figure; that was wrong. Press coverage characterizes the retailer increase as roughly a 3,000% jump. Four rules were challenged in THBC v. DSHS: the total-THC redefinition including THCA, an interstate transport restriction, the fee increases, and treating each day of violation as a separate violation.","status":"FILED","sources":[{"label":"DSHS proposed rules (TX SOS Register)","url":"https://www.sos.state.tx.us/texreg/archive/December262025/Proposed%20Rules/25.HEALTH%20SERVICES.html"}]},
  {"date":"2026-04-07","title":"THBC + HIFA + 7 co-plaintiffs file verified petition + TRO","detail":"Filed in the 455th District Court, Travis County (Cause No. D-1-GN-26-002511). ⚠ DOUBLE CORRECTION — READ THIS: the original tracker said 455th. On Aug 8 this tracker ‘corrected’ that to 261st based on THBC’s own press release and Austin Chronicle coverage. THE APPELLEES’ BRIEF FILED WITH THE 15TH COA ON AUG 14 SETTLES IT: the caption reads ON INTERLOCUTORY APPEAL FROM THE 455TH DISTRICT COURT OF TRAVIS COUNTY, TEXAS; CAUSE NO. D-1-GN-26-002511; HON. DANIELLA DESETA LYTTLE. The original figure was right, the correction was wrong, and the party press release was less reliable than the court filing. Lesson logged: a caption on a filed brief outranks a press release from the same party.","status":"FILED","sources":[{"label":"THBC press release (GlobeNewswire)","url":"https://www.globenewswire.com/news-release/2026/05/01/3286150/0/en/texas-hemp-business-council-responds-to-texas-court-decision-granting-temporary-injunction-in-hemp-regulatory-challenge.html"}]},
  {"date":"2026-04-10","title":"TRO granted","detail":"Bond $50. ⚠ JUDGE ATTRIBUTION NOW UNCERTAIN AGAIN: the Aug 14 appellees’ brief names HON. DANIELLA DESETA LYTTLE as the trial judge for the 455th, which is the court that issued both the TRO and the TI. Austin Chronicle reported Gamble granted the TRO and Lyttle the TI; the brief caption names only Lyttle. Possible explanations: Gamble sat for the TRO by assignment or central-docket rotation, or the Chronicle erred. UNRESOLVED — attribute the TRO to ‘the 455th District Court’ rather than to a named judge. PRIOR NOTE, retained:  earlier today this tracker flagged a supposed conflict over which judge handled which ruling. There is no conflict — the Austin Chronicle (Jul 30) states it plainly: Gamble granted the TRO on April 10, and Judge Daniella DeSeta Lyttle granted the temporary injunction in May. Two different judges, two different rulings. Travis County uses a central docket, so motions in one cause number can be heard by different judges in their own courts, which is why both names appear legitimately. THBC's own press release naming Gamble in connection with the TI appears to be an error on their end. The 455th figure in the earliest tracker versions was still wrong.","status":"ACTIVE","sources":[{"label":"THBC press release (GlobeNewswire)","url":"https://www.globenewswire.com/news-release/2026/05/01/3286150/0/en/texas-hemp-business-council-responds-to-texas-court-decision-granting-temporary-injunction-in-hemp-regulatory-challenge.html"}]},
  {"date":"2026-05-01","title":"Temporary injunction granted — statewide, industry-wide","detail":"Granted by Hon. Daniella DeSeta Lyttle, 455th District Court, Travis County — confirmed by the caption of the appellees’ brief filed Aug 14. Bond $8,000. Followed a three-day hearing. Court held the purpose of a TI is to preserve 'the last, actual, peaceable, non-contested status that preceded the controversy,' and found the rules caused irreparable harm. Economic evidence in the record: Beau Whitney (Whitney Economics) testified the rules would produce a $7.2 billion negative impact on the Texas economy via job losses and lost tax revenue; industry advocates separately cite ~$11 billion in total economic impact at risk. Fee increase characterized in press coverage as a ~3,000% jump for retailers. Same-day complication: the Texas Supreme Court decided Sky Marketing (the separate Schedule I track) that morning — THBC publicly anticipated the State would lean on it. Plaintiffs: THBC, HIFA, Alchemy TX Consulting, A to Z Investments and Wholesale, Serenity Organics, TexaKana Organics, Elevate Wellness Dispensary, Texas High Council, Salganik Services. Counsel: Butler Snow, Snell Law, The Banks Law Firm, Dickinson Wright, David Sergi & Associates; Amanda Garrett Taylor is lead appellate counsel.","status":"ACTIVE","sources":[{"label":"THBC press release (GlobeNewswire)","url":"https://www.globenewswire.com/news-release/2026/05/01/3286150/0/en/texas-hemp-business-council-responds-to-texas-court-decision-granting-temporary-injunction-in-hemp-regulatory-challenge.html"},{"label":"KUT","url":"https://www.kut.org/business/2026-05-01/austin-tx-hemp-cannabis-ruling-temporary-injunction-granted-thca"},{"label":"Texas Tribune — economic impact","url":"https://www.texastribune.org/2026/05/15/texas-smokeable-hemp-ban-lawsuit-smoke-shop/"}]},
  {"date":"2026-05-05","title":"State files interlocutory appeal","detail":"State notices an interlocutory appeal, which suspends the TI. PRECISION NOTE: the relevant authority is Tex. Civ. Prac. & Rem. Code § 51.014, and which subsection the State invoked matters a great deal (see the July 27 entry). The standard Texas AG pattern is to notice appeal under § 51.014(a)(4) AND (a)(8) together — the temporary-injunction ruling plus denial of a plea to the jurisdiction — because only the latter freezes the whole case. The identical (a)(4)+(a)(8)+(b) construction appears in the State's notice of appeal in ADL v. Abbott. NOT YET VERIFIED against this docket; confirm before asserting on air.","status":"PENDING","sources":[{"label":"THBC: Injunction Lifted","url":"https://texashempbusinesscouncil.com/thbc-injunction-lifted-what-this-means-and-what-happens-next/"}]},
  {"date":"2026-05-07","title":"15th COA reinstates TI via emergency administrative stay","detail":"Products return to shelves pending the court's consideration of the emergency motion.","status":"ACTIVE","sources":[{"label":"Spectrum News","url":"https://spectrumlocalnews.com/tx/austin/news/2026/05/08/navigating-hemp-legal-battle"}]},
  {"date":"2026-06-05","title":"15th COA dissolves the stay — injunction lifted (two-sentence order, no merits ruling)","detail":"Emergency Rule 29.3 motion denied; May 7 administrative stay dissolved. DSHS rules back in force statewide. The order was literally two sentences and did NOT decide whether the rules are lawful — it only puts the case in a holding pattern pending the merits of the State's appeal. Notably, enforcement posture was unclear even to DSHS: agency spokesperson Lara Anton told KUT that 'DSHS is still determining how to proceed given that there is not a final disposition yet.' That ambiguity is the factual basis for THBC's later 'regulatory whiplash' argument.","status":"STAYED","sources":[{"label":"KUT","url":"https://www.kut.org/business/2026-06-09/austin-tx-hemp-cannabis-marijuana-court-appeals-decisin"},{"label":"Houston Public Media","url":"https://www.houstonpublicmedia.org/articles/news/business/2026/06/10/554121/austin-tx-hemp-cannabis-marijuana-court-appeals-decisin/"},{"label":"THBC: Injunction Lifted","url":"https://texashempbusinesscouncil.com/thbc-injunction-lifted-what-this-means-and-what-happens-next/"}]},
  {"date":"2026-06-22","title":"THBC files motion to reinstate TI","detail":"Cites DSHS's inconsistent enforcement of the total-THC standard and fee structure — recorded calls/affidavits describing certain provisions as “not currently enforced,” producing “regulatory whiplash.” Industry counsel calls the resulting environment “administrative entrapment.” Seeks reinstatement industry-wide, or at minimum for named plaintiffs.","status":"PENDING","sources":[{"label":"GlobeNewswire release","url":"https://www.globenewswire.com/news-release/2026/06/23/3316486/0/en/Texas-Hemp-Business-Council-Seeks-Reinstatement-of-Injunction-Amid-Conflicting-State-Enforcement-Signals.html"}]},
  {"date":"2026-07-27","title":"Trial date passed — no trial held; the STATUTORY REASON is narrower than previously tracked","detail":"No trial occurred. CORRECTION to earlier tracker versions, which said flatly that §51.014(b) auto-stays trial pending the State's interlocutory appeal — that is imprecise and, standing alone, wrong. §51.014(b) stays the commencement of trial for interlocutory appeals 'other than an appeal under Subsection (a)(4)' — and (a)(4) is exactly the subsection covering orders granting or refusing a temporary injunction. So an appeal of the TI BY ITSELF would NOT have stopped this trial. What freezes everything is §51.014(b)'s second sentence: appeals under (a)(3), (5), (8) or (12) 'also stay all other proceedings.' (a)(8) = grant or denial of a plea to the jurisdiction by a governmental unit. THBC's own public description — the State wants the case 'thrown out entirely before it even makes it to trial' — is plea-to-the-jurisdiction language, so an (a)(8) appeal is almost certainly the operative blocker. INFERRED from THBC's description plus the statute, NOT confirmed from the docket. Two further points worth knowing: (1) §51.014(c) conditions the (a)(8) automatic stay — it does not apply unless the plea was filed and requested for submission or hearing by the later of a scheduling-order date or the 180th day after the defendant's filing, so whether the stay even attached is a real and checkable question; (2) courts have held the §51.014 stay is statutory and allows 'no room for discretion,' and a trial court that proceeds despite an unresolved jurisdictional challenge abuses its discretion (see Paxton v. City of Austin, Tex. 2026). Levers that did exist on this date: a motion to expedite at the 15th COA, a mandamus petition to the Texas Supreme Court (floated by THBC, not filed), or a challenge to whether the (a)(8) stay attached under §51.014(c). Practical note: even a win here would not have touched the July 31 Schedule I reinstatement — different legal track.","status":"RESOLVED","sources":[{"label":"THBC: Injunction Lifted","url":"https://texashempbusinesscouncil.com/thbc-injunction-lifted-what-this-means-and-what-happens-next/"},{"label":"Tex. Civ. Prac. & Rem. Code §51.014 (full text)","url":"https://codes.findlaw.com/tx/civil-practice-and-remedies-code/civ-prac-rem-sect-51-014/"},{"label":"Paxton v. City of Austin (Tex. 2026) — no-discretion stay","url":"https://storage.courtlistener.com/pdf/2026/05/22/ken_paxton_attorney_general_of_texas_v._the_city_of_austin_and_austin.pdf"}]},
  {"date":"2026-08-18","title":"Status as of today (Tue Nov 10): reinstatement motion pending 101 days — but briefing just completed","detail":"No ruling yet from the 15th COA on the June 22 motion to reinstate — now 101 days pending. ⚠ POSTURE CHANGED AUG 14: appellees filed their brief and REQUESTED ORAL ARGUMENT. A court that grants argument will not rule on the reinstatement motion first; a court that denies it may rule sooner. Watch for an argument-setting order — that is the next real signal. DSHS rules remain in force in the interim. The appeal the court is actually deciding is the State's request to throw out the entire case before trial; if THBC wins on appeal, the case is remanded for trial on a permanent injunction (and per THBC, it is UNKNOWN who that trial judge would be). THBC has flagged a Writ of Mandamus to the Texas Supreme Court as a possible last-ditch route to restore the injunction — explicitly described as no guarantee of success and not free, so treat it as an option under consideration, not a filed action. Separately: THBC HAS RULED OUT FURTHER DELTA-8 LITIGATION: in its own notice, THBC states that absent someone funding a follow-up suit on the merits rather than an APA claim, it will not at this time move forward with any additional legal action regarding delta-8. So no challenge to today's ban is coming from THBC. Separately, THBC's position is that the July 10 notice does NOT moot this lawsuit, since this case is an APA-style challenge to the March 2026 rules rather than a merits challenge to the controlled-substances schedules.","status":"PENDING","sources":[{"label":"THBC: Injunction Lifted","url":"https://texashempbusinesscouncil.com/thbc-injunction-lifted-what-this-means-and-what-happens-next/"},{"label":"THBC: DSHS adds non-delta-9 THCs","url":"https://texashempbusinesscouncil.com/dshs-adds-non-delta-9-thcs-to-controlled-substances-list-effective-july-31-2026/"}],"isToday":true},
  {"date":"2024-01-01","title":"⭐ THE BEST FACT IN THE CASE — in 2024 DSHS said it LACKED authority to do what it did in 2026","detail":"From the appellees’ brief at CR631, 5RR385. During DSHS’s mandatory four-year review of Chapter 300 in 2024, commenters asked the agency to change the statutory compliance standard. DSHS DECLINED — and explained in the TEXAS REGISTER that ‘the definition of hemp is in statute’ and that changing that definition ‘requires legislative action and, hence, is outside the scope’ of the agency’s rulemaking authority. It then readopted Chapter 300 with no substantive changes. TWO YEARS LATER THE SAME AGENCY DID EXACTLY WHAT IT HAD SAID IT COULD NOT DO. This is the single most damaging fact in the record for the State, it is the agency’s own published words rather than an adversary’s characterization, and it is the cleanest thing to read aloud on air. The brief uses it to argue the Agencies never explained their supposed authority to make ‘such a critical change to the statute — which they had expressly declined to do just two years before.’","status":"FILED","sources":[{"label":"Appellees Brief at CR631 (user-supplied)","url":""}]},
  {"date":"2026-08-14","title":"⚠ CORRECTION — EIGHT challenged rules, not four; and the industry SUPPORTS most of the rulemaking","detail":"TWO FIXES TO THIS TRACKER. (1) The injunction reaches EIGHT challenged rules, not the four this tracker previously recorded (brief at CR1341-44, 5RR331-332). (2) MORE IMPORTANT FOR FRAMING: the Hemp Industry expressly did NOT challenge the consumer-safety rules and says so repeatedly — age verification, labeling and packaging, recordkeeping, product recalls, heavy-metals/pesticides/solvents/pathogen testing, certificate-of-analysis requirements, inspection and transportation documentation all stand unchallenged and are affirmatively supported. Critically, they also did NOT challenge Rule 300.301(a)(3), which requires accredited labs to measure and report delta-9 THC, TOTAL delta-9 THC, and TOTAL THC. THE DISTINCTION THEY ARE DRAWING: measuring and disclosing a number is fine; using that number as the legal threshold for what may be sold is a legislative judgment. Anyone framing this as ‘the hemp industry suing to avoid testing’ has it backwards, and the brief anticipates that framing directly: the State ‘conflates the hemp industry’s distinct agricultural and commercial sectors by focusing on testing. But the Hemp Industry challenges no testing rules.’","status":"FILED","sources":[{"label":"Appellees Brief (user-supplied)","url":""}]},
  {"date":"2026-08-14","title":"✅ RESOLVED — what Sky Marketing’s ‘obvious limitation’ actually is","detail":"This tracker has carried the phrase ‘subject only to the obvious limitation’ from KXAN’s coverage as an unresolved question, flagged as probably the most important unread phrase in the case. The brief supplies it with pinpoint cites. Sky Marketing, 733 S.W.3d 689, 701-06: the Commissioner had an ‘unusually high degree of discretion’ to SCHEDULE CONTROLLED SUBSTANCES because those decisions are ‘final unless altered by statute,’ citing Tex. Health & Safety Code § 481.034(g). BUT at 702 and 704 the Court also held that ‘a statute will always trump agency action,’ and that even the Commissioner’s unusually broad scheduling authority remained subject to the obvious limitation that AGENCY ACTION CANNOT CONTRADICT WHAT THE LEGISLATURE HAS ENACTED. THAT IS THE WHOLE BALLGAME FOR TRACK B: Sky Marketing is about § 481.034(g) scheduling authority, which is textually unique. Chapter 443 rulemaking authority is limited to rules ‘necessary to implement’ the statutory framework. So the State’s best case does not transfer, and the brief says so: ‘that decision does not resolve this case.’ I still have NOT read the opinion itself — this is the appellees’ characterization with pinpoint cites, which is far better than press paraphrase but is still an advocate’s reading.","status":"OPEN","sources":[{"label":"Appellees Brief (user-supplied)","url":""}]},
  {"date":"2026-08-14","title":"The numbers, now precise and from the record rather than press coverage","detail":"BASELINE INDUSTRY SCALE (2RR115-19; 3RR59-60; 5RR192-99): 48,882 TEXAS JOBS — not the rounded 48,000 — nearly $10 BILLION in annual economic activity, and approximately $257 MILLION in annual state sales tax revenue. PROJECTED LOSSES if the rules stand, per the industry’s expert economist (2RR134, 137): more than 36,000 JOBS ELIMINATED, approximately $7.2 BILLION in economic activity, and $1.4 BILLION in lost wages. NOTE THIS RESOLVES A CONFUSION IN EARLIER TRACKER ENTRIES: the $7.2B figure is the PROJECTED LOSS, not the size of the industry; the industry itself is ~$10B. Do not use them interchangeably. FEES — the originally proposed numbers were far worse than what was adopted, which is a detail almost no coverage carries: DSHS initially proposed manufacturer licensing at $25,000 PER FACILITY (from $250) and retail registration at $20,000 PER LOCATION (from $150). Adopted figures were $10,000 and $5,000 respectively, plus $10,000 ownership-change fees and delinquency fees increased tenfold. AFFECTED SMALL BUSINESSES: approximately 9,900 small businesses, microbusinesses and rural communities, by the Agencies’ own determination. One owner testified roughly 80% OF HIS INVENTORY became unsellable when the rules took effect (3RR37-39).","status":"FILED","sources":[{"label":"Appellees Brief (user-supplied)","url":""}]},
  {"date":"2026-08-14","title":"⚠ THE FEE MATH — a $202 million revenue projection against $69,315 in agency costs","detail":"THE MOST QUOTABLE NUMBERS IN THE BRIEF. In the fiscal note accompanying the ORIGINAL proposal, the Agencies estimated the revised fee structure would generate approximately $202,050,000 in additional annual revenue to the State — while increasing agency costs by only $69,315 in FY2026 and $5,648 in each following year. In the same document, the Government Growth Impact Statement stated the proposed rules ‘will not affect the number of DSHS employee positions.’ AFTER LITIGATION BEGAN the State produced a declaration from DSHS Senior Policy Officer F. James Charney newly claiming ~$16.7 MILLION in annual program costs and 23 additional full-time employees — a figure irreconcilable with the $69,315 published during rulemaking. The brief calls it ‘a retroactively created litigation position,’ and notes the declaration was NEVER INTRODUCED INTO EVIDENCE OR EVEN MENTIONED at the hearing. Even accepting Charney’s own number: the expert economist put adopted-fee revenue at ~$43 MILLION annually, leaving a windfall exceeding $26 MILLION over the State’s own claimed costs. That gap is the constitutional occupation-tax claim in one sentence. Also usable: the brief notes these fees on small businesses exceed what TABC charges Anheuser-Busch (3RR85-86).","status":"FILED","sources":[{"label":"Appellees Brief (user-supplied)","url":""}]},
  {"date":"2026-08-14","title":"The State’s evidentiary record was remarkably thin — and its appeal is narrower than reported","detail":"AT THE THREE-DAY HEARING the State presented exactly ONE lay witness, Dr. Timothy Stevenson, testifying primarily about the UNCHALLENGED laboratory testing methodologies. Per the brief: the State offered no testimony from any DSHS official involved in the rulemaking, fiscal analysis, economic analysis, licensing program, or fee development, and presented NO EXPERT WITNESS. The Hemp Industry put on business owners, an expert chemist, an expert economist, and an expert in veterans’ affairs. THE APPEAL IS ALSO NARROWER THAN GENERAL COVERAGE SUGGESTS: the State does NOT contest jurisdiction over the APA or constitutional claims, and its own brief concedes ‘this appeal does not demand a total dismissal.’ Its jurisdictional challenge runs only to the ultra vires claims, argued as ‘facially invalid’ with no independent standing or ripeness defect alleged. So even a total State win on the plea leaves the APA and constitutional claims alive. Report it as a challenge to part of the case, not the case.","status":"FILED","sources":[{"label":"Appellees Brief (user-supplied)","url":""}]},
  {"date":"2026-08-14","title":"Injunction scope — the exact language, and why ‘bad actors’ is a straw man","detail":"The State characterizes the injunction as ‘universal’ relief. The actual order text (CR1343) protects ‘the named Plaintiffs including all members of THBC and HIFA, and … any other commercial participant in Texas’s consumable hemp industry (meaning a person or entity operating or seeking to operate as a LICENSED OR REGISTERED manufacturer, processor, distributor, or seller of consumable hemp products within the state).’ THE LICENSED-OR-REGISTERED LIMIT IS THE ANSWER TO THE BAD-ACTOR ARGUMENT — unlicensed operators get nothing from this injunction, and the brief states the Hemp Industry affirmatively supports enforcement against them (3RR54, 58). Three findings justified the scope, and the brief notes the State did NOT challenge two of them on appeal, each an independent ground for affirmance: complete relief to the named plaintiffs is impossible without a functioning industry around them; the injury is indivisible across licensed participants; and denial would produce a multiplicity of suits — AT LEAST TWO OTHER LAWSUITS challenging these rules have already been filed in Travis County. On Trump v. CASA, the brief’s answer is that CASA construed the Judiciary Act of 1789 and federal equitable authority, while Texas district courts exercise broader general jurisdiction under Tex. Const. art. V § 8, and that forum-shopping concerns are absent because APA suits against state actors must be brought in Travis County anyway.","status":"FILED","sources":[{"label":"Appellees Brief (user-supplied)","url":""}]},
  {"date":"2026-08-14","title":"GA-56 — the brief’s reading directly contradicts the State’s, and cuts against Hinojosa too","detail":"RELEVANT TO THE HINOJOSA FACT-CHECK IN THIS TRACKER. The brief argues GA-56 did NOT authorize what the Agencies did, and quotes the order describing their rulemaking authority as expressly cabined by the ‘existing limits’ of the governing statute. Per the brief: GA-56 directed DSHS to revise TESTING REQUIREMENTS so they would MEASURE both delta-9 and THCA conversion — not to make that measurement the LEGAL COMPLIANCE STANDARD. The State characterizes GA-56 as directing a ‘total delta-9 THC framework’; the brief calls that a mischaracterization. GA-56 also directed fees revised only ‘to reflect the full regulatory and enforcement costs incurred by the State,’ which the brief uses against the fee rules, and directed a STUDY with a ‘timeline for phased implementation’ rather than immediate action. ALSO NOTABLE: the brief states that after vetoing SB 3, the Governor did NOT direct DSHS to accomplish SB 3’s changes by rulemaking — he convened TWO SPECIAL SESSIONS, each including hemp regulation, and the Legislature enacted nothing. That sequence cuts against the ‘Abbott single-handedly did this’ framing from a second direction: the appellees are arguing the agencies went BEYOND what Abbott ordered.","status":"FILED","sources":[{"label":"Appellees Brief (user-supplied)","url":""}]},
  {"date":"2026-08-14","title":"Counsel roster — and a direct link to Monti v. Garcia","detail":"SIGNATURE BLOCK CONFIRMS SOMETHING THIS TRACKER ONLY INFERRED: ANDREA STEEL of The Banks Law Firm, P.A. (Houston) signs for THBC alongside Butler Snow — the SAME attorney who is counsel of record in Monti v. Garcia and the same one publicly warning that officers cannot determine cannabinoid composition from packaging. She is personally in both the state APA case and the federal constitutional case. FULL CLIENT BREAKDOWN: Butler Snow (Amanda G. Taylor, J.R. Johnson) + The Banks Law Firm (Andrea Steel) for Texas Hemp Business Council, Alchemy TX Consulting LLC, A To Z Investments and Wholesale, CPRT and Company LLC, and Texas Green Craft LLC aka TexaKana Organics. Dickinson Wright (Andrew J. Alvarado) for Hemp Industry & Farmers of America. Johnston Tobey Baruch (Chad Baruch, Brandon Tobey) for Elevate One TX LLC dba Elevate Wellness Dispensary, Clutch City Gas LLC dba Texas High Council, and Salganik Services Inc. FOR THE STATE: the OAG service list includes Cory Scanlon, Teagen Fessenden, Zachary Berg, Steven Loomis, Jacob Dustin, Jim Rich, Ali Thorburn, Keith Ingram, Bowie Duncan and Jessica Yvarra, plus outside counsel at Wright & Greenhill (Heidi Coughlin, Brantley Ross Pringle Jr., Lauren Ross). Brief is 14,662 words; e-filing Envelope ID 118657049.","status":"FILED","sources":[{"label":"Appellees Brief signature block (user-supplied)","url":""}]},
  {"date":"2026-08-14","title":"⚠ THE PRAYER — they are asking for immediate reinstatement, which is the pending motion","detail":"The brief’s prayer asks the Court to affirm both orders AND to ‘immediately reinstate the injunction pending any further proceedings on appeal.’ That is the June 22 reinstatement motion, now carried forward into the merits briefing — so the reinstatement request and the merits are now in front of the same panel at the same time, which may explain why no separate ruling has issued in 57 days. WATCH FOR: an order setting oral argument (requested), or a ruling on reinstatement. Note also the brief’s fallback: even if the State wins on the plea, ‘this case should be remanded for further proceedings,’ citing Abbott v. Harris County for remand even where a temporary injunction is dissolved. Nobody is asking for this case to end here.","status":"PENDING","sources":[{"label":"Appellees Brief (user-supplied)","url":""}]},
  {"date":"2026-08-14","title":"⚠⚠ APPELLEES’ BRIEF FILED — the strongest primary document in this track","detail":"Accepted by the Fifteenth Court of Appeals Aug 14, 2026 at 3:02 PM, clerk Michael A. Cruz. Cause No. 15-26-00099-CV, on interlocutory appeal from the 455TH District Court of Travis County, Cause No. D-1-GN-26-002511, Hon. Daniella DeSeta Lyttle. ORAL ARGUMENT REQUESTED. THREE LEAD COUNSEL TEAMS: Amanda G. Taylor and J.R. Johnson (Butler Snow LLP, Austin) for THBC et al.; Andrew J. Alvarado (Dickinson Wright PLLC, Austin) for Hemp Industry and Farmers of America; Charles ‘Chad’ Baruch and Brandon Tobey (Johnston Tobey Baruch, Dallas) for Elevate One TX, LLC et al. THE CONCESSION TO LEAD WITH: the brief states the State CONCEDES the statutory standard is a 0.3% delta-9 threshold which ‘remains on the books in Texas,’ citing the State’s own brief at page 8. That is the opposing party admitting the statute says delta-9 — the entire ballgame on the ultra vires claim. ECONOMIC FIGURE, now from a court filing rather than press coverage: more than 48,000 TEXAS JOBS and billions in annual economic activity. This supersedes looser numbers previously in this tracker (~30,000 employees per David Sergi; $7.2B impact per Whitney Economics testimony) — different measures, but 48,000 jobs is what the industry is putting before the court. ALSO: Sky Marketing now has an official reporter citation, 733 S.W.3d 689 (Tex. 2026).","status":"FILED","sources":[{"label":"Appellees Brief, No. 15-26-00099-CV (user-supplied)","url":""}]},
  {"date":"2026-08-14","title":"The brief’s argument structure — and an SB 14 issue of first impression","detail":"FOUR GROUNDS. (I) The district court correctly denied the State’s PLEA TO THE JURISDICTION because valid claims waive sovereign immunity — this confirms the § 51.014(a)(8) inference this tracker made about why trial was stayed. (II) APA VIOLATIONS: failure to substantially comply with economic analysis requirements under §§ 2001.022, .024 and 2006.002, and with the reasoned-justification requirement of § 2001.033. (III) ULTRA VIRES: the rules replace the Legislature’s legal compliance standard with one created by the Officials; impose excessive fees beyond delegated authority; and the penalty rule conflicts with the Legislature’s notice-and-cure framework. (IV) CONSTITUTIONAL: the fee rules operate as an unauthorized OCCUPATION TAX under Tex. Const. art. VIII § 1, and the penalty rule imposes EXCESSIVE FINES without due course of law under art. I §§ 13 and 19. ⚠ ISSUE OF FIRST IMPRESSION, the most newsworthy legal angle: the APA claims are governed by 2025 amendments — SB 14, Act of April 23, 2025, 89th Leg., ch. 1, §§ 10, 13, eff. Sept 1, 2025 — which the brief says HAVE NOT YET BEEN CONSIDERED IN ANY APPELLATE OPINION. The brief quotes GOVERNOR ABBOTT describing SB 14 as putting ‘stricter standards on new regulations that could be costly to businesses, and a check on the growth of the administrative state.’ THE IRONY IS THE STORY: the industry is using Abbott’s own deregulatory statute against rules that Abbott’s own executive order set in motion — and it is sourced to a court filing, not commentary.","status":"PENDING","sources":[{"label":"Appellees Brief, No. 15-26-00099-CV (user-supplied)","url":""}]},
  {"date":"2026-08-08","title":"⚠ FACT-CHECK — Rep. Gina Hinojosa: ‘Abbott single-handedly made THC products a felony’","detail":"Claim, posted to Facebook and drawing 6.6K reactions: Greg Abbott single-handedly made THC products that were legal last month a felony to possess today. VERDICT: DIRECTIONALLY RIGHT ON STRUCTURE, WRONG ON THE SPECIFIC MECHANISM. WHAT IS RIGHT: none of this came from the Legislature. Abbott vetoed SB 3, the legislative ban, then issued GA-56 directing agencies to act on existing authority — so the executive branch, which he heads and whose DSHS commissioner he appoints, produced the March 2026 total-THC rules. That is a genuine Abbott causal chain and it is the structural story this tracker has emphasized throughout. WHAT IS WRONG: the FELONY POSSESSION exposure she describes comes from the July 31 Schedule I reinstatement — Track A — not from GA-56. Those are DSHS definitions FIRST ADOPTED IN 2021, four years before GA-56, which sat blocked by a 2021 injunction until the TEXAS SUPREME COURT dissolved it in DSHS v. Sky Marketing on May 1, 2026. The proximate cause of felony exposure is a court ruling reviving old rules, not an Abbott action. AND THE OMISSION THAT CUTS AGAINST HER: Abbott VETOED the Legislature’s broader ban, drawing attacks from Lt. Gov. Patrick for doing so. Calling him the single author of prohibition skips that he blocked the more sweeping version. FAIREST FORMULATION FOR AIR: Abbott’s executive order drove the total-THC rules now in litigation, while the felony reclassification came through a separate track the Texas Supreme Court reopened — but both happened through executive and judicial action rather than legislation, which is Hinojosa’s underlying point and it stands.","status":"OPEN","sources":[{"label":"DSHS presentation (PRIMARY)","url":"https://www.dshs.texas.gov/sites/default/files/legislative/89th/senate-hhs-hemp-rulemaking.pdf"},{"label":"Texas Policy Research — veto then EO","url":"https://www.texaspolicyresearch.com/texas-tightens-hemp-rules-following-abbotts-executive-order/"}],"isToday":true},
  {"date": "2026-08-09", "title": "\u274c TRO DENIED in Monti v. Garcia \u2014 Judge Jeffrey V. Brown, Galveston", "detail": "CORRECTS THIS TRACKER: entries through Aug 18 said 'NO TRO HAS BEEN GRANTED.' That was technically true but badly stale \u2014 it was DENIED on Sunday, Aug 9, 2026 by U.S. District Judge JEFFREY V. BROWN. Do not say 'no ruling'; say the TRO was denied. GROUNDS \u2014 SEE THE PRIMARY-SOURCE ENTRIES IN THE MONTI TRACK, WHICH SUPERSEDE THIS: the order denied on THREE independent grounds, including likelihood-of-success findings against BOTH the vagueness and dormant Commerce Clause theories, not merely insufficient irreparable harm. Press coverage understated the scope of the denial. \u26a0 WHAT IT IS NOT: Nothing But Canna puts it correctly \u2014 the reason was procedural and 'that is not a ruling that the ban is lawful.' A TRO denial decides almost nothing about the merits. ANDREA STEEL'S FRAMING, useful because it is accurate rather than spin: 'A temporary restraining order is emergency relief, held to one of the toughest standards in federal law.' She added: 'We now have time to develop the case more and work towards our preliminary injunction, which is what the goal has always been.' MINOR DATE DISCREPANCY: Tribune, KERA and Nothing But Canna all say Sunday (Aug 9); Haze Connect says Aug 10. Aug 9 was the Sunday; the Tribune story published Aug 10. Use Aug 9 for the ruling.", "status": "RESOLVED", "sources": [{"label": "Texas Tribune", "url": "https://www.texastribune.org/2026/08/10/texas-hemp-thc-ban-federal-court-emergency/"}, {"label": "KERA News", "url": "https://www.keranews.org/news/2026-08-11/texas-hemp-thc-ban-federal-court-emergency"}, {"label": "Galveston Daily News \u2014 Steel quotes", "url": "https://www.galvnews.com/news/judge-denies-restraining-order-on-texas-hemp-ban/article_8abceb6e-a7cd-4bc9-b25c-409b54d81551.html"}, {"label": "Nothing But Canna", "url": "https://www.nothingbutcanna.net/blogs/news/no-emergency-brake-texas-keeps-its-thc-ban-and-the-fight-moves-to-round-two"}]},
  {"date": "2026-08-19", "title": "\u2b50 THIRD LAWSUIT FILED \u2014 four retailers, 459th District Court, Travis County", "detail": "NEW CASE, distinct from both THBC v. DSHS and Monti v. Garcia. Filed Wednesday Aug 19, 2026 by FOUR HEMP RETAILERS against DSHS. \u26a0 COURT IDENTITY \u2014 READ THE CORRECTION: the Texas Tribune initially reported this as filed in the U.S. District Court for the WESTERN DISTRICT OF TEXAS, then issued a formal correction on Aug 21, 2026 at 2:15 p.m. Central stating the suit was filed in the 459TH JUDICIAL DISTRICT COURT OF TRAVIS COUNTY \u2014 a STATE court, not federal. Insurance Journal and other outlets republished the UNCORRECTED version and still say Western District. Use the 459th; treat any 'federal Western District' reference as the pre-correction error. THE NEW CLAIM THAT MAKES THIS DIFFERENT: alongside executive-overreach and 2018 Farm Bill arguments, these plaintiffs allege the ban has created a MONOPOLY FOR THE STATE'S MEDICAL MARIJUANA PROGRAM \u2014 an antitrust-flavored theory neither other case is running. They also allege massive job loss. Counsel is Sergi \u2014 DAVID SERGI, already in this tracker as co-counsel in THBC v. DSHS. Quote: 'We are asking the Court to uphold the Texas Constitution, protect thousands of Texas jobs, and keep policy decisions where they belong \u2014 with the elected representatives of the people.' They are also moving for a TRO and temporary injunction. NOTE ON THE COURT: the 459th is Judge Maya Guerra Gamble\u2019s court \u2014 confirmed Aug 27. \u26a0 SEE THE AUG 27 ENTRIES: this suit may be the same case as Kingpin Kush et al. v. DSHS, which has a TRO hearing before Gamble on Aug 27. Both are Travis County, both name DSHS, both have four plaintiffs. Unconfirmed whether they are one case or two.", "status": "FILED", "sources": [{"label": "KERA News", "url": "https://www.keranews.org/texas-news/2026-08-21/texas-hemp-thc-lawsuit-ban-felony"}, {"label": "Texas Tribune (carries the Aug 21 correction)", "url": "https://www.texastribune.org/2026/08/03/texas-hemp-thc-lawsuit-ban-felony/"}, {"label": "Insurance Journal (UNCORRECTED \u2014 says Western District)", "url": "https://www.insurancejournal.com/news/southcentral/2026/08/21/882478.htm"}]},
  {"date": "2026-08-27", "title": "\u26a0\u26a0 CONFLICT \u2014 is THCA flower covered by the July 31 ban? My explainer says no; the Tribune says yes.", "detail": "FLAGGING AGAINST MY OWN WORK. Explainer #2 in this tracker states that the July 31 Schedule I reinstatement reaches ISOMERS (delta-8, delta-10, THCP, HHC) and does NOT reach THCA, because THCA is an acid rather than an isomer \u2014 and that conflating the two is the most common reporting error. MULTIPLE OUTLETS SAY OTHERWISE. Texas Tribune's Stephen Simpson, republished by KERA, Houston Public Media and Insurance Journal, writes: 'The ban applies to all synthetically created THC forms, including delta-8, delta-10, THCP and THCA flower.' THE TENSION IS REAL AND I CANNOT RESOLVE IT FROM SECONDARY SOURCES. Arguments each way: FOR INCLUSION \u2014 DSHS's own enforcement statement covers 'more than trace amounts of any THC other than delta-9,' and THCA is literally a tetrahydrocannabinol that is not delta-9; the reinstated 2021 definition is of 'Tetrahydrocannabinols' plural, which may sweep in acid forms. AGAINST \u2014 THCA occurs naturally in the plant rather than being 'synthetically created,' so the Tribune's own qualifier arguably excludes it; and Tex. Agric. Code \u00a7 121.001 expressly lists 'acids' within lawful hemp. ALSO POSSIBLE: the Tribune is committing exactly the two-track conflation this tracker warns about, since THCA IS restricted \u2014 by the separate March 2026 total-THC rules. RESOLUTION REQUIRES the actual text of the reinstated definitions at 51 Tex. Reg. 4597. DO NOT STATE EITHER POSITION CONFIDENTLY ON AIR UNTIL THAT IS READ.", "status": "OPEN", "sources": [{"label": "KERA (Tribune syndication)", "url": "https://www.keranews.org/texas-news/2026-08-21/texas-hemp-thc-lawsuit-ban-felony"}, {"label": "Houston Public Media (Tribune syndication)", "url": "https://www.houstonpublicmedia.org/articles/news/business/2026/08/04/558590/texas-hemp-thc-lawsuit-ban-felony/"}], "isToday": true},
  {"date": "2026-08-27", "title": "Two numbers worth having: THCA counts as 88% delta-9, and ~14,000 licensed retailers", "detail": "THE CONVERSION FACTOR, from KUT and new to this tracker: the Total THC Rule 'counts THCA as 88% Delta-9 when it comes to selling and manufacturing hemp products.' That is the decarboxylation efficiency factor \u2014 the standard figure is 0.877, reflecting the mass lost when THCA sheds its carboxyl group under heat. So total THC = delta-9 + (0.877 \u00d7 THCA). This is the arithmetic that makes THCA flower fail: 20% THCA becomes roughly 17.5% toward the total, against a 0.3% ceiling. Useful on air because it shows the standard is not arbitrary \u2014 it is a real chemical conversion \u2014 while the legal question remains who gets to choose that measurement point. MARKET SIZE: DSHS reports approximately 14,000 RETAIL STORES statewide licensed to sell consumable hemp. Pair with the 48,882 jobs and ~$10B figures from the appellees' brief.", "status": "OPEN", "sources": [{"label": "KUT \u2014 88% figure", "url": "https://www.kut.org/business/2026-06-09/austin-tx-hemp-cannabis-marijuana-court-appeals-decisin"}, {"label": "Texas Tribune \u2014 14,000 stores", "url": "https://www.texastribune.org/2026/08/10/texas-hemp-thc-ban-federal-court-emergency/"}], "isToday": true},
  {"date": "2026-08-27", "title": "\u2b50\u2b50 TRO HEARING TODAY 3:00 PM \u2014 Kingpin Kush v. DSHS, before Judge Gamble, via Zoom", "detail": "⚠ SUPERSEDED — SEE THE AUG 28 ENTRIES. This is the NOTICED setting, not what happened. Per plaintiff-side promotional material with the petition caption visible, the TRO hearing was advertised for THURSDAY AUG 27, 2026 at 3:00 P.M. via ZOOM. It actually occurred FRIDAY AUG 28 on a YouTube feed, after DSHS appeared Thursday without counsel. Original notice read: before JUDGE MAYA GUERRA GAMBLE of the 459TH CIVIL DISTRICT COURT, Travis County. FULL CAPTION from the petition image \u2014 this is the 'third lawsuit' entry from Aug 19, now with names: SS DISTRO USA LLC; TOPPS DISTRO LLC d/b/a KINGPIN KUSH; JASON MORENO d/b/a MY CITY HEMP; and TREVOR KOCAOGLAN, Plaintiffs, v. TEXAS DEPARTMENT OF STATE HEALTH SERVICES; IMELDA GARCIA, in her official capacity as Interim Commissioner; and GLENN HARGETT, in his official capacity as Director of the Drugs and Medical Devices Division, DSHS. \u26a0 NEW DEFENDANT NOT PREVIOUSLY IN THIS TRACKER: GLENN HARGETT, Director of the Drugs and Medical Devices Division at DSHS \u2014 a more operational target than the commissioner-level defendants in the other suits, and worth noting since he would be the official actually directing enforcement. RELIEF SOUGHT: temporary relief halting enforcement during the case, a declaration that DSHS exceeded its statutory authority, and permanent injunctive relief. Their framing of the merits matches the THBC ultra vires theory almost exactly \u2014 that DSHS 'improperly change[d] the legal boundary between hemp and controlled substances, something only the Texas Legislature can do.' \u26a0 SOURCE CAVEAT: this is a company marketing flyer, i.e. party advocacy. The caption and hearing details are specific enough to be reliable, but the characterizations are theirs. Outcome: no ruling as of Mon Aug 31 — see the Aug 28 entries.", "status": "PENDING", "sources": [{"label": "Kingpin Kush promotional material w/ petition caption (user-supplied)", "url": ""}], "isToday": true},
  {"date": "2026-08-27", "title": "\u2705\u2705 JUDGE ATTRIBUTION RESOLVED \u2014 Gamble is the 459th, Lyttle is the 455th", "detail": "CLOSING A QUESTION THIS TRACKER HAS CARRIED SINCE AUG 8, and it went through three revisions. The Kingpin Kush filing states Judge Maya Guerra Gamble sits in the 459TH CIVIL DISTRICT COURT, Travis County \u2014 and asserts that 'Judge Gamble presided over our previous TRO hearing in the THBC case and granted our TRO.' PUT TOGETHER WITH the appellees' brief caption naming the 455TH District Court and HON. DANIELLA DESETA LYTTLE, the full picture is now coherent: GAMBLE (459th) granted the April 10 TRO; LYTTLE (455th) granted the May 1 temporary injunction and is the judge of record on the appeal. TRAVIS COUNTY'S CENTRAL DOCKET is what allows one cause number to be heard by different judges in their own courts, which is exactly what happened and why the press coverage looked contradictory. THE AUSTIN CHRONICLE WAS RIGHT ALL ALONG. This tracker's history on this point, logged because the pattern is instructive: original entry said 455th for both; an Aug 8 'correction' changed it to 261st based on a THBC press release and CBT; the Aug 14 brief caption restored 455th for the TI; today's filing supplies the missing 459th for the TRO. THE 261ST FIGURE APPEARS TO HAVE BEEN WRONG THROUGHOUT and traces to a party press release. Lesson: on court identity, filings beat press releases beat trade coverage, every time.", "status": "RESOLVED", "sources": [{"label": "Kingpin Kush filing (user-supplied)", "url": ""}, {"label": "Appellees' Brief caption (user-supplied)", "url": ""}, {"label": "Austin Chronicle", "url": "https://www.austinchronicle.com/news/where-the-texas-hemp-market-currently-stands/"}], "isToday": true},
  {"date": "2026-08-27", "title": "Kingpin Kush by the numbers \u2014 and why the plaintiff profile differs from the other two suits", "detail": "FROM THE PLAINTIFFS' PETITION, per their own summary: 10 TEXAS RETAIL LOCATIONS, 10,000+ Texas customers served, and 90% OF REVENUE from hemp-derived products. That last figure is the one that does work in court \u2014 a 90% revenue concentration is a strong irreparable-harm showing, and note that irreparable harm is precisely what Judge Brown found INSUFFICIENT in the federal Monti case on Aug 9. HOW THE THREE SUITS NOW DIFFER, worth keeping straight on air: THBC v. DSHS (455th \u2192 15th COA) is the mature APA and ultra vires challenge to the MARCH total-THC rules, with a full evidentiary record and briefing complete. MONTI v. GARCIA (S.D. Tex.) is the FEDERAL constitutional challenge to the JULY 31 Schedule I reinstatement \u2014 TRO denied, PI pending. KINGPIN KUSH (459th) is a STATE ultra vires challenge with a TRO hearing today, plus the separate four-retailer suit reported Aug 19 raising a medical-marijuana MONOPOLY theory. \u26a0 OPEN QUESTION: whether the Aug 19 'four hemp retailers' suit reported by KERA and the Tribune IS this Kingpin Kush case, or a fourth separate action. Both are in Travis County, both name DSHS, both have four plaintiffs. The Kingpin caption lists SS Distro, Topps Distro, Jason Moreno and Trevor Kocaoglan; KERA attributed its suit to counsel David Sergi and led with a monopoly claim not visible in the Kingpin materials. TREAT AS POSSIBLY THE SAME CASE UNTIL CONFIRMED \u2014 do not report three state suits if there are two.", "status": "OPEN", "sources": [{"label": "Kingpin Kush petition summary (user-supplied)", "url": ""}, {"label": "KERA \u2014 Aug 19 suit", "url": "https://www.keranews.org/texas-news/2026-08-21/texas-hemp-thc-lawsuit-ban-felony"}], "isToday": true},
  {"date": "2026-08-28", "title": "\u2b50\u2b50 HEARING HELD FRIDAY AUG 28 \u2014 not Thursday; NO RULING YET as of Monday Aug 31", "detail": "CORRECTION TO THIS TRACKER: the Kingpin Kush promotional flyer advertised THURSDAY AUG 27 at 3:00 PM via Zoom. The hearing actually occurred FRIDAY AUG 28, and was streamed on a YOUTUBE feed, not Zoom. \u26a0 WHY IT MOVED, and this is the notable part: per a plaintiff-side press release, at the Thursday setting 'the Department represented that it had not been able to coordinate with the Attorney General's Office in time to have counsel appear on its behalf.' DSHS SHOWED UP WITHOUT A LAWYER. The matter was reset to Friday, when JIM RICH of the OAG did appear for DSHS. Whatever else is going on, the State was not ready for a TRO hearing on a statewide enforcement question. OUTCOME: Judge Maya Guerra Gamble said she would need TIME TO DECIDE and would try to return a decision later Friday. Per KXAN, as of 5:30 p.m. Friday Travis County's online records showed NO FILED ORDER. As of a Statesman report roughly nine hours before this update, she is still 'expected to rule later.' NOTHING HAS BEEN GRANTED OR DENIED. Do not report an outcome. \u26a0 PROCEDURAL DETAIL WORTH KNOWING: Gamble presided as the court's EMERGENCY JUDGE FOR THE WEEK \u2014 which is the central-docket mechanism that also explains why she handled the April TRO in the THBC case while Judge Lyttle has the 455th assignment.", "status": "PENDING", "sources": [{"label": "KXAN \u2014 hearing account", "url": "https://www.kxan.com/news/texas/lawsuit-thc-testing-hemp-products-tro-hearing/"}, {"label": "Cannabis Law Report \u2014 press release, DSHS without counsel", "url": "https://cannabislaw.report/press-release-update-tro-court-hearing-friday-aug-28-on-texas-hemp-businesses-lawsuit-against-texas-department-of-state-health-services/"}, {"label": "FOX 4 / FOX 26", "url": "https://www.fox4news.com/news/texas-judge-could-soon-allow-hemp-businesses-sell-thc-products-again"}], "isToday": true},
  {"date": "2026-08-28", "title": "\u2b50 THE ACTUAL ISSUE ARGUED \u2014 'trace amount' was never defined through rulemaking", "detail": "THIS IS THE SHARPEST FRAMING OF THE TEXAS FIGHT YET, and it is narrower and better than the broad ultra vires theories. PLAINTIFFS (David K. Sergi): DSHS cannot enforce against 'more than trace amounts' when it has never defined what a trace amount IS, and never put that term through rulemaking. In his words: 'In adding the term trace amount, [DSHS] added a term that has not been properly defined. Essentially what we're asking \u2026 is to have the definition solidified.' He tied it directly to the Supreme Court: 'When the Supreme Court issued its opinion in the Sky Marketing case, they talked about the fact that trace elements of various cannabinoids could still be legal, but they didn't define it.' THE STATE (Jim Rich, OAG): DSHS did not create a new rule at all \u2014 testing falls under existing state policy and law regarding ADULTERATED FOOD. \u26a0 NOTE WHAT THAT CONCEDES AND WHAT IT RISKS: if the State's position is that this is ordinary adulterated-food enforcement rather than new rulemaking, it avoids the APA problem but invites the question of how a food-adulteration framework supports Penalty Group 2 criminal exposure. WHY THIS MATTERS BEYOND THIS CASE: 'trace amount' is the exact hinge this tracker has flagged repeatedly \u2014 the line between lawful naturally-occurring cannabinoids and unlawful converted ones. A ruling that DSHS must define it through rulemaking would not strike the ban; it would force the agency to say precisely what it means, which is arguably more useful to operators than an injunction.", "status": "PENDING", "sources": [{"label": "KXAN", "url": "https://www.kxan.com/news/texas/lawsuit-thc-testing-hemp-products-tro-hearing/"}, {"label": "FOX 26 Houston", "url": "https://www.fox26houston.com/news/texas-judge-could-soon-allow-hemp-businesses-sell-thc-products-again"}], "isToday": true},
  {"date": "2026-08-28", "title": "\u26a0 JUDICIAL SIGNAL \u2014 Gamble pushed back on the breadth of the proposed order", "detail": "THE MOST IMPORTANT LINE FROM THE HEARING, and it should temper any expectation of sweeping relief. Per KXAN, Gamble pressed Sergi for clarity on what he was actually asking for and said: 'I'm not signing an order that says you can sell delta-8 marketed as delta-8. We all agree that's not allowed \u2026 I don't think the order you gave me makes that clear.' READ THAT CAREFULLY. She is signaling (1) that she treats delta-8 sold as delta-8 as unlawful and is not going to disturb that, and (2) that the plaintiffs' PROPOSED ORDER \u2014 which their own press materials acknowledged the judge 'may, and most likely will' adjust \u2014 was drafted too broadly for her. ANY TRO SHE SIGNS IS LIKELY TO BE NARROWER THAN WHAT WAS REQUESTED, and may be confined to the trace-amount definitional problem rather than restoring product categories. This is direct support for the assessment already in this tracker that 'covers the entire industry' is a marketing claim rather than a prediction \u2014 now with the judge saying so from the bench.", "status": "OPEN", "sources": [{"label": "KXAN \u2014 Gamble quote", "url": "https://www.kxan.com/news/texas/lawsuit-thc-testing-hemp-products-tro-hearing/"}, {"label": "Cannabis Law Report \u2014 proposed order caveat", "url": "https://cannabislaw.report/press-release-update-tro-court-hearing-friday-aug-28-on-texas-hemp-businesses-lawsuit-against-texas-department-of-state-health-services/"}], "isToday": true},
  {"date": "2026-09-17", "title": "\u274c SUPERSEDED \u2014 the Sept 17 / Oct 8 dates were conditional; it is Oct 30", "detail": "SUPERSEDED SEP 7 \u2014 SEE THE OCT 30 ENTRY. Fox 4 and Fox 26 reported from the courtroom that the TI hearing would be either Sept 17 or Oct 8 DEPENDING ON THE TRO RULING. The TRO was denied, and the date actually set is OCTOBER 30. Retained to show why both dates circulated. Original: depending on how Gamble rules on the TRO, the full TEMPORARY INJUNCTION hearing will be held on either SEPTEMBER 17 or OCTOBER 8, 2026. That is the next real decision point in the Kingpin Kush case and the first hard Texas date on the calendar since July 31. CONTEXT FOR THE CALENDAR: a TRO in Texas lasts 14 days; a temporary injunction lasts until the court rules on the merits. So if a TRO issues around Aug 31, it expires mid-September \u2014 which is presumably why Sept 17 is the earlier option. WATCH ALSO: the Oct 8 alternative would put the TI hearing barely five weeks before the federal Nov 12 deadline, and the 15th COA could rule on THBC at any point in that window.", "status": "OPEN", "sources": [{"label": "FOX 4 Dallas-Fort Worth", "url": "https://www.fox4news.com/news/texas-judge-could-soon-allow-hemp-businesses-sell-thc-products-again"}]},
  {"date": "2026-08-31", "title": "\u26a0\u26a0 THERE ARE MORE SUITS THAN THIS TRACKER HAS \u2014 Boomtown Vapor and Green Nation", "detail": "NEWLY SURFACED AND NOT PREVIOUSLY TRACKED. Per the Austin American-Statesman: 'Boomtown Vapor, the Texas Hemp Business Council and Green Nation have filed SEPARATE Travis County suits challenging the health department's new rules, including how it measures THC, fees and enforcement powers.' So alongside THBC v. DSHS and Kingpin Kush, there are at least TWO MORE Travis County actions \u2014 BOOMTOWN VAPOR and GREEN NATION \u2014 that this tracker has no entries for. Cause numbers, filing dates, counsel and posture all UNKNOWN. That makes at least FOUR state suits plus the federal Monti case. \u26a0 DO NOT SAY 'THREE LAWSUITS' ON AIR ANYMORE \u2014 an earlier entry in this tracker used that count and it is now wrong. The Statesman also confirms the Compassionate Use monopoly theory with a hard number: there are currently only THREE OPERATIONAL LICENSE HOLDERS in the Texas Compassionate Use Program, which is what makes the monopoly claim more than rhetorical. PLAINTIFF DETAIL, now more precise: SS Distro USA LLC is a DALLAS-based wholesaler; Topps Distro is SAN ANTONIO-based and operates 10 KingPin Kush stores statewide; Jason Moreno's My City Hemp is in WEBSTER; Trevor Kocaoglan is a hemp cultivator and consultant in the RIO GRANDE VALLEY. Filing date is reported as Aug 20 by cannabisregulations.ai, against the Aug 19 this tracker recorded from KERA \u2014 minor, unresolved.", "status": "OPEN", "sources": [{"label": "Austin American-Statesman via Yahoo", "url": "https://www.yahoo.com/news/us/articles/texas-hemp-businesses-delta-8-110000386.html"}, {"label": "cannabisregulations.ai", "url": "https://www.cannabisregulations.ai/cannabis-and-hemp-regulations-compliance-ai-blog/texas-dshs-thca-enforcement-lawsuit-august-2026"}], "isToday": true},
  {"date": "2026-09-01", "title": "Status Tue Sep 1 \u2014 STILL NO ORDER from Judge Gamble, four days after the hearing", "detail": "SUPERSEDED \u2014 the order came and it was a DENIAL. See the Sep 4 entry. This entry recorded four days of silence after the Aug 28 hearing and cautioned against reading the delay as a signal either way. That caution held up: the delay reflected Gamble weighing scope, not leaning toward the plaintiffs. Original note: the most recent reporting remains KXAN", "status": "PENDING", "sources": [{"label": "KXAN", "url": "https://www.kxan.com/news/texas/lawsuit-thc-testing-hemp-products-tro-hearing/"}], "isToday": true},
  {"date": "2026-08-28", "title": "The State's irreparable-harm argument \u2014 and KXAN's headline about the OAG", "detail": "NEW DETAIL FROM THE HEARING not previously captured. Jim Rich for DSHS argued there is no irreparable harm because an adequate remedy exists: 'If the seller thinks that DSHS has made a wrong decision, they can contest that and can ultimately pursue a court order to get their products back. There is no irreparable harm here.' WHY THAT ARGUMENT IS BOTH STRONG AND VULNERABLE: it is the same theory that won in the federal Monti case, where Judge Brown found the harm pled did not clear the emergency-relief bar \u2014 so it has a recent track record. But it assumes the injury is recoverable product, when the harm operators actually describe is closed businesses, lost accounts, and spoiled inventory, none of which a later order returns. The THBC appellees' brief makes exactly that point: the Hemp Industry cannot seek damages against the State, so equitable relief is the only remedy available. ALSO WORTH NOTING: KXAN headlined its piece 'Judge hears hemp testing lawsuit, CALLS OUT OAG OVER COMMUNICATIONS FAILURES' \u2014 which lines up with DSHS having appeared Thursday without counsel because it could not coordinate with the Attorney General's office in time. The court appears to have said something about that on the record. Worth pulling the full KXAN piece or the hearing recording if you want the exact language.", "status": "OPEN", "sources": [{"label": "KXAN \u2014 Rich quote and headline", "url": "https://www.kxan.com/news/texas/lawsuit-thc-testing-hemp-products-tro-hearing/"}]},
  {"date": "2026-04-10", "title": "Backfill \u2014 what the April TRO actually did, and Gamble's eight findings", "detail": "USEFUL CONTEXT FOR PREDICTING THE CURRENT RULING, since Gamble is the same judge. In the April TRO in THBC v. DSHS she did NOT grant everything requested: she blocked the rules prohibiting sale of smokable hemp and temporarily unblocked interstate sales, but DECLINED to block the increased licensing fees, deferring those to the next hearing. A partial grant, tailored to specific provisions. She supported it with EIGHT enumerated findings, including public interest, and wrote: 'The public interest is served by preserving a stable and lawful regulatory framework and by ensuring that administrative agencies act within the authority delegated by the Legislature.' That sentence is the cleanest statement of the separation-of-powers theory from a Texas judge in this whole fight and is worth having on air. \u26a0 DATE NOTE: this tracker carries April 10 for the TRO, matching KUT's contemporaneous report of a Friday ruling (April 10, 2026 was a Friday). Haze Connect says April 8, which was a Wednesday \u2014 treat April 10 as correct and Haze Connect as unreliable here, consistent with its tier in the source bank. OTHER FIGURES from the same coverage: 13,000+ registered hemp retail stores and nearly 800 licensed manufacturers per DSHS; the complaint ran 330 pages; plaintiffs' attorney Jason Snell described the harm as 'already occurring and exponentially multiplying like a wave rolling into a beach that gets bigger.'", "status": "RESOLVED", "sources": [{"label": "KUT", "url": "https://www.kut.org/business/2026-04-10/austin-tx-smokeable-hemp-ban-cannabis-temporary-restraining-order-lawsuit-pause"}, {"label": "Cannabis Business Times \u2014 eight findings", "url": "https://www.cannabisbusinesstimes.com/us-states/texas/news/15822051/thca-flower-sales-resume-in-texas-after-judge-grants-tro"}]},
  {"date": "2026-03-20", "title": "\u2b50\u2b50 PRIMARY \u2014 the adopted rules themselves, with DSHS's full legal justification", "detail": "THE ACTUAL TEXAS REGISTER ADOPTION DOCUMENT, now read in full. Filed with the Secretary of State March 2, 2026; TRD-202601064 through -202601070; signed by CYNTHIA HERNANDEZ, General Counsel, DSHS; effective March 31, 2026; proposal published Dec 26, 2025 at 50 TexReg 8486. Comment period ran 31 days, closed Jan 26, 2026, with 1,421 commenters. THE 0.877 FORMULA IS NOW PRIMARY-SOURCED, not press paraphrase. \u00a7 300.101(44) defines Total THC with the express equation [Total THC = (0.877 x THCA) + THC]. \u00a7 300.101(45) defines Total delta-9 THC as [Total delta-9 THC = (0.877 x THCA) + delta-9 THC]. That confirms KUT's '88%' figure and supersedes it with the exact rule text. NOTE WHAT \u00a7 300.101(20) STILL SAYS: hemp remains defined as the plant with 'a delta-9 tetrahydrocannabinol concentration of not more than 0.3 percent on a dry weight basis' \u2014 the statutory definition, untouched. The swap happens at \u00a7 300.101(1), 'acceptable hemp THC level,' which is a TOTAL delta-9 figure. THAT IS EXACTLY WHAT JUDGE GAMBLE MEANT by the rules preserving the definition 'in form' while replacing it 'in operation,' and you can now show it side by side from the rule text itself.", "status": "FILED", "sources": [{"label": "Texas Register \u2014 Adopted Rules, 25 TAC Ch. 300 (PRIMARY)", "url": "https://www.sos.state.tx.us/texreg/archive/March202026/Adopted%20Rules/25.HEALTH%20SERVICES.html"}], "isToday": true},
  {"date": "2026-03-20", "title": "\u2b50 DSHS's ENTIRE defense of the total-THC standard \u2014 four planks, in its own words", "detail": "THE MOST IMPORTANT COMMENT RESPONSE IN THE DOCUMENT. Commenters said the compliance threshold exceeds statutory authority. DSHS's full response rests on four planks: (1) Tex. Agric. Code \u00a7 121.001 defines hemp to include 'all derivatives, extracts, cannabinoids, isomers, acids, salts, and salts of isomers'; (2) Texas Department of Agriculture rules at 4 TAC \u00a7 24.26 say testing methodology should account for potential conversion of THCA to THC; (3) HSC \u00a7 443.051 requires rules consistent with federal law, and federal regulations account for THCA conversion; (4) Executive Order GA-56 directed that testing methods account for THCA conversion. \u26a0 TWO WEAKNESSES VISIBLE ON THE FACE OF IT, both usable. FIRST, DSHS cites the inclusion of 'acids' in \u00a7 121.001 as SUPPORT for counting THCA \u2014 but that is the industry's own text. The industry reads 'acids are part of lawful hemp' to mean THCA-bearing material IS hemp; DSHS reads the same clause to mean THCA counts toward the ceiling. Identical text, opposite conclusions, and DSHS never explains why its reading wins. SECOND, three of the four planks are about TESTING METHODOLOGY \u2014 the TDA rule, the federal regs, and GA-56 all concern how you measure. The appellees' brief argues the whole case turns on the difference between a testing method and a legal compliance standard. DSHS's own response conflates them, which is the accusation made against it, demonstrated in its own words.", "status": "FILED", "sources": [{"label": "Texas Register \u2014 Adopted Rules (PRIMARY)", "url": "https://www.sos.state.tx.us/texreg/archive/March202026/Adopted%20Rules/25.HEALTH%20SERVICES.html"}], "isToday": true},
  {"date": "2026-03-20", "title": "\u2b50\u2b50 CONVERTED CANNABINOIDS WERE NEVER DEFINED \u2014 DSHS punted to 'a future rulemaking'", "detail": "DIRECTLY RELEVANT TO KINGPIN KUSH AND THE TRACE-AMOUNT FIGHT. A comment in the record reads: 'Multiple commenters stated that converted cannabinoids and synthetic products are not addressed directly in the proposed rules, raising product safety concerns.' DSHS's response: 'DSHS disagrees and declines to make the suggested change at this time. The rules are consistent with Executive Order GA-56. DSHS WILL CONSIDER THE REQUESTED DEFINITION CHANGE IN A FUTURE RULEMAKING.' SO THE MARCH 2026 RULES CONTAIN NO DEFINITION OF CONVERTED OR SYNTHETIC CANNABINOIDS, and DSHS said so on the record while acknowledging the gap. That matters because four months later the agency began enforcing a natural-versus-converted line \u2014 the 'more than trace amounts' standard \u2014 that its own rules never defined and that it had expressly deferred. It is difficult to see how a distinction the agency declined to adopt through notice and comment becomes an enforceable threshold with felony consequences without further rulemaking. THIS IS THE STRONGEST DOCUMENTARY SUPPORT AVAILABLE FOR SERGI'S ARGUMENT before Judge Gamble, and it comes from DSHS rather than from the plaintiffs. RELATED: DSHS also declined to align with the federal 0.4mg-per-serving standard, saying it 'will consider the requested revision in a future rulemaking when the federal amendments take effect.'", "status": "OPEN", "sources": [{"label": "Texas Register \u2014 Adopted Rules (PRIMARY)", "url": "https://www.sos.state.tx.us/texreg/archive/March202026/Adopted%20Rules/25.HEALTH%20SERVICES.html"}], "isToday": true},
  {"date": "2026-03-20", "title": "\u26a0 DSHS ON ITS OWN ENFORCEMENT: 'administrative or civil rather than criminal'", "detail": "A SENTENCE WORTH HAVING GIVEN THE FELONY EXPOSURE STORY. Responding to commenters who wanted specific statutory penalties, DSHS wrote: 'DSHS relies on an administrative penalty matrix in making enforcement determinations. ALL ENFORCEMENT ACTIONS TAKEN BY DSHS ARE ADMINISTRATIVE OR CIVIL RATHER THAN CRIMINAL.' \u26a0 READ IT PRECISELY, AND DO NOT OVERCLAIM. This is DSHS describing ITS OWN enforcement powers under Chapter 300 \u2014 embargo, penalties, license revocation. It is NOT a statement that hemp products carry no criminal exposure. Criminal liability under Penalty Group 2 arises from Chapter 481 and is enforced by police and prosecutors, not DSHS, which is why the July 31 Schedule I reinstatement reaches possession while these rules do not. STILL USEFUL: it is a clean, sourced way to explain the two-track distinction on air \u2014 the agency that wrote the total-THC rules says its own tools are civil, and the felony exposure comes from somewhere else entirely.", "status": "FILED", "sources": [{"label": "Texas Register \u2014 Adopted Rules (PRIMARY)", "url": "https://www.sos.state.tx.us/texreg/archive/March202026/Adopted%20Rules/25.HEALTH%20SERVICES.html"}]},
  {"date": "2026-03-20", "title": "The fee justification, verbatim \u2014 and it contains no numbers", "detail": "THE APPELLEES' BRIEF CHARACTERIZES DSHS's FEE EXPLANATION AS CONCLUSORY. Having now read it, that characterization is fair, and you can verify it yourself. DSHS's complete response on fees: it cites HSC \u00a7 12.0111 as authority to recover direct and indirect costs, then states it 'made estimates of the costs necessary to support regular inspection of manufacturers and retailers, including inspector salaries and travel, laboratory testing costs, related legal and State Office of Administrative Hearing costs for resulting compliance actions, and assistance from the TABC and the Texas Department of Public Safety (DPS) per Executive Order GA-56,' and promises to 'reevaluate licensing fees periodically to ensure fees do not exceed the amount required to administer the program.' THAT IS THE WHOLE THING. Categories of cost, no dollar figures, no staffing counts, no inspection frequency, no revenue projection, and nothing connecting any of it to $10,000 and $5,000 specifically. Set against the fiscal note's $202,050,000 projected revenue and $69,315 in added agency cost, and the reasoned-justification requirement of \u00a7 2001.033, this is the APA claim in miniature. ALSO NOTE: DSHS wrote 'DSHS AGREES with this comment' on fees \u2014 because it lowered them from the proposed $25,000 and $20,000. Agreeing while still raising fees 40-fold is worth pointing out.", "status": "FILED", "sources": [{"label": "Texas Register \u2014 Adopted Rules (PRIMARY)", "url": "https://www.sos.state.tx.us/texreg/archive/March202026/Adopted%20Rules/25.HEALTH%20SERVICES.html"}]},
