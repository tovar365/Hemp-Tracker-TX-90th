    id: "dea-reschedule", label: "DEA Cannabis Rescheduling (ALJ Hearing, Arlington VA)", deadline: "Hearing concluded July 15 — briefs due Aug 17 — no decision timeline after that", colorVar: "--blue",
    events: [
      { date: "2026-06-29", title: "Evidentiary hearing opens", detail: "DEA Hearing Facility, Arlington, VA, 9:00 a.m. ET. Recess July 3-6 for the holiday.", status: "RESOLVED", sources: [{ label: "Vicente LLP", url: "https://vicentellp.com/insights/5-things-to-know-june-29-dea-cannabis-rescheduling-hearing/" }] },
      { date: "2026-06-xx", title: "NDASA director concedes on cross-examination", detail: "Employer drug testing can continue under company policy regardless of Schedule III rescheduling outcome — a concession relevant to workplace-testing messaging.", status: "RESOLVED", sources: [] },
      { date: "2026-07-15", title: "Testimony concludes — hearing length is reported inconsistently (11 vs 17); use the span, not a day count", detail: "ACCURACY FLAG: sources conflict. Vicente LLP's recap supports ~11 actual days in session; Marijuana Moment, Business of Cannabis and others repeatedly say '17-day proceedings.' The likely reconciliation is that 17 describes the June 29–July 15 calendar span (which included a July 3-6 holiday recess plus weekends) while 11 counts days actually in session — but I have not confirmed that reconciliation against the docket. Safest on-air phrasing: 'a hearing that ran from June 29 to July 15.' An earlier version of this tracker asserted 11 as a flat correction to 17; that was overconfident. The seven designated participants, all of whom opposed or doubted rescheduling: NDASA, Tennessee Bureau of Investigation, SAM, the states of Nebraska/Idaho/Indiana/Louisiana, DUID Victim Voices, Kenneth Finn, and Phillip Drum. Structural oddity worth noting: DEA — the agency that defended Schedule I for five decades — was the PROPONENT of rescheduling here, and its own witnesses spent the hearing defending marijuana's medical value and relative safety versus alcohol and opioids. Closing witnesses (states, July 14): Dr. Deepak Cyril D'Souza (Yale) mounted the strongest scientific challenge; Sheriff William Honsal (Humboldt County) gave the strongest illicit-market account but didn't tie it to the rescheduling question — and per Business of Cannabis conceded that regulation reduces crime.", status: "RESOLVED", sources: [{ label: "Vicente LLP — Final Week recap", url: "https://vicentellp.com/insights/final-week-dea-marijuana-rescheduling-hearing-ends-opposition-builds-appellate-record-but-leaves-statutory-gaps/" }, { label: "Business of Cannabis", url: "https://businessofcannabis.com/dea-rescheduling-hearing-closes-as-states-own-witness-concedes-regulation-reduces-crime" }, { label: "Cannabis Legalization News — participant list", url: "https://cannabislegalizationnews.com/dea-rescheduling-hearing-ends/" }] },
      { date: "2026-08-17", title: "UPCOMING (21 days out) — post-hearing briefs AND transcript corrections both due", detail: "On July 16, Chief ALJ Julius ordered post-hearing briefs due no later than Aug. 17 — same date as proposed transcript corrections. IMPORTANT NUANCE: the briefs are explicitly OPTIONAL. Julius wrote that 'this is a nonmandatory submission; therefore, a Designated Party will not be penalized for not filing a post-hearing brief, and the absence of a submission implies that no submission was intended.' Max 50 pages, one per party, and they carry the closing arguments since no time was allotted for them live. The order also invites argument on 'any other issue noted by the tribunal during the hearing' — which Vicente reads as opening the door to the definitional questions Julius pressed throughout. Setting both deadlines on the same date rather than sequencing them suggests the tribunal isn't building slack into the schedule. Sequence after: corrected transcript posted publicly on DEA's site → Julius issues a recommended decision (no deadline) → parties file exceptions → full record to the DEA Administrator, who is NOT bound by the recommendation → the Administrator's final order is the action reviewable under 21 U.S.C. §877. Do not describe a decision as imminent; no fixed timetable governs any step after Aug. 17.", status: "OPEN", sources: [{ label: "Marijuana Moment — Julius order", url: "https://www.marijuanamoment.net/federal-marijuana-rescheduling-hearing-wraps-up-with-dea-judge-laying-out-next-steps/" }, { label: "Vicente LLP — Final Week recap", url: "https://vicentellp.com/insights/final-week-dea-marijuana-rescheduling-hearing-ends-opposition-builds-appellate-record-but-leaves-statutory-gaps/" }] },
      { date: "2026-08-27", title: "Open question: DOT/MRO verification under Schedule III", detail: "Unresolved pending DOT rulemaking under 49 CFR Part 40. Flag as an open question, not a settled outcome, in any podcast or public-facing content. Historical precedent (1980s scheduling hearing) took ~2 years ALJ-to-recommendation and another 2 to final order — no assumption of speed here.", status: "OPEN", sources: [], isToday: true },

    events: [
      { date: "2026-04-22", title: "DOJ Blanche order reschedules state-legal medical marijuana + FDA-approved products to Schedule III", detail: "Acting AG Todd Blanche's final order moves state-regulated medical marijuana and FDA-approved marijuana drug products from Schedule I to Schedule III — the same order tracked on the DEA rescheduling front. All other marijuana (recreational, unlicensed bulk, hemp, delta-9-THC materials) remains Schedule I. This is the trigger event for the employment-law questions below.", status: "RESOLVED", sources: [{ label: "Ogletree", url: "https://ogletree.com/insights-resources/blog-posts/doj-orders-immediate-reclassification-of-medical-marijuana-products/" }] },
      { date: "2026-06-xx", title: "DOT guidance: marijuana remains prohibited for safety-sensitive positions regardless of scheduling", detail: "DOT has stated that until the rescheduling process is fully finalized and 49 CFR Part 40 is formally rewritten, marijuana remains a prohibited substance for DOT-regulated safety-sensitive employees (CDL holders, etc.) — rescheduling alone does not change drug-testing obligations. Ties directly to the NDASA cross-examination concession already tracked on the DEA Rescheduling front: employer testing can continue under company policy regardless of the rescheduling outcome.", status: "RESOLVED", sources: [{ label: "Verified First state guide", url: "https://verifiedfirst.com/blog/pre-employment-thc-drug-testing-laws/" }, { label: "Barley Snyder", url: "https://www.barley.com/presidential-reclassification-of-medical-marijuana-to-schedule-iii-no-change-yet-for-dot-regulated-employers/" }] },
      { date: "2026-08-27", title: "Open question: ADA accommodation claims for medical marijuana — unlitigated, and one popular claim is overstated", detail: "Multiple employment-law firms (Ogletree, Bradley/Cannabis Law Journal, Barley Snyder) frame this consistently as OPEN and UNLITIGATED: Schedule III status is a federal acknowledgment of \u201caccepted medical use,\u201d which undermines the reasoning courts have used to categorically deny ADA claims — but the ADA's \u201ccurrent illegal use\u201d exclusion has NOT been amended by Congress, and no court has yet ruled on a post-rescheduling ADA claim. Flag for podcast accuracy: one source (TimeTrex) claims the order \u201celevates state-approved medical marijuana certifications to the status of federal prescriptions,\u201d instantly extending ADA protection to ~6 million patients — this is a stronger claim than the specialized employment-law sources support and should be treated as disputed/unverified, not reported as settled fact.", status: "OPEN", sources: [{ label: "Bradley / Cannabis Law Journal", url: "https://journal.cannabislawreport.com/bradley-schedule-iii-and-the-workplace-how-marijuana-rescheduling-could-reshape-employment-law/" }, { label: "HR Brew", url: "https://www.hr-brew.com/stories/rescheduling-marijuana-workplace-compliance" }, { label: "TimeTrex (compare/contrast — stronger claim)", url: "https://www.timetrex.com/blog/us-pre-employment-drug-testing-policy" }], isToday: true },
      { date: "2026-03-31", title: "Texas: Compassionate Use Program grants no employment protections; employers retain full testing discretion", detail: "Texas has NO pre-employment drug-testing statute — employers can test at any stage, using any method, with no restriction on what substances they screen for. Texas Labor Code §21.120 affirmatively permits employers to deny employment to Schedule I/II substance users. Texas Labor Code §411.083 governs testing procedure generally but doesn't restrict content. Registered Compassionate Use Program (CUP) patients have NO protection — Texas is at-will with no state-level workplace protection for medical marijuana, unlike Arizona or New Jersey. The March 31 THCA/total-THC rule change (tracked on the THBC v. DSHS front) does not change drug-testing methodology — a positive test result is a positive result regardless of a product's legal status at time of purchase.", status: "RESOLVED", sources: [{ label: "Rogge Dunn Group", url: "https://roggedunngroup.com/marijuana-laws-for-texas-employers.html" }, { label: "DrugScreens.com — CUP vs. testing", url: "https://www.drugscreens.com/blogs/awareness/texas-medical-marijuana-laws-vs-workplace-drug-screening-what-employers-need-to-know" }, { label: "Kress Inc. — THCA & drug testing", url: "https://kressinc.com/blog/thca-ban-in-texas-and-drug-testing/" }] },
      { date: "2026-08-27", title: "National patchwork: states diverging sharply on pre-employment testing rules", detail: "2026 state legislative activity shows real divergence: Iowa HF 2206 bars employment denial for lawful off-duty use but preserves discipline for impairment; Kansas HB 2678 bars discrimination against medical patients absent \u201cbusiness necessity\u201d while HB 2679 protects employer on-property authority; Oklahoma HB 1714 bars discrimination based on off-duty use or nonpsychoactive-metabolite-only test results; Massachusetts H.2179 (pending) would bar pre-employment testing until after a conditional job offer; North Carolina — UPDATED Jul 31: the live vehicle is HB 328, not S 350. HB 328 is a conference report agreed by both chambers' lead negotiators (House Majority Leader Brenden Jones among them); the Senate passed it 37-6 on July 2, but the House adjourned that day without voting, with Speaker Destin Hall saying his chamber needed more time. On July 27 a coalition of NC's leading law-enforcement and prosecutor groups sent a letter urging the House to act next week, explicitly framed as a counter to lobbying against the bill. Notable for the podcast: HB 328 uses the SAME 0.4mg total-THC-per-container threshold as the federal Nov. 12 ban, plus an age-21 sales ban with penalties for both sellers and underage possessors — so a state is voluntarily adopting the federal cliff's number. Hemp producers say the threshold is low enough to ban most products on the market including non-intoxicating ones; Minnesota (Stat. §181.951–.957, already in effect) is among the most protective states for off-duty use. \u2b50 UPDATE NOV 10: HB 507 (Bucy) was prefiled for the 2027 session and would bar STATE AGENCIES AND POLITICAL SUBDIVISIONS from drug testing most employees and contractors for cannabinoids, or penalizing lawful low-THC medical cannabis or consumable hemp use \u2014 the first Texas statutory employment protection of its kind. PUBLIC EMPLOYERS ONLY; does not reach private employers or DOT safety-sensitive positions. See Track I. Separately, SHRM and multiple industry sources report employers in retail/hospitality/logistics/construction are quietly dropping cannabis from pre-employment panels for non-safety-sensitive roles, citing labor-market pressure rather than any legal mandate.", status: "OPEN", sources: [{ label: "Current Consulting Group — 2026 state roundup", url: "https://currentconsultinggroup.com/2026-state-cannabis-psychedelic-legislation-what-employers-need-to-know-now/" }, { label: "Universal Background — employer guide", url: "https://universalbackground.com/2026/01/12/workplace-drug-testing-in-2026-what-employers-need-to-know/" }, { label: "Forbes — workplace changes", url: "https://www.forbes.com/sites/bryanrobinson/2026/04/06/cannabis-laws-quietly-creating-6-surprising-workplace-changes-in-2026/" }, { label: "MN Cannabis Hub", url: "https://mncannabishub.com/news/minnesota-cannabis-drug-testing-employment-rights-2026" }, { label: "WUNC — NC HB 328 (Jul 27)", url: "https://www.wunc.org/politics/2026-07-27/law-enforcement-prosecutors-nc-house-to-pass-hemp-regulations" }], isToday: true },

    id: "caoa", label: "Cannabis Administration and Opportunity Act (CAOA)", deadline: "Reintroduced July 16, 2026 — not expected to pass in 2026", colorVar: "--green",
    events: [
      { date: "2024-05-01", title: "Prior version (S. 4226, 118th Congress) dies without a floor vote", detail: "Introduced by Sen. Cory Booker. Fourth attempt at this bill overall (2021, 2022, 2024 all died without a floor vote) — worth noting the pattern when assessing 2026 odds.", status: "WITHDRAWN", sources: [{ label: "GovTrack", url: "https://www.govtrack.us/congress/bills/118/s4226" }] },
      { date: "2026-07-16", title: "Reintroduced in the Senate", detail: "Sens. Schumer, Booker, and Wyden reintroduce CAOA with 15 original cosponsors. Full descheduling bill — removes cannabis entirely from the Controlled Substances Act, not a reclassification. Bundles worker protections (OSHA/FLSA coverage, workplace safety standards, research funding), automatic expungement of federal non-violent cannabis convictions + resentencing eligibility, state expungement incentive funding, and equity licensing/ownership provisions funded by industry taxes.", status: "FILED", sources: [{ label: "MG Magazine", url: "https://mgmagazine.com/cannabis-news/cannabis-administration-opportunity-act-caoa-2026/" }, { label: "Drug Policy Alliance summary", url: "https://drugpolicy.org/resource/cannabis-administration-and-opportunity-act-caoa/" }] },
      { date: "2026-07-19", title: "UFCW endorsement", detail: "United Food and Commercial Workers union endorses CAOA — first major labor endorsement noted in coverage so far.", status: "OPEN", sources: [{ label: "Redheaded Blackbelt", url: "https://kymkemp.com/2026/07/19/ufcw-endorses-the-cannabis-administration-and-opportunity-act/" }] },
      { date: "2026-08-27", title: "Status as of today (Tue Nov 10): 17 total sponsors, no GOP engagement reported, won't pass in 2026", detail: "Sponsor count refined: The Marijuana Herald's full 2025-26 bill census puts CAOA at 17 total sponsors (vs. the '15 original cosponsors' figure in earlier coverage — the difference is whether lead sponsors are counted, so cite '17 total sponsors' or '15 original cosponsors plus three leads,' not both as if they conflict). Framed in coverage as a competing theory of reform against the DEA Schedule III rescheduling track: rescheduling leaves federal criminal exposure, banking barriers, and interstate commerce restrictions largely intact; CAOA removes cannabis from the CSA outright. No Senate Republican engagement reported yet. Polling above 65% nationally and midterm-year pressure in swing states are cited as background, but analysts read this as setting terms for a future Congress, not a live 2026 vote. Marijuana-focused, not hemp-specific — keep distinct from the hemp-definition fights for podcast accuracy.", status: "PENDING", sources: [{ label: "Marijuana Herald — full bill census", url: "https://themarijuanaherald.com/2026/07/every-cannabis-bill-introduced-during-the-2025-2026-session-of-u-s-congress/" }, { label: "Cannabis Legalization News", url: "https://cannabislegalizationnews.com/cannabis-administration-opportunity-act-2026/" }], isToday: true },

  {
    id: "monti-federal", label: "Track 4a \u2014 Monti v. Garcia: Federal Challenge to the TX Isomer Ban", deadline: "Filed Jul 31 \u00b7 TRO DENIED Aug 9 on THREE grounds (Dkt. 16) \u00b7 State not yet answered; no PI hearing date", colorVar: "--blue",
    events: [
      { date: "2026-07-31", title: "\u26a0 TRACK 4a \u2014 federal constitutional challenge filed the same day the ban took effect", detail: "Monti, et al. v. Garcia, et al., No. 3:26-cv-00254, U.S. District Court, S.D. Tex., Galveston Division. PLAINTIFFS, chosen to cover three distinct injury profiles: (1) THOMAS MONTI \u2014 retired Illinois State Police officer and former SWAT operator, League City resident, manages a Galveston County hemp retailer, and a personal delta-8 user for PTSD and chronic pain. A retired law-enforcement officer as lead plaintiff on a criminalization challenge is a deliberate and unusually strong framing choice. (2) LIFTED LIQUIDS, INC. \u2014 Wisconsin-based manufacturer with roughly $6.7M in Texas-bound inventory at risk and about 140 Texas wholesale accounts; cut headcount from 102 to 75 since the injunction dissolved, which is documented economic injury tied to a specific date rather than projected harm. (3) THE HAPPY CACTUS APOTHECARY LLC \u2014 Austin retailer and manufacturer whose house-brand delta-8 is made in Oregon and sold in roughly 25 states, making it the cleanest interstate-commerce vehicle of the three. DEFENDANTS, all official capacity: Imelda Garcia (Interim DSHS Commissioner), Ken Paxton (AG), Kenneth A. Cusick (Galveston County Criminal DA), Jimmy Fullen (Galveston County Sheriff) \u2014 suing individual officials rather than the agency is what makes Ex parte Young available. COUNSEL: Andrea Steel and Imani Hutty (The Banks Law Firm, P.A.), Jim Thorburn (Thorburn Law Group), Susan Burns (S Burns Legal PLLC).", status: "FILED", sources: [{ label: "WFAA \u2014 independent confirmation", url: "https://www.wfaa.com/article/news/local/texas/texas-thc-ban-new-federal-lawsuit/287-9ba897f3-2f95-4348-a81d-2fde4283a3e6" }, { label: "Galveston Daily News \u2014 Monti profile", url: "https://www.galvnews.com/news/new-state-enforcement-sends-several-hemp-products-up-in-smoke-across-galveston-county/article_1d86f36f-5398-4b60-978c-e1269b0a384a.html" }] },
      { date: "2026-07-31", title: "FOUR claims \u2014 corrected from an earlier tracker entry that said three", detail: "(1) DECLARATORY JUDGMENT that hemp status turns solely on delta-9 THC concentration under 7 U.S.C. \u00a7 1639o(1) \u2014 the federal statutory definition, mirroring the Texas Agric. Code \u00a7 121.001 argument already in this tracker. (2) VOID FOR VAGUENESS / Due Process via 42 U.S.C. \u00a7 1983 \u2014 no objective test distinguishes naturally occurring from converted THCs, which converts Andrea Steel\u2019s own public warning (officers cannot determine cannabinoid composition from packaging) into a cause of action. (3) PREEMPTION under the Supremacy Clause and 2018 Farm Bill \u00a7 10114(b), brought via Ex parte Young. (4) COMMERCE CLAUSE under Pike balancing, via \u00a7 1983. Note that claims 2 and 4 are \u00a7 1983 claims while claim 3 runs through Ex parte Young \u2014 different procedural vehicles, which matters if any single theory is knocked out.", status: "PENDING", sources: [{ label: "WFAA", url: "https://www.wfaa.com/article/news/local/texas/texas-thc-ban-new-federal-lawsuit/287-9ba897f3-2f95-4348-a81d-2fde4283a3e6" }] },
      { date: "2026-07-31", title: "Why Sky Marketing does not foreclose this \u2014 and the record supports the argument", detail: "No plaintiff here was a party to Sky Marketing. The complaint argues that decision\u2019s sovereign-immunity holding does not foreclose federal Ex parte Young jurisdiction, and INDEPENDENT REPORTING CORROBORATES THE PREMISE: Houston Public Media reported that the justices ruled DSHS is protected by sovereign immunity because Texas law gives the commissioner classification authority \u2014 and headlined its coverage with the point that hemp businesses can still sue to stop it. The Texas Supreme Court expressly declined to reach the merits. Ex parte Young is the standard route around sovereign immunity precisely by suing officials in their official capacity for prospective relief, which is why the defendant list is structured the way it is. Also distinct from Track 1 (THBC v. DSHS), which is a state-law APA challenge to the separate March 2026 total-THC rules. Three different cases, three different legal theories, one overlapping law firm.", status: "OPEN", sources: [{ label: "Houston Public Media \u2014 sovereign immunity holding", url: "https://www.houstonpublicmedia.org/articles/news/business/2026/05/01/550695/department-of-state-health-services-can-criminalize-delta-8-for-now-texas-supreme-court-rules-marijuana-hemp/" }] },
      { date: "2026-07-31", title: "The notice-and-effective-date problem feeding the due-process claim", detail: "The Reinstated Definitions were republished July 10, 2026 at 51 Tex. Reg. 4597. But the July 31 effective date was NOT stated on the face of the rule \u2014 it was announced only via the DSHS website and a July 29 HHSC listserv email, two days before enforcement began. Plaintiffs fold this into the due-process argument: regulated parties had to monitor an agency website and an email list to learn when conduct became felonious. This echoes a point already in this tracker from THBC, which separately flagged that DSHS issued no public announcement beyond the Register entry and its schedule page. SEPARATE ARGUMENT WORTH AIRING: the complaint notes that P.L. 119-37\u2019s federal hemp-ban provisions do not take effect until November 12, 2026, and argues Texas is accelerating a timeline Congress deliberately delayed \u2014 a federalism framing that pairs naturally with the preemption count.", status: "OPEN", sources: [{ label: "THBC notice \u2014 no public announcement", url: "https://texashempbusinesscouncil.com/dshs-adds-non-delta-9-thcs-to-controlled-substances-list-effective-july-31-2026/" }] },
      { date: "2026-08-27", title: "\u274c TRO DENIED Aug 9 \u2014 preliminary injunction still pending", detail: "UPDATED Aug 27 \u2014 SUPERSEDES THE EARLIER WARNING IN THIS ENTRY. U.S. District Judge JEFFREY V. BROWN denied the emergency TRO on Sunday, Aug 9, 2026, finding irreparable harm insufficiently shown. THE PRELIMINARY INJUNCTION MOTION REMAINS PENDING with fuller briefing and an evidentiary hearing to come, and NO PUBLIC HEARING DATE has been set. That PI ruling, not the TRO, is the one that will actually matter. Retained for context on the earlier confusion: the July 31 filing consisted of a complaint, an emergency TRO motion, AND a proposed order with BLANK, UNSIGNED signature lines. A proposed order is a document plaintiffs draft and submit FOR a judge to sign \u2014 it is not a ruling and carries no legal effect until signed. It is easy to mistake a proposed order circulating in press materials for a granted TRO, and that error would be significant. The proposed order was never signed \u2014 it was denied outright on Aug 9. Say the TRO was DENIED and the preliminary injunction is pending. SEPARATE VERIFICATION GAP: the docket number 3:26-cv-00254 and the four-claim structure trace to a Texas Hemp Business Council press release, which is advocacy material rather than a primary filing. WFAA independently confirms plaintiffs, the July 31 filing date, and the Farm Bill preemption theory \u2014 but the docket number itself has NOT been confirmed against PACER. STAKES: a granted TRO would pause enforcement statewide and is the only realistic near-term route to restoring these products, since THBC has stated it will not pursue further delta-8 litigation absent outside funding and the Texas Supreme Court has closed the state-law avenue.", status: "PENDING", sources: [], isToday: true },,
      {"date": "2026-08-09", "title": "\u2b50 PRIMARY SOURCE \u2014 TRO order (Dkt. 16) obtained via PACER; THREE independent grounds, not one", "detail": "MAJOR UPGRADE FROM SECONDARY TO PRIMARY. Docket and signed order pulled directly from PACER, case 3:26-cv-00254 (S.D. Tex., Galveston Div.). DATE CONFIRMED: TRO denied and ENTERED AUGUST 9, 2026. The Aug 10 date carried by Haze Connect and repeated in earlier tracker checks was wrong; Vicente LLP's original Aug 9 citation was correct. JUDGE: Jeffrey Vincent Brown, U.S. District Judge. Jurisdiction 28 U.S.C. \u00a7 1331 (federal question); Nature of Suit 950 \u2014 Constitutional, State Statute. \u26a0 THIS CORRECTS MY OWN CHARACTERIZATION. Earlier tracker entries said the TRO was denied for insufficient irreparable harm, following press coverage. The order is broader than that: it denied on THREE INDEPENDENT GROUNDS, two of which are likelihood-of-success findings against the plaintiffs' central constitutional theories. That is a materially worse outcome than 'they didn't show enough harm,' and anyone repeating the press framing is understating it.", "status": "RESOLVED", "sources": [{"label": "PACER \u2014 S.D. Tex. 3:26-cv-00254, Dkt. 16 (order, entered 8/9/26)", "url": ""}], "isToday": true},
      {"date": "2026-08-09", "title": "The three grounds \u2014 with the circuit precedent the court leaned on", "detail": "GROUND 1 \u2014 VAGUENESS / 14TH AMENDMENT DUE PROCESS: no likelihood of success. Court cited BIO GEN LLC v. SANDERS, 142 F.4th 591, 604 (8th Cir. 2025), which upheld an Arkansas law classifying delta-8 THC as a Schedule VI controlled substance against a vagueness challenge. GROUND 2 \u2014 DORMANT COMMERCE CLAUSE: no likelihood of success, citing N. VIRGINIA HEMP & AGRIC., LLC v. VIRGINIA, 125 F.4th 472, 497 (4th Cir. 2025), which found a Virginia delta-8 restriction did not unduly burden interstate commerce. GROUND 3 \u2014 PREEMPTION / IRREPARABLE HARM: the court found plaintiffs did NOT allege facts showing a need to ship product THROUGH Texas in interstate commerce \u2014 the harm alleged was loss of the TEXAS MARKET ITSELF, which does not meet the 'more than mere speculation' standard for emergency relief, citing JANVEY v. ALGUIRE, 647 F.3d 585, 600 (5th Cir. 2011). \u26a0 WHY GROUND 3 IS THE MOST FIXABLE: it is a PLEADING problem, not a merits holding. The court is saying they pled the wrong harm \u2014 losing Texas sales rather than being blocked from moving goods across Texas. Lifted Liquids is a Wisconsin manufacturer with ~140 Texas wholesale accounts and The Happy Cactus makes product in Oregon for ~25 states, so the interstate-transit facts may well exist and simply were not pled that way. Expect that to be repaired in the preliminary-injunction briefing. GROUNDS 1 AND 2 ARE HARDER \u2014 two federal circuits have now rejected materially similar challenges to state delta-8 restrictions, and that is the wall this case has to get over.", "status": "RESOLVED", "sources": [{"label": "PACER \u2014 Dkt. 16", "url": ""}], "isToday": true},
      {"date": "2026-08-25", "title": "Docket sequence \u2014 merits briefing is still in its earliest stage", "detail": "FULL SEQUENCE from the docket: 07/31/26 complaint filed (Dkt. 1). 08/06/26 defendants' oppositions to the TRO motion (Dkt. 11, 12), plus a corrected opposition (Dkt. 13). 08/07/26 plaintiffs' reply in support (Dkt. 15). 08/09/26 ORDER DENYING TRO (Dkt. 16). 08/20\u201308/25/26 defendants seeking EXTENSIONS to respond to the complaint (Dkt. 19, 21). WHAT THAT LAST LINE MEANS PRACTICALLY: the State has not yet answered or moved to dismiss, so the preliminary-injunction fight has not been joined and no PI hearing date exists. Anyone expecting a quick federal ruling should recalibrate \u2014 this case is weeks from being briefed, let alone decided. Contrast with the state track, where THBC briefing is complete at the 15th COA and Kingpin Kush had a TRO hearing today. MINOR NOTE: the source summary reads 'TRO denied in full (Dkt. 1)' \u2014 Dkt. 1 is the complaint; the denial is Dkt. 16. Treat as a transcription slip, not a docket ambiguity.", "status": "PENDING", "sources": [{"label": "PACER \u2014 S.D. Tex. 3:26-cv-00254 docket", "url": ""}], "isToday": true},
      {"date": "2026-10-01", "title": "\u2b50\u2b50 AMENDED COMPLAINT + MOTION FOR SUMMARY JUDGMENT \u2014 they are asking for the case to end now", "detail": "Counsel update distributed through THBC, Oct 1, 2026, from Andrea Steel and Imani Hutty (The Banks Law Firm), Jim Thorburn (Thorburn Law Group) and Susan Burns (S. Burns Legal PLLC). PLAINTIFFS FILED A FIRST AMENDED COMPLAINT AND MOVED FOR SUMMARY JUDGMENT. \u2b50 MOVING FOR SUMMARY JUDGMENT THIS EARLY \u2014 before an answer, before discovery, before a case-management conference \u2014 IS THE TELL. It means they are treating this as a PURE QUESTION OF LAW requiring no factual development, which is exactly right for a preemption claim: either the federal statute displaces the state classification or it does not, and no amount of evidence changes that. It also sidesteps the irreparable-harm problem that sank the TRO, because summary judgment has no such element. RELIEF SOUGHT: a declaration that the rule is invalid and an order stopping enforcement. NO MONEY DAMAGES. \u26a0 THE DECLARATION REQUEST IS DELIBERATELY BROAD \u2014 counsel states they are 'asking the court to rule on the regulation itself, not only as it applies to our clients.' That is the same scope question the State is fighting at the 15th COA in THBC, now raised in federal court by different counsel in a different posture. NOTHING HAS CHANGED ON THE GROUND: counsel is explicit that until the judge rules, the Schedule I treatment of hemp-derived THCs other than up to 0.3% delta-9 remains in effect and enforceable.", "status": "FILED", "sources": [{"label": "Counsel update via THBC (user-supplied)", "url": ""}], "isToday": true},
      {"date": "2026-10-01", "title": "\u2b50 THEY DROPPED THE COMMERCE CLAUSE CLAIM \u2014 and that is the right call", "detail": "THE AMENDED COMPLAINT ABANDONS THE DORMANT COMMERCE CLAUSE COUNT. Counsel's reasoning: on Aug 9 Judge Brown was not convinced they would win on either the vagueness or interstate-burden theories, so they dropped the weakest and rebuilt around the two strongest. \u2b50 THIS TRACKER FLAGGED EXACTLY WHY THAT CLAIM WAS DOOMED: Judge Brown cited N. VIRGINIA HEMP & AGRIC., LLC v. VIRGINIA, 125 F.4th 472 (4th Cir. 2025), holding a Virginia delta-8 restriction did not unduly burden interstate commerce. Running a claim the judge has already rejected on circuit authority is a liability, not an asset. NOTE WHAT ELSE WENT WITH IT: LIFTED LIQUIDS IS NO LONGER A PARTY. That is not a coincidence \u2014 Lifted Liquids was the Wisconsin manufacturer, the interstate nexus that made the Commerce Clause claim pleadable. Drop the claim, and the out-of-state plaintiff no longer carries weight. \u2b50 COUNSEL'S READ OF THE AUG 9 RULING MATCHES THIS TRACKER'S: on preemption, they say the judge held only that 'our emergency showing wasn't enough by itself' and LEFT THE CORE LEGAL QUESTION OPEN. That is consistent with the order, which faulted the pleading \u2014 no facts alleged showing a need to ship THROUGH Texas \u2014 rather than reaching the merits of preemption.", "status": "RESOLVED", "sources": [{"label": "Counsel update via THBC (user-supplied)", "url": ""}, {"label": "PACER \u2014 Dkt. 16 TRO order", "url": ""}], "isToday": true},
      {"date": "2026-10-01", "title": "\u2b50\u2b50 COUNT I \u2014 the preemption theory, stated at its cleanest", "detail": "THE ARGUMENT, in counsel's framing: Congress SPECIFICALLY REMOVED hemp and its derivatives from the Controlled Substances Act and from federal Schedule I. Texas then used its own Controlled Substances Act to place THAT SAME CATEGORY into Texas Schedule I. When a state's controlled-substance classification conflicts with the federal classification, federal law controls. \u2b50 AND THE LINE THAT MATTERS STRATEGICALLY: 'If Count I prevails, THERE IS NOTHING FURTHER TO DECIDE.' That is a clean, single-issue case \u2014 no balancing, no factual record, no discretion. \u26a0 THE OBVIOUS COUNTER, which the State will run and which this tracker should hold alongside the claim: two federal circuits have held states MAY regulate hemp more strictly than federal law \u2014 Green Room LLC v. Wyoming, 157 F.4th 1196 (10th Cir. 2025), and Bio Gen LLC v. Sanders, 142 F.4th 591 (8th Cir. 2025), both cited in the Texas AG's reply brief at the 15th COA. The industry's answer has to be that there is a difference between regulating hemp more strictly and RECLASSIFYING AS A CONTROLLED SUBSTANCE something Congress affirmatively removed from the schedules. That distinction is the whole ballgame on Count I, and no court has squarely resolved it.", "status": "PENDING", "sources": [{"label": "Counsel update via THBC (user-supplied)", "url": ""}], "isToday": true},
      {"date": "2026-10-01", "title": "\u2b50\u2b50 COUNT II \u2014 vagueness, REFRAMED as four statutes pointing four directions", "detail": "THIS IS A DIFFERENT VAGUENESS THEORY FROM THE ONE THAT LOST IN AUGUST, and the change is the point. The original claim was that the trace-amount line was unclear \u2014 the kind of argument Judge Brown rejected on Bio Gen, where the 8th Circuit held Arkansas's delta-8 scheduling was not unconstitutionally vague. THE NEW FRAMING IS NOT 'THIS TERM IS FUZZY' BUT 'THESE STATUTES CONTRADICT EACH OTHER.' Counsel: Texas law points in FOUR DIFFERENT DIRECTIONS about the same products \u2014 describing hemp-derived THC products as 'foods, not controlled substances,' and specifically EXCLUDING them from the definition of 'controlled substance,' while SIMULTANEOUSLY listing them as Schedule I \u2014 and nothing tells a retailer, a consumer, or a police officer which one actually controls. \u2b50 EVERY PROVISION IN THAT ARGUMENT IS ALREADY PRIMARY-SOURCED IN THIS TRACKER: Tex. Health & Safety Code \u00a7 443.204(1), rules must reflect that hemp-derived cannabinoids 'are not considered controlled substances or adulterants'; \u00a7 443.204(2), products intended for ingestion are 'considered foods, not controlled substances'; \u00a7 481.002(5), 'controlled substance' does not include hemp 'or the tetrahydrocannabinols in hemp'; against the reinstated Schedule I listing at 51 Tex. Reg. 4597. BIO GEN DOES NOT ANSWER THIS. Arkansas had one statute that was arguably unclear; Texas has four provisions that cannot all be true at once. Pleaded in the alternative \u2014 it only matters if the court first holds the provisions can operate together.", "status": "PENDING", "sources": [{"label": "Counsel update via THBC (user-supplied)", "url": ""}, {"label": "HB 1325 enrolled text (PRIMARY)", "url": "https://legiscan.com/TX/text/HB1325/id/2026154"}], "isToday": true},
      {"date": "2026-10-01", "title": "New plaintiff: BOTANY SCIENTIFICS, San Antonio \u2014 and why the swap makes sense", "detail": "BOTANY SCIENTIFICS, a NATIONWIDE HEMP PRODUCT DISTRIBUTOR BASED IN SAN ANTONIO, has joined Thomas Monti and The Happy Cactus Apothecary as a plaintiff. LIFTED LIQUIDS IS OUT. \u2b50 THE STANDING PROFILE SHIFTED DELIBERATELY. The original lineup was built for a Commerce Clause case: a Wisconsin manufacturer shipping into Texas, an Oregon-made product sold in 25 states, plus an individual consumer. With that claim gone, the case needs plaintiffs whose injury is being CRIMINALIZED IN TEXAS, not burdened in interstate transit. Botany Scientifics supplies that \u2014 Texas-based, so its exposure is to Texas Schedule I enforcement directly, while its nationwide distribution keeps a federal-law hook alive for the preemption count without depending on the transit theory the judge found unpled. REMAINING LINEUP: Thomas Monti, retired Illinois State Police and former SWAT, League City, manages a Galveston County retailer and uses delta-8 for PTSD and chronic pain; The Happy Cactus Apothecary, Austin; and Botany Scientifics, San Antonio. One consumer, one retailer, one distributor \u2014 all Texas-facing.", "status": "FILED", "sources": [{"label": "Counsel update via THBC (user-supplied)", "url": ""}], "isToday": true},
      {"date": "2026-10-09", "title": "\u26a0 DEADLINE \u2014 Defendants' response to the amended complaint", "detail": "Defendants must respond to the First Amended Complaint by OCTOBER 9, 2026, absent an extension. WATCH WHAT FORM IT TAKES: an answer concedes the case proceeds; a motion to dismiss signals they will fight on jurisdiction or failure to state a claim before reaching preemption. Note the State has already sought extensions once in this case \u2014 docket entries 19 and 21 reflect requests between Aug 20 and Aug 25 \u2014 so another is plausible and would push everything right.", "status": "OPEN", "sources": [{"label": "Counsel update via THBC (user-supplied)", "url": ""}]},
      {"date": "2026-10-20", "title": "\u26a0 DEADLINE \u2014 Defendants' response to the summary judgment motion", "detail": "Defendants must respond to the Motion for Summary Judgment by OCTOBER 20, 2026, absent an extension. \u2b50 THIS IS THE FILING THAT WILL SHOW THE STATE'S PREEMPTION ARGUMENT IN FULL for the first time. Expect Green Room v. Wyoming and Bio Gen v. Sanders, the states-may-regulate-more-strictly line, plus a likely argument that summary judgment is premature without discovery under Fed. R. Civ. P. 56(d). If they move for a continuance rather than responding on the merits, that itself signals they do not want this decided as a pure question of law.", "status": "OPEN", "sources": [{"label": "Counsel update via THBC (user-supplied)", "url": ""}]},
      {"date": "2026-11-04", "title": "\u26a0\u26a0 FIRST CASE-MANAGEMENT CONFERENCE \u2014 eight days before the federal deadline", "detail": "Set for NOVEMBER 4, 2026, with the parties to submit a proposed case schedule beforehand. \u2b50 THE DATE IS THE STORY. It falls EIGHT DAYS BEFORE the Nov 12 federal effective date and five weeks before Dec 11. A judge setting a schedule on Nov 4 will be doing so with the federal landscape about to shift underneath the case \u2014 and the preemption count depends on what federal law says. If \u00a7 781 takes effect and narrows the federal hemp definition, the preemption argument changes character: Congress would no longer have 'removed' these cannabinoids from the schedules in the same way. \u26a0 THAT IS A REAL RISK TO COUNT I AND IT CUTS BOTH WAYS WITH THE TIMING. Faster is better for the plaintiffs here, same as at the 15th COA. Whether the MSJ gets decided before Nov 12 is the single most consequential scheduling question in this track.", "status": "OPEN", "sources": [{"label": "Counsel update via THBC (user-supplied)", "url": ""}]}

  {
    id: "enforcement-watch", label: "Track E \u2014 Retail Enforcement Watch (unconfirmed agency actions)", deadline: "\u26a0 Developing local reporting \u2014 NOT confirmed enforcement events; do not merge into Tracks A-D", colorVar: "--amber",
    events: [
      { date: "2026-08-18", title: "\u26a0 WHAT THIS TRACK IS FOR \u2014 and why it is quarantined from the others", detail: "This track holds RAIDS AND SEIZURES REPORTED IN LOCAL NEWS that have not been confirmed by any agency, warrant, or charging document. It exists so these events can be watched without contaminating Tracks A through D, which carry court filings and agency records. NOTHING HERE MEETS THE SOURCING BAR FOR ON-AIR USE AS A CONFIRMED ENFORCEMENT ACTION. The standard to apply: a single local TV report, updated once within an hour, with no agency named and no charges confirmed, is DEVELOPING coverage \u2014 treat it as \u2018reports say\u2019 rather than \u2018police did.\u2019 An attorney describing his own client\u2019s business as lawful and licensed is a party-interested characterization, not a verified fact, and should be attributed as such every time.", status: "OPEN", sources: [], isToday: true },
      { date: "2026-08-18", title: "Blvck Diamond raid \u2014 West Hildebrand Ave near I-10, San Antonio", detail: "Reported by Christopher Hoffman, News 4 San Antonio (WOAI), published 11:26 AM and updated 12:35 PM Aug 18, 2026. WHAT IS REPORTED: a search warrant was served that morning; several people were seen in handcuffs outside. WHAT IS EXPLICITLY UNKNOWN, per the report itself: which law enforcement agency led the operation, what investigators were searching for, and whether anyone had been arrested. Handcuffs at a scene are not arrests \u2014 detention during warrant execution is routine. ATTORNEY DANIEL MEHLER, representing Blvck Diamond and its owners, said at the time of the report that he had not been given a copy of the warrant and did not know what investigators were seeking. He described the business as a lawful, licensed hemp dispensary that has previously cooperated with law enforcement on other neighborhood investigations, and tied the raid to broader regulatory uncertainty \u2014 citing the Texas Supreme Court delta-8 decision and the state\u2019s testing and rulemaking changes \u2014 saying the industry is scrambling to interpret what is currently legal to sell. THAT CAUSAL LINK IS MEHLER\u2019S FRAMING AND IS UNVERIFIED INDEPENDENTLY. SOURCE SPREAD IS NARROWER THAN IT LOOKS: News 4 San Antonio and Sinclair sister station NewsChannel 9 carry IDENTICAL TEXT \u2014 that is one newsroom syndicated, not two independent confirmations. No SAPD, DPS, or District Attorney statement has surfaced.", status: "PENDING", sources: [{ label: "News 4 San Antonio (WOAI) \u2014 Christopher Hoffman", url: "" }], isToday: true },
      { date: "2026-08-18", title: "Comparable case for scale \u2014 North Texas DPS operation (NO established link)", detail: "Included only to show what a documented multi-agency hemp-retail operation looks like, so the Blvck Diamond reporting can be sized against something real. DO NOT PRESENT THESE AS RELATED \u2014 no connection between them has been established. Per CBS News: a DPS-led operation seized approximately $4.8 MILLION in cash, vehicles, jewelry and firearms from two smoke shops in Dallas and Kaufman counties over alleged illegal drug distribution. The retailers\u2019 attorney countered that they are federally legal hemp small businesses targeted by questionable police actions, and said they hold COAs confirming compliance. NOTE THE PATTERN, which is the actually useful observation: the same defensive posture appears in both matters \u2014 licensed operator, COAs in hand, compliance asserted, enforcement characterized as overreach. Whether that posture holds up is exactly what a warrant affidavit or charging instrument would show, and in neither case is one public.", status: "OPEN", sources: [{ label: "CBS News \u2014 North Texas seizure", url: "" }] },
      { date: "2026-08-18", title: "Intersection with the PIA track \u2014 conditional, not yet triggered", detail: "IF SAPD turns out to be the lead agency on the Blvck Diamond warrant, this stops being a separate watch item and becomes directly relevant to the SAPD Open Records request already pending in the PIA track \u2014 the one seeking evidentiary standards for distinguishing Schedule I cannabinoids from compliant hemp. A warrant executed against a licensed hemp retailer while that request is outstanding would make the agency\u2019s internal distinguishing criteria considerably more newsworthy, and would be a natural basis for a narrow supplemental request. UNTIL AGENCY IDENTITY IS CONFIRMED, KEEP THEM SEPARATE. If DPS led it, the North Texas operation above becomes the more relevant comparison and the PIA angle shifts to the undrafted DPS request instead.", status: "OPEN", sources: [], isToday: true },
    ],
